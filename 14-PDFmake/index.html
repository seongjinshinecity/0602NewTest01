<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUNKY PDF MAKER 90s</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PDF libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Funky Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bangers&family=Permanent+Marker&family=Fredoka+One&family=Press+Start+2P&family=Archivo+Black&family=Luckiest+Guy&display=swap" rel="stylesheet" />

  <style>
    /* Tailwind v3 (cdn.tailwindcss.com) emits rgb() — safe for html2canvas.
       We still give every PREVIEW element explicit hex inline styles. */
    body { background: #1a1a2e; }

    /* ===== Funky scrollbar ===== */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #16213e; }
    ::-webkit-scrollbar-thumb { background: #ff2d95; border: 2px solid #16213e; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #39ff14; }

    /* ===== Animations ===== */
    @keyframes wobble { 0%,100%{transform:rotate(-1.5deg)} 50%{transform:rotate(1.5deg)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
    .anim-wobble { animation: wobble 2.5s ease-in-out infinite; }
    .anim-float { animation: float 3s ease-in-out infinite; }
    .anim-spin-slow { animation: spin-slow 9s linear infinite; }
    .anim-blink { animation: blink 1.4s steps(2,end) infinite; }

    /* Hard cartoon shadow helper */
    .shadow-cartoon { box-shadow: 5px 5px 0 0 #000; }
    .shadow-cartoon-sm { box-shadow: 3px 3px 0 0 #000; }
    .shadow-cartoon-lg { box-shadow: 8px 8px 0 0 #000; }

    /* Selected element ring on canvas */
    .el-selected { outline: 3px dashed #00e5ff; outline-offset: 4px; }
    .el-draggable { cursor: grab; }
    .el-draggable:active { cursor: grabbing; }

    /* prevent text selection while dragging */
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, createContext, useContext } = React;

    // ========================================
    // 🎨 PALETTE & CONSTANTS
    // ========================================
    const PAL = {
      pink:   '#ff2d95',
      green:  '#39ff14',
      yellow: '#ffe600',
      cyan:   '#00e5ff',
      purple: '#9d4edd',
      orange: '#ff7b00',
      black:  '#0d0d0d',
      white:  '#ffffff',
      navy:   '#16213e',
    };

    const SWATCHES = [
      '#ff2d95','#39ff14','#ffe600','#00e5ff','#9d4edd',
      '#ff7b00','#0d0d0d','#ffffff','#ff0040','#1fb6ff',
    ];

    const FONTS = [
      { label: 'Bangers',         value: "'Bangers', cursive" },
      { label: 'Bungee',          value: "'Bungee', cursive" },
      { label: 'Luckiest Guy',    value: "'Luckiest Guy', cursive" },
      { label: 'Permanent Marker',value: "'Permanent Marker', cursive" },
      { label: 'Fredoka One',     value: "'Fredoka One', cursive" },
      { label: 'Archivo Black',   value: "'Archivo Black', sans-serif" },
      { label: 'Press Start 2P',  value: "'Press Start 2P', monospace" },
    ];

    // Page sizes in mm + a px aspect for preview (we keep preview at fixed px width)
    const PAGE_SIZES = {
      A4:     { w: 210,   h: 297,   label: 'A4 (210×297mm)' },
      Letter: { w: 215.9, h: 279.4, label: 'Letter (216×279mm)' },
    };
    const PREVIEW_W = 480; // px width of preview canvas (portrait)

    // ========================================
    // 🌈 BACKGROUND PATTERNS (CSS as data — applied inline as backgroundImage)
    // ========================================
    const PATTERNS = {
      solid:   { label: 'Solid', css: (c1) => ({ background: c1 }) },
      dots:    { label: 'Polka Dots', css: (c1,c2) => ({
                  backgroundColor: c1,
                  backgroundImage: `radial-gradient(${c2} 18%, transparent 19%), radial-gradient(${c2} 18%, transparent 19%)`,
                  backgroundSize: '34px 34px',
                  backgroundPosition: '0 0, 17px 17px',
                }) },
      stripes: { label: 'Diagonal Stripes', css: (c1,c2) => ({
                  background: `repeating-linear-gradient(45deg, ${c1}, ${c1} 22px, ${c2} 22px, ${c2} 44px)`,
                }) },
      checker: { label: 'Checkerboard', css: (c1,c2) => ({
                  backgroundColor: c1,
                  backgroundImage: `linear-gradient(45deg, ${c2} 25%, transparent 25%), linear-gradient(-45deg, ${c2} 25%, transparent 25%), linear-gradient(45deg, transparent 75%, ${c2} 75%), linear-gradient(-45deg, transparent 75%, ${c2} 75%)`,
                  backgroundSize: '46px 46px',
                  backgroundPosition: '0 0, 0 23px, 23px -23px, -23px 0',
                }) },
      zigzag:  { label: 'Zig Zag', css: (c1,c2) => ({
                  backgroundColor: c1,
                  backgroundImage: `linear-gradient(135deg, ${c2} 25%, transparent 25%), linear-gradient(225deg, ${c2} 25%, transparent 25%), linear-gradient(45deg, ${c2} 25%, transparent 25%), linear-gradient(315deg, ${c2} 25%, transparent 25%)`,
                  backgroundPosition: '24px 0, 24px 0, 0 0, 0 0',
                  backgroundSize: '48px 48px',
                  backgroundRepeat: 'repeat',
                }) },
      grid:    { label: 'Neon Grid', css: (c1,c2) => ({
                  backgroundColor: c1,
                  backgroundImage: `linear-gradient(${c2} 2px, transparent 2px), linear-gradient(90deg, ${c2} 2px, transparent 2px)`,
                  backgroundSize: '40px 40px',
                }) },
      sunburst:{ label: 'Sunburst', css: (c1,c2) => ({
                  background: `repeating-conic-gradient(from 0deg at 50% 35%, ${c1} 0deg 12deg, ${c2} 12deg 24deg)`,
                }) },
    };

    // ========================================
    // 🧩 TEMPLATES — produce an array of element objects
    // Each element: {id, type:'text'|'image'|'shape', x,y (px in preview), w, ...style}
    // ========================================
    function uid() { return Math.random().toString(36).slice(2, 9); }

    function buildTemplate(key) {
      const base = (over) => ({ id: uid(), x: 40, y: 60, w: 400, rotate: 0, ...over });
      switch (key) {
        case 'party':
          return {
            bg: { pattern: 'dots', c1: '#9d4edd', c2: '#ffe600' },
            elements: [
              base({ type:'shape', shape:'splash', x:120, y:40, w:260, h:120, fill:'#39ff14', rotate:-6 }),
              base({ type:'text', role:'title', text:"FUNKY\nPARTY!", x:50, y:55, w:380,
                     font:"'Bangers', cursive", size:78, color:'#0d0d0d', stroke:'#ffffff', strokeW:2, align:'center', lineHeight:0.92 }),
              base({ type:'text', role:'subtitle', text:'SATURDAY NIGHT • 9PM', x:50, y:230, w:380,
                     font:"'Bungee', cursive", size:24, color:'#ffffff', stroke:'#ff2d95', strokeW:1.5, align:'center' }),
              base({ type:'image', x:140, y:300, w:200, h:200, src:null }),
              base({ type:'text', role:'body', text:'Free drinks • Live DJ • Neon vibes\nDress to impress in your wildest 90s fit!', x:40, y:540, w:400,
                     font:"'Fredoka One', cursive", size:20, color:'#0d0d0d', align:'center', lineHeight:1.3 }),
            ],
          };
        case 'magazine':
          return {
            bg: { pattern: 'stripes', c1: '#ffffff', c2: '#ffe600' },
            elements: [
              base({ type:'shape', shape:'bar', x:0, y:30, w:PREVIEW_W, h:70, fill:'#ff2d95', rotate:0 }),
              base({ type:'text', role:'title', text:'RAD ZINE', x:24, y:40, w:432,
                     font:"'Archivo Black', sans-serif", size:54, color:'#ffffff', align:'left' }),
              base({ type:'text', role:'subtitle', text:'ISSUE #90 — THE RETRO REVIVAL', x:24, y:120, w:432,
                     font:"'Bungee', cursive", size:18, color:'#9d4edd', align:'left' }),
              base({ type:'image', x:24, y:170, w:432, h:240, src:null }),
              base({ type:'text', role:'body', text:'Inside this issue: skate culture, mixtape\nnostalgia, and the colors that defined a\ngeneration. Grab a slice and dive in.', x:24, y:430, w:432,
                     font:"'Fredoka One', cursive", size:18, color:'#0d0d0d', align:'left', lineHeight:1.35 }),
              base({ type:'shape', shape:'bar', x:0, y:600, w:PREVIEW_W, h:14, fill:'#00e5ff' }),
            ],
          };
        case 'skate':
          return {
            bg: { pattern: 'checker', c1: '#0d0d0d', c2: '#ff7b00' },
            elements: [
              base({ type:'text', role:'title', text:'SK8\nOR DIE', x:30, y:50, w:420,
                     font:"'Luckiest Guy', cursive", size:90, color:'#39ff14', stroke:'#0d0d0d', strokeW:3, align:'center', lineHeight:0.9 }),
              base({ type:'shape', shape:'splash', x:90, y:250, w:300, h:130, fill:'#ff2d95', rotate:8 }),
              base({ type:'image', x:120, y:270, w:240, h:240, src:null }),
              base({ type:'text', role:'subtitle', text:'STREET JAM 2090', x:40, y:540, w:400,
                     font:"'Permanent Marker', cursive", size:34, color:'#ffe600', stroke:'#0d0d0d', strokeW:1.5, align:'center' }),
              base({ type:'text', role:'body', text:'Downtown skatepark — all decks welcome', x:40, y:600, w:400,
                     font:"'Bungee', cursive", size:16, color:'#ffffff', align:'center' }),
            ],
          };
        case 'neon':
        default:
          return {
            bg: { pattern: 'grid', c1: '#0d0d0d', c2: '#9d4edd' },
            elements: [
              base({ type:'shape', shape:'circle', x:60, y:60, w:360, h:360, fill:'#ff2d95', rotate:0 }),
              base({ type:'text', role:'title', text:'NEON\nNIGHTS', x:40, y:120, w:400,
                     font:"'Bungee', cursive", size:72, color:'#39ff14', stroke:'#00e5ff', strokeW:2, align:'center', lineHeight:0.95 }),
              base({ type:'image', x:140, y:330, w:200, h:200, src:null }),
              base({ type:'text', role:'subtitle', text:'★ ELECTRIC EVENT ★', x:40, y:545, w:400,
                     font:"'Press Start 2P', monospace", size:16, color:'#ffe600', align:'center' }),
              base({ type:'text', role:'body', text:'Doors 8PM // Lights ON // Vibes UP', x:40, y:600, w:400,
                     font:"'Fredoka One', cursive", size:18, color:'#00e5ff', align:'center' }),
            ],
          };
      }
    }

    const TEMPLATE_LIST = [
      { key:'party',    name:'Funky Party Flyer', emoji:'🎉', c:'#9d4edd' },
      { key:'magazine', name:'Retro Magazine',    emoji:'📰', c:'#ff2d95' },
      { key:'skate',    name:'Skateboard Poster', emoji:'🛹', c:'#ff7b00' },
      { key:'neon',     name:'Neon Event Poster', emoji:'🌃', c:'#39ff14' },
    ];

    // ========================================
    // 🎨 DESIGN SYSTEM COMPONENTS
    // ========================================
    function Button({ children, onClick, variant='primary', size='md', disabled, className='', ...rest }) {
      const sizes = { sm:'px-3 py-1.5 text-xs', md:'px-4 py-2 text-sm', lg:'px-6 py-3 text-base' };
      const variants = {
        primary:  'bg-[#39ff14] text-black hover:bg-[#2fd60f]',
        secondary:'bg-[#00e5ff] text-black hover:bg-[#00c4db]',
        danger:   'bg-[#ff0040] text-white hover:bg-[#d80035]',
        ghost:    'bg-white text-black hover:bg-gray-100',
        dark:     'bg-[#0d0d0d] text-[#39ff14] hover:bg-[#1a1a1a]',
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`font-black uppercase tracking-wide border-[3px] border-black rounded-lg shadow-cartoon-sm transition active:translate-x-[3px] active:translate-y-[3px] active:shadow-none disabled:opacity-40 disabled:cursor-not-allowed ${sizes[size]} ${variants[variant]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Panel({ title, color='#ff2d95', children, className='' }) {
      return (
        <div className={`bg-white border-[3px] border-black rounded-xl shadow-cartoon ${className}`}>
          {title && (
            <div className="px-3 py-2 border-b-[3px] border-black rounded-t-lg font-black uppercase text-sm tracking-wider"
                 style={{ background: color, color: '#0d0d0d' }}>
              {title}
            </div>
          )}
          <div className="p-3">{children}</div>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <label className="block mb-3">
          <span className="block text-[11px] font-black uppercase tracking-wider text-black mb-1">{label}</span>
          {children}
        </label>
      );
    }

    function TextInput({ value, onChange, placeholder, multiline }) {
      const cls = "w-full border-[3px] border-black rounded-lg px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#00e5ff]";
      return multiline
        ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} className={cls+' resize-y'} />
        : <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={cls} />;
    }

    function ColorPicker({ value, onChange }) {
      return (
        <div className="flex flex-wrap gap-1.5 items-center">
          {SWATCHES.map(c => (
            <button key={c} onClick={()=>onChange(c)}
              className={`w-7 h-7 rounded-md border-[3px] ${value===c?'border-[#00e5ff] scale-110':'border-black'} transition`}
              style={{ background: c }} aria-label={c} />
          ))}
          <input type="color" value={value} onChange={e=>onChange(e.target.value)}
            className="w-8 h-8 rounded-md border-[3px] border-black cursor-pointer bg-white" />
        </div>
      );
    }

    function Slider({ value, min, max, step=1, onChange, suffix='' }) {
      return (
        <div className="flex items-center gap-2">
          <input type="range" min={min} max={max} step={step} value={value}
            onChange={e=>onChange(Number(e.target.value))}
            className="flex-1 accent-[#ff2d95]" />
          <span className="text-xs font-black w-14 text-right">{value}{suffix}</span>
        </div>
      );
    }

    // ========================================
    // 🟣 SHAPE renderer (funky shapes via clip-path / svg)
    // ========================================
    function Shape({ el }) {
      const common = { width:'100%', height:'100%' };
      if (el.shape === 'circle')
        return <div style={{ ...common, background: el.fill, borderRadius:'50%' }} />;
      if (el.shape === 'bar')
        return <div style={{ ...common, background: el.fill }} />;
      if (el.shape === 'splash')
        return (
          <svg viewBox="0 0 200 120" style={common} preserveAspectRatio="none">
            <path fill={el.fill} d="M30,20 Q10,5 35,5 Q50,-5 65,8 Q90,-8 100,10 Q130,-5 145,12 Q180,0 175,30 Q200,40 178,58 Q198,80 168,86 Q175,115 140,100 Q120,125 100,102 Q70,122 55,100 Q20,115 25,85 Q-2,78 18,55 Q-5,38 30,20 Z" />
          </svg>
        );
      return null;
    }

    // ========================================
    // ✏️ Draggable element on the canvas
    // ========================================
    function CanvasElement({ el, scale, selected, onSelect, onDrag, interactive }) {
      const startRef = useRef(null);

      const onPointerDown = (e) => {
        if (!interactive) return;
        e.stopPropagation();
        onSelect(el.id);
        startRef.current = { px: e.clientX, py: e.clientY, ex: el.x, ey: el.y };
        const move = (ev) => {
          if (!startRef.current) return;
          const dx = (ev.clientX - startRef.current.px) / scale;
          const dy = (ev.clientY - startRef.current.py) / scale;
          onDrag(el.id, startRef.current.ex + dx, startRef.current.ey + dy);
        };
        const up = () => {
          startRef.current = null;
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      const wrapStyle = {
        position:'absolute',
        left: el.x, top: el.y,
        width: el.w,
        height: el.h || 'auto',
        transform: `rotate(${el.rotate||0}deg)`,
        transformOrigin:'center center',
      };

      let inner = null;
      if (el.type === 'text') {
        const textStyle = {
          fontFamily: el.font,
          fontSize: el.size,
          lineHeight: el.lineHeight || 1.1,
          color: el.color,
          textAlign: el.align || 'left',
          whiteSpace:'pre-wrap',
          wordBreak:'break-word',
          margin:0,
          WebkitTextStroke: el.strokeW ? `${el.strokeW}px ${el.stroke}` : undefined,
          paintOrder:'stroke fill',
          textShadow: el.shadow ? '3px 3px 0 rgba(0,0,0,0.35)' : undefined,
        };
        inner = <div style={textStyle}>{el.text}</div>;
      } else if (el.type === 'image') {
        inner = el.src
          ? <img src={el.src} alt="" draggable={false}
                 style={{ width:'100%', height:'100%', objectFit:'cover',
                          border:'4px solid #0d0d0d', borderRadius:8, background:'#fff' }} />
          : (interactive
              ? <div style={{ width:'100%', height:'100%', border:'4px dashed #0d0d0d',
                              borderRadius:8, background:'rgba(255,255,255,0.55)',
                              display:'flex', alignItems:'center', justifyContent:'center',
                              fontWeight:900, color:'#0d0d0d', textAlign:'center', fontSize:13, padding:8 }}>
                  🖼️ 이미지 영역<br/>(선택 후 업로드)
                </div>
              : null);
      } else if (el.type === 'shape') {
        inner = <Shape el={el} />;
      }

      return (
        <div
          style={wrapStyle}
          className={`${interactive ? 'el-draggable no-select' : ''} ${selected && interactive ? 'el-selected' : ''}`}
          onPointerDown={onPointerDown}
        >
          {inner}
        </div>
      );
    }

    // ========================================
    // 📄 PAGE CANVAS (one page). forwardRef-free: we use id-based refs.
    // ========================================
    function PageCanvas({ page, pageW, pageH, scale, captureMode, activePageId, selectedId, onSelect, onDrag, registerRef }) {
      const ref = useRef(null);
      // Only the capture-stage instances register export refs — guarantees clean 1:1 nodes
      useEffect(() => { if (captureMode) registerRef(page.id, ref.current); });

      const interactive = !captureMode && activePageId === page.id;
      const bgPat = PATTERNS[page.bg.pattern] || PATTERNS.solid;
      const bgStyle = bgPat.css(page.bg.c1, page.bg.c2);

      // sorted by array order (z-index = index)
      return (
        <div
          ref={ref}
          className="relative overflow-hidden"
          style={{
            width: pageW,
            height: pageH,
            ...bgStyle,
            transform: captureMode ? 'none' : `scale(${scale})`,
            transformOrigin: 'top left',
            flexShrink: 0,
          }}
          onPointerDown={() => interactive && onSelect(null)}
        >
          {page.elements.map(el => (
            <CanvasElement
              key={el.id}
              el={el}
              scale={captureMode ? 1 : 1 /* internal coords already 1:1; outer scale handles zoom */}
              selected={selectedId === el.id}
              interactive={interactive}
              onSelect={onSelect}
              onDrag={onDrag}
            />
          ))}
        </div>
      );
    }

    // ========================================
    // 🎛️ LEFT EDIT PANEL
    // ========================================
    function EditPanel({ page, selected, onUpdateEl, onAddEl, onDeleteEl, onUploadImage, onBgChange, onMoveZ }) {
      const el = selected;
      return (
        <div className="space-y-4">
          {/* Add elements */}
          <Panel title="➕ 요소 추가" color={PAL.green}>
            <div className="grid grid-cols-2 gap-2">
              <Button size="sm" variant="dark" onClick={()=>onAddEl('text')}>＋ 텍스트</Button>
              <Button size="sm" variant="dark" onClick={()=>onAddEl('image')}>＋ 이미지</Button>
              <Button size="sm" variant="dark" onClick={()=>onAddEl('shape-circle')}>＋ 원</Button>
              <Button size="sm" variant="dark" onClick={()=>onAddEl('shape-splash')}>＋ 스플래시</Button>
            </div>
          </Panel>

          {/* Background */}
          <Panel title="🌈 배경 패턴" color={PAL.cyan}>
            <Field label="패턴">
              <div className="grid grid-cols-2 gap-1.5">
                {Object.entries(PATTERNS).map(([k,v]) => (
                  <button key={k} onClick={()=>onBgChange({ pattern:k })}
                    className={`text-[11px] font-black uppercase border-[3px] rounded-lg px-2 py-1.5 ${page.bg.pattern===k?'bg-[#ffe600] border-[#00e5ff]':'bg-white border-black'}`}>
                    {v.label}
                  </button>
                ))}
              </div>
            </Field>
            <Field label="배경 색 1">
              <ColorPicker value={page.bg.c1} onChange={c=>onBgChange({ c1:c })} />
            </Field>
            <Field label="배경 색 2 (패턴)">
              <ColorPicker value={page.bg.c2} onChange={c=>onBgChange({ c2:c })} />
            </Field>
          </Panel>

          {/* Selected element editor */}
          {el ? (
            <Panel title={`✏️ 선택: ${labelFor(el)}`} color={PAL.pink}>
              {el.type === 'text' && (
                <>
                  <Field label="텍스트 (줄바꿈 가능)">
                    <TextInput multiline value={el.text} onChange={v=>onUpdateEl(el.id,{text:v})} />
                  </Field>
                  <Field label="폰트">
                    <select value={el.font} onChange={e=>onUpdateEl(el.id,{font:e.target.value})}
                      className="w-full border-[3px] border-black rounded-lg px-2 py-2 text-sm font-bold">
                      {FONTS.map(f=> <option key={f.value} value={f.value}>{f.label}</option>)}
                    </select>
                  </Field>
                  <Field label={`글자 크기 (${el.size}px)`}>
                    <Slider value={el.size} min={8} max={140} onChange={v=>onUpdateEl(el.id,{size:v})} suffix="px" />
                  </Field>
                  <Field label="글자 색">
                    <ColorPicker value={el.color} onChange={c=>onUpdateEl(el.id,{color:c})} />
                  </Field>
                  <Field label="정렬">
                    <div className="flex gap-1.5">
                      {['left','center','right'].map(a=>(
                        <button key={a} onClick={()=>onUpdateEl(el.id,{align:a})}
                          className={`flex-1 text-xs font-black uppercase border-[3px] rounded-lg py-1.5 ${el.align===a?'bg-[#39ff14] border-[#00e5ff]':'bg-white border-black'}`}>{a}</button>
                      ))}
                    </div>
                  </Field>
                  <Field label={`외곽선 두께 (${el.strokeW||0}px)`}>
                    <Slider value={el.strokeW||0} min={0} max={6} step={0.5} onChange={v=>onUpdateEl(el.id,{strokeW:v})} suffix="px" />
                  </Field>
                  {(el.strokeW>0) && (
                    <Field label="외곽선 색">
                      <ColorPicker value={el.stroke||'#000000'} onChange={c=>onUpdateEl(el.id,{stroke:c})} />
                    </Field>
                  )}
                  <Field label="그림자">
                    <button onClick={()=>onUpdateEl(el.id,{shadow:!el.shadow})}
                      className={`text-xs font-black uppercase border-[3px] border-black rounded-lg px-3 py-1.5 ${el.shadow?'bg-[#ffe600]':'bg-white'}`}>
                      {el.shadow ? '그림자 ON' : '그림자 OFF'}
                    </button>
                  </Field>
                </>
              )}

              {el.type === 'image' && (
                <>
                  <Field label="이미지 업로드">
                    <label className="block">
                      <input type="file" accept="image/*" className="hidden"
                        onChange={e=>{ const f=e.target.files[0]; if(f) onUploadImage(el.id,f); }} />
                      <span className="inline-block cursor-pointer bg-[#00e5ff] text-black font-black uppercase text-xs border-[3px] border-black rounded-lg px-4 py-2 shadow-cartoon-sm">📁 파일 선택</span>
                    </label>
                  </Field>
                  {el.src && <img src={el.src} className="w-full max-h-32 object-contain border-[3px] border-black rounded-lg" alt="preview" />}
                </>
              )}

              {el.type === 'shape' && (
                <Field label="도형 색">
                  <ColorPicker value={el.fill} onChange={c=>onUpdateEl(el.id,{fill:c})} />
                </Field>
              )}

              {/* common: size & rotate & z */}
              <div className="mt-2 pt-2 border-t-[3px] border-dashed border-black">
                <Field label={`너비 (${Math.round(el.w)}px)`}>
                  <Slider value={Math.round(el.w)} min={40} max={PREVIEW_W} onChange={v=>onUpdateEl(el.id,{w:v})} suffix="px" />
                </Field>
                {(el.type==='image'||el.type==='shape') && (
                  <Field label={`높이 (${Math.round(el.h||100)}px)`}>
                    <Slider value={Math.round(el.h||100)} min={40} max={700} onChange={v=>onUpdateEl(el.id,{h:v})} suffix="px" />
                  </Field>
                )}
                <Field label={`회전 (${el.rotate||0}°)`}>
                  <Slider value={el.rotate||0} min={-45} max={45} onChange={v=>onUpdateEl(el.id,{rotate:v})} suffix="°" />
                </Field>
                <div className="flex gap-2 mt-1">
                  <Button size="sm" variant="ghost" className="flex-1" onClick={()=>onMoveZ(el.id,1)}>⬆ 앞으로</Button>
                  <Button size="sm" variant="ghost" className="flex-1" onClick={()=>onMoveZ(el.id,-1)}>⬇ 뒤로</Button>
                </div>
                <Button size="sm" variant="danger" className="w-full mt-2" onClick={()=>onDeleteEl(el.id)}>🗑 요소 삭제</Button>
              </div>
            </Panel>
          ) : (
            <Panel title="✏️ 요소 편집" color={PAL.pink}>
              <p className="text-xs font-bold text-gray-600">캔버스에서 요소를 클릭해 선택하세요. 드래그로 위치를 옮길 수 있어요!</p>
            </Panel>
          )}
        </div>
      );
    }

    function labelFor(el){
      if(el.type==='text') return '텍스트';
      if(el.type==='image') return '이미지';
      if(el.type==='shape') return el.shape==='circle'?'원':el.shape==='splash'?'스플래시':'도형';
      return '요소';
    }

    // ========================================
    // 📚 RIGHT PANEL — templates & PDF settings
    // ========================================
    function RightPanel({ onTemplate, pageSize, setPageSize, quality, setQuality, onAddPage, onDeletePage, pageCount, activeIdx, onExport, exporting }) {
      return (
        <div className="space-y-4">
          <Panel title="📚 템플릿" color={PAL.purple}>
            <div className="grid grid-cols-1 gap-2">
              {TEMPLATE_LIST.map(t=>(
                <button key={t.key} onClick={()=>onTemplate(t.key)}
                  className="flex items-center gap-3 text-left border-[3px] border-black rounded-lg px-3 py-2 font-black uppercase text-xs shadow-cartoon-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition"
                  style={{ background: t.c, color:'#0d0d0d' }}>
                  <span className="text-2xl">{t.emoji}</span>{t.name}
                </button>
              ))}
            </div>
            <p className="text-[10px] font-bold text-gray-500 mt-2">⚠️ 템플릿 적용 시 현재 페이지 내용이 교체됩니다.</p>
          </Panel>

          <Panel title="📐 PDF 설정" color={PAL.orange}>
            <Field label="용지 크기">
              <div className="flex gap-2">
                {Object.entries(PAGE_SIZES).map(([k,v])=>(
                  <button key={k} onClick={()=>setPageSize(k)}
                    className={`flex-1 text-xs font-black uppercase border-[3px] rounded-lg py-2 ${pageSize===k?'bg-[#39ff14] border-[#00e5ff]':'bg-white border-black'}`}>{k}</button>
                ))}
              </div>
            </Field>
            <Field label={`출력 품질 (해상도 스케일 ${quality}x)`}>
              <Slider value={quality} min={1} max={4} onChange={setQuality} suffix="x" />
              <p className="text-[10px] font-bold text-gray-500 mt-1">3x ≈ 약 300dpi 인쇄 품질</p>
            </Field>
          </Panel>

          <Panel title="📄 페이지" color={PAL.cyan}>
            <p className="text-xs font-black mb-2">총 {pageCount}페이지 · 현재 {activeIdx+1}p</p>
            <div className="flex gap-2">
              <Button size="sm" variant="secondary" className="flex-1" onClick={onAddPage}>＋ 페이지</Button>
              <Button size="sm" variant="danger" className="flex-1" onClick={onDeletePage} disabled={pageCount<=1}>－ 삭제</Button>
            </div>
          </Panel>

          <Button variant="primary" size="lg" className="w-full anim-wobble" onClick={onExport} disabled={exporting}>
            {exporting ? '⏳ 생성 중...' : '⬇️ PDF 다운로드'}
          </Button>
        </div>
      );
    }

    // ========================================
    // 🚀 APP
    // ========================================
    function App() {
      const [pages, setPages] = useState(() => [ buildTemplate('party') ].map(addPageId));
      const [activeIdx, setActiveIdx] = useState(0);
      const [selectedId, setSelectedId] = useState(null);
      const [pageSize, setPageSize] = useState('A4');
      const [quality, setQuality] = useState(3);
      const [zoom, setZoom] = useState(1);
      const [exporting, setExporting] = useState(false);
      const refs = useRef({}); // pageId -> dom node

      function addPageId(p){ return { ...p, id: uid() }; }

      const pageDims = PAGE_SIZES[pageSize];
      const pageW = PREVIEW_W;
      const pageH = Math.round(PREVIEW_W * pageDims.h / pageDims.w);

      // fit zoom to viewport height
      useEffect(() => {
        const fit = () => {
          const avail = window.innerHeight - 200;
          const z = Math.min(1, Math.max(0.35, avail / pageH));
          setZoom(Number(z.toFixed(2)));
        };
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, [pageH]);

      const activePage = pages[activeIdx];
      const selectedEl = activePage.elements.find(e => e.id === selectedId) || null;

      const registerRef = useCallback((id, node) => { if(node) refs.current[id] = node; }, []);

      const updatePage = (idx, updater) => {
        setPages(prev => prev.map((p,i)=> i===idx ? updater(p) : p));
      };

      const onUpdateEl = (elId, patch) => {
        updatePage(activeIdx, p => ({ ...p, elements: p.elements.map(e=> e.id===elId ? {...e,...patch} : e) }));
      };
      const onDrag = (elId, x, y) => {
        const e = activePage.elements.find(e=>e.id===elId);
        const w = e?.w || 100, h = e?.h || 60;
        const cx = Math.max(-w*0.5, Math.min(pageW - w*0.5, x));
        const cy = Math.max(-h*0.5, Math.min(pageH - h*0.5, y));
        onUpdateEl(elId, { x: cx, y: cy });
      };
      const onAddEl = (kind) => {
        let el;
        if (kind==='text') el = { id:uid(), type:'text', text:'TEXT', x:120,y:120,w:240, font:"'Bangers', cursive", size:40, color:'#0d0d0d', align:'center', rotate:0 };
        else if (kind==='image') el = { id:uid(), type:'image', x:120,y:120,w:200,h:200, src:null, rotate:0 };
        else if (kind==='shape-circle') el = { id:uid(), type:'shape', shape:'circle', x:120,y:120,w:160,h:160, fill:PAL.pink, rotate:0 };
        else el = { id:uid(), type:'shape', shape:'splash', x:120,y:120,w:200,h:140, fill:PAL.green, rotate:0 };
        updatePage(activeIdx, p => ({ ...p, elements: [...p.elements, el] }));
        setSelectedId(el.id);
      };
      const onDeleteEl = (elId) => {
        updatePage(activeIdx, p => ({ ...p, elements: p.elements.filter(e=>e.id!==elId) }));
        setSelectedId(null);
      };
      const onMoveZ = (elId, dir) => {
        updatePage(activeIdx, p => {
          const arr = [...p.elements];
          const i = arr.findIndex(e=>e.id===elId);
          const j = i + dir;
          if (i<0 || j<0 || j>=arr.length) return p;
          [arr[i], arr[j]] = [arr[j], arr[i]];
          return { ...p, elements: arr };
        });
      };
      const onUploadImage = (elId, file) => {
        const reader = new FileReader();
        reader.onload = () => onUpdateEl(elId, { src: reader.result }); // data URL — no CORS taint
        reader.readAsDataURL(file);
      };
      const onBgChange = (patch) => updatePage(activeIdx, p => ({ ...p, bg: { ...p.bg, ...patch } }));

      const onTemplate = (key) => {
        const t = buildTemplate(key);
        updatePage(activeIdx, () => ({ ...t, id: activePage.id }));
        setSelectedId(null);
      };
      const onAddPage = () => {
        const fresh = { ...buildTemplate('neon'), id: uid(), elements: [] , bg:{pattern:'solid',c1:'#ffffff',c2:'#000000'}};
        setPages(prev => { const next=[...prev, fresh]; return next; });
        setActiveIdx(pages.length);
        setSelectedId(null);
      };
      const onDeletePage = () => {
        if (pages.length<=1) return;
        setPages(prev => prev.filter((_,i)=>i!==activeIdx));
        setActiveIdx(i => Math.max(0, i-1));
        setSelectedId(null);
      };

      // ---- PDF EXPORT ----
      const onExport = async () => {
        setExporting(true);
        setSelectedId(null);
        try {
          await document.fonts.ready;            // ensure funky fonts are loaded
          await new Promise(r => setTimeout(r, 120)); // let React drop the selection outline
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit:'mm', format: pageSize==='A4' ? 'a4' : 'letter', orientation:'portrait' });
          const pw = pageDims.w, ph = pageDims.h;

          for (let i=0; i<pages.length; i++) {
            const node = refs.current[pages[i].id];
            if (!node) continue;
            const canvas = await html2canvas(node, {
              scale: quality,
              useCORS: true,
              backgroundColor: '#ffffff',
              logging: false,
              width: pageW,
              height: pageH,
              windowWidth: pageW,
              windowHeight: pageH,
            });
            const img = canvas.toDataURL('image/jpeg', 0.95);
            if (i>0) doc.addPage(pageSize==='A4'?'a4':'letter','portrait');
            doc.addImage(img, 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
          }
          doc.save(`funky-pdf-${Date.now()}.pdf`);
        } catch (err) {
          console.error(err);
          alert('PDF 생성 중 오류가 발생했어요: ' + err.message);
        } finally {
          setExporting(false);
        }
      };

      return (
        <div className="min-h-screen w-full" style={{ background:'#1a1a2e' }}>
          {/* HEADER */}
          <header className="border-b-[4px] border-black px-4 py-3 flex items-center justify-between"
                  style={{ background:'linear-gradient(90deg,#ff2d95,#9d4edd,#00e5ff)' }}>
            <div className="flex items-center gap-3">
              <span className="text-3xl anim-spin-slow">💿</span>
              <h1 className="text-2xl md:text-3xl font-black uppercase tracking-tight text-white"
                  style={{ fontFamily:"'Bungee', cursive", textShadow:'3px 3px 0 #000' }}>
                FUNKY PDF MAKER
              </h1>
              <span className="hidden md:inline text-xs font-black uppercase bg-[#ffe600] text-black border-[3px] border-black rounded-lg px-2 py-1 anim-blink">90s EDITION</span>
            </div>
            <div className="hidden sm:flex items-center gap-2">
              <span className="text-xs font-black text-white">ZOOM</span>
              <input type="range" min="0.35" max="1.2" step="0.05" value={zoom}
                onChange={e=>setZoom(Number(e.target.value))} className="w-28 accent-[#ffe600]" />
              <span className="text-xs font-black text-white w-10">{Math.round(zoom*100)}%</span>
            </div>
          </header>

          {/* BODY: 3 columns */}
          <div className="flex flex-col lg:flex-row gap-4 p-4">
            {/* LEFT */}
            <aside className="w-full lg:w-80 lg:flex-shrink-0 order-2 lg:order-1">
              <EditPanel
                page={activePage} selected={selectedEl}
                onUpdateEl={onUpdateEl} onAddEl={onAddEl} onDeleteEl={onDeleteEl}
                onUploadImage={onUploadImage} onBgChange={onBgChange} onMoveZ={onMoveZ}
              />
            </aside>

            {/* CENTER */}
            <main className="flex-1 order-1 lg:order-2 flex flex-col items-center">
              {/* page tabs */}
              <div className="flex flex-wrap gap-2 mb-3">
                {pages.map((p,i)=>(
                  <button key={p.id} onClick={()=>{setActiveIdx(i); setSelectedId(null);}}
                    className={`text-xs font-black uppercase border-[3px] border-black rounded-lg px-3 py-1.5 ${i===activeIdx?'bg-[#39ff14]':'bg-white'}`}>
                    📄 {i+1}p
                  </button>
                ))}
              </div>

              <div className="overflow-auto p-4 border-[4px] border-black rounded-2xl shadow-cartoon-lg w-full flex justify-center"
                   style={{ background:'#2b2b4a' }}>
                {/* sizing wrapper that accounts for zoom so layout doesn't overflow weirdly */}
                <div style={{ width: pageW*zoom, height: pageH*zoom }}>
                  <PageCanvas
                    page={activePage}
                    pageW={pageW} pageH={pageH} scale={zoom}
                    captureMode={false}
                    activePageId={activePage.id}
                    selectedId={selectedId}
                    onSelect={setSelectedId}
                    onDrag={onDrag}
                    registerRef={registerRef}
                  />
                </div>
              </div>
              <p className="text-[11px] font-bold text-white/70 mt-2 text-center">
                요소를 클릭해 선택 → 드래그로 이동 · 왼쪽 패널에서 편집
              </p>

              {/* Off-screen capture stage: all pages rendered at 1:1 for html2canvas.
                  Must stay VISIBLE (no opacity:0 / display:none) or html2canvas captures blank. */}
              <div style={{ position:'fixed', left:-99999, top:0, pointerEvents:'none', zIndex:-1 }} aria-hidden="true">
                {pages.map(p=>(
                  <PageCanvas
                    key={'cap-'+p.id}
                    page={p}
                    pageW={pageW} pageH={pageH} scale={1}
                    captureMode={true}
                    activePageId={null}
                    selectedId={null}
                    onSelect={()=>{}}
                    onDrag={()=>{}}
                    registerRef={registerRef}
                  />
                ))}
              </div>
            </main>

            {/* RIGHT */}
            <aside className="w-full lg:w-72 lg:flex-shrink-0 order-3">
              <RightPanel
                onTemplate={onTemplate}
                pageSize={pageSize} setPageSize={setPageSize}
                quality={quality} setQuality={setQuality}
                onAddPage={onAddPage} onDeletePage={onDeletePage}
                pageCount={pages.length} activeIdx={activeIdx}
                onExport={onExport} exporting={exporting}
              />
            </aside>
          </div>

          <footer className="text-center text-white/50 text-xs font-bold py-4">
            Made with 💿 in the spirit of the 90s · jsPDF + html2canvas · single-file React
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
