<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>망고 빙수 포스터 (실사진)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <!-- @babel/standalone는 v7로 고정 (v8이면 빈 화면 이슈) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    /* Tailwind으로 표현하기 어려운 커스텀 폰트 / 애니메이션 */
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap');

    body { margin: 0; }
    .font-title { font-family: 'Black Han Sans', sans-serif; }
    .font-point { font-family: 'Jua', sans-serif; }
    .font-body  { font-family: 'Gowun Dodum', sans-serif; }

    /* 이미지 위 은은한 광택이 스치는 효과 */
    @keyframes sheen {
      0%   { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
      45%  { opacity: 0.55; }
      100% { transform: translateX(220%) skewX(-18deg); opacity: 0; }
    }
    .sheen { animation: sheen 6s ease-in-out infinite; }

    /* 떠다니는 데코 */
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(-3deg); }
    }
    .floaty { animation: floaty 5s ease-in-out infinite; }
    @keyframes floaty-slow {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .floaty-slow { animation: floaty-slow 7s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState } = React;

    // ========================================
    // 🎨 Design System — 포스터용 소형 UI 프리미티브
    // ========================================

    function Badge({ children }) {
      return (
        <span className="inline-block font-point text-sm sm:text-base tracking-wide
                         bg-white/85 text-orange-600 rounded-full px-4 py-1.5
                         shadow-sm ring-1 ring-orange-200">
          {children}
        </span>
      );
    }

    // 실사진을 담는 프레임 카드
    //   - 둥근 모서리 + 그림자 + 링
    //   - 비네트 / 상하 그라데이션 오버레이로 텍스트 가독성 확보
    //   - 이미지 로드 실패 시 대체 UI 표시
    function PhotoFrame({ src, alt }) {
      const [status, setStatus] = useState('loading'); // loading | loaded | error

      return (
        <div className="relative w-full aspect-square rounded-[22px] overflow-hidden
                        shadow-[0_18px_40px_-12px_rgba(11,114,133,0.55)]
                        ring-1 ring-white/70 bg-cyan-100/60">
          {/* 로딩 스켈레톤 */}
          {status === 'loading' && (
            <div className="absolute inset-0 flex items-center justify-center
                            bg-gradient-to-br from-sky-100 to-amber-100 animate-pulse">
              <span className="font-body text-cyan-700/60 text-sm">사진 불러오는 중…</span>
            </div>
          )}

          {/* 로드 실패 대체 UI */}
          {status === 'error' && (
            <div className="absolute inset-0 flex flex-col items-center justify-center gap-2
                            bg-gradient-to-br from-amber-100 to-sky-100 text-center px-6">
              <span className="text-4xl">🥭</span>
              <span className="font-point text-orange-600">이미지를 불러오지 못했어요</span>
              <span className="font-body text-xs text-cyan-700/60 break-all">{src}</span>
            </div>
          )}

          {/* 실제 사진 */}
          <img
            src={src}
            alt={alt}
            onLoad={() => setStatus('loaded')}
            onError={() => setStatus('error')}
            className={`w-full h-full object-cover transition-opacity duration-700
                        ${status === 'loaded' ? 'opacity-100' : 'opacity-0'}`}
          />

          {/* 텍스트 가독성용 오버레이 그라데이션 (상단/하단) */}
          <div className="pointer-events-none absolute inset-0
                          bg-gradient-to-t from-cyan-950/45 via-transparent to-cyan-950/10" />
          {/* 은은한 비네트 */}
          <div className="pointer-events-none absolute inset-0
                          shadow-[inset_0_0_60px_20px_rgba(8,51,68,0.28)] rounded-[22px]" />

          {/* 사진 위를 스치는 광택 */}
          <div className="pointer-events-none absolute inset-0 overflow-hidden rounded-[22px]">
            <div className="sheen absolute top-0 left-0 h-full w-1/3
                            bg-gradient-to-r from-transparent via-white/60 to-transparent" />
          </div>

          {/* 사진 위 코너 라벨 */}
          <div className="absolute top-3 left-3">
            <span className="font-point text-[11px] tracking-wide text-white/95
                             bg-orange-500/85 rounded-full px-3 py-1 shadow-sm">
              🥭 REAL PHOTO
            </span>
          </div>

          {/* 사진 하단 캡션 */}
          <div className="absolute bottom-3 left-4 right-4 flex items-end justify-between">
            <span className="font-body text-white/90 text-xs sm:text-sm drop-shadow">
              편집샵 스타일 · 45° food photography
            </span>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 배경 데코 (떠다니는 미니 망고 / 물방울)
    // ========================================
    function FloatingDeco() {
      return (
        <>
          <div className="floaty pointer-events-none absolute top-24 left-4 text-3xl opacity-80 select-none">🥭</div>
          <div className="floaty-slow pointer-events-none absolute top-16 right-5 text-2xl opacity-70 select-none">✨</div>
          <div className="floaty-slow pointer-events-none absolute bottom-28 left-6 text-xl opacity-60 select-none">💧</div>
        </>
      );
    }

    // ========================================
    // 📄 포스터 컴포넌트 (실사진 버전)
    // ========================================
    function PhotoPoster() {
      return (
        <div className="relative w-full max-w-[440px] mx-auto
                        rounded-[28px] overflow-hidden shadow-2xl
                        bg-gradient-to-br from-sky-300 via-cyan-200 to-amber-100
                        ring-1 ring-white/60">
          {/* 배경 데코 원 */}
          <div className="pointer-events-none absolute -top-16 -left-16 w-56 h-56
                          rounded-full bg-white/25 blur-2xl" />
          <div className="pointer-events-none absolute top-24 -right-20 w-60 h-60
                          rounded-full bg-amber-200/40 blur-2xl" />
          <div className="pointer-events-none absolute bottom-0 left-0 w-full h-40
                          bg-gradient-to-t from-amber-100/70 to-transparent" />

          <FloatingDeco />

          <div className="relative px-7 pt-9 pb-8 flex flex-col items-center">
            {/* 상단 카피 */}
            <Badge>SUMMER LIMITED · 여름 한정</Badge>

            {/* 타이틀 */}
            <h1 className="mt-4 text-center leading-none">
              <span className="block font-title text-6xl sm:text-7xl
                               text-amber-500 drop-shadow-[0_3px_0_rgba(255,255,255,0.7)]">
                망고 빙수
              </span>
              <span className="block font-point text-lg sm:text-xl text-cyan-700 mt-2 tracking-widest">
                MANGO BINGSU
              </span>
            </h1>

            {/* 메인 비주얼 — 실사진 프레임 */}
            <div className="w-full mt-4 mb-1">
              <PhotoFrame
                src="photos/mango-bingsu-real.jpg"
                alt="유리그릇에 곱게 간 얼음과 망고 큐브, 민트 잎을 올린 실사 망고 빙수"
              />
            </div>

            {/* 카피 문구 */}
            <p className="font-body text-center text-cyan-900/80 text-base sm:text-lg leading-relaxed mt-4">
              눈처럼 곱게 갈린 얼음 위,<br />
              완숙 망고를 가득 올렸어요.<br />
              <span className="text-orange-600 font-point">한 스푼에 시원한 여름</span>
            </p>

            {/* 하단 정보 바 */}
            <div className="mt-6 w-full flex items-center justify-between
                            bg-white/80 backdrop-blur rounded-2xl px-5 py-3
                            shadow-sm ring-1 ring-white/70">
              <div className="font-body text-xs sm:text-sm text-cyan-800/70 leading-tight">
                <div>제철 애플망고 100%</div>
                <div>수제 연유 · 우유 얼음</div>
              </div>
              <div className="text-right">
                <div className="font-point text-2xl sm:text-3xl text-orange-600">₩12,900</div>
                <div className="font-body text-[11px] text-cyan-700/60">1인 · 2인 사이즈</div>
              </div>
            </div>

            {/* 매장 표기 */}
            <div className="mt-5 font-point text-cyan-700/70 text-sm tracking-[0.2em]">
              8시 반 · EIGHT THIRTY CAFE
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <div className="min-h-screen w-full flex items-center justify-center
                        bg-gradient-to-b from-sky-100 to-cyan-50 p-4 sm:p-8">
          <PhotoPoster />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
