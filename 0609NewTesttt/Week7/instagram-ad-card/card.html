<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ATELIER GRAY — Instagram Ad Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #EFE9E1;
    overflow: hidden;
  }
  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .visual {
    position: relative;
    height: 620px;
    background: linear-gradient(155deg, #DCD3C3 0%, #B9AF9C 55%, #8B8378 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .visual::before {
    content: "";
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: rgba(239,233,225,0.35);
    top: -160px; right: -140px;
  }
  .vase {
    width: 220px;
    height: 340px;
    margin-bottom: -20px;
    background: linear-gradient(180deg, #EFE9E1 0%, #D8CFC0 100%);
    border-radius: 90px 90px 40px 40px / 130px 130px 40px 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
  }
  .brand-tag {
    position: absolute;
    top: 56px; left: 56px;
    font-size: 26px;
    letter-spacing: 0.22em;
    color: #EFE9E1;
    font-weight: 700;
  }
  .content {
    flex: 1;
    padding: 56px 64px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .copy {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.18;
    color: #2B2A28;
  }
  .sub {
    font-size: 26px;
    color: #6E675C;
    margin-top: 20px;
    font-weight: 500;
  }
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: #EFE9E1;
    background: #2B2A28;
    padding: 20px 34px;
    border-radius: 999px;
  }
  .price {
    font-size: 24px;
    color: #8B8378;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="visual">
      <div class="brand-tag">ATELIER GRAY</div>
      <div class="vase"></div>
    </div>
    <div class="content">
      <div>
        <div class="copy">공간에,<br>여백을 놓다.</div>
        <div class="sub">세라믹 화병 컬렉션 · Warm Gray Edition</div>
      </div>
      <div class="bottom-row">
        <div class="price">10월 한정 · 사전예약 15% </div>
        <div class="cta">지금 둘러보기 →</div>
      </div>
    </div>
  </div>
</body>
</html>
