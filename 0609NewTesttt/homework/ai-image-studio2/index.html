<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AI Studio · 이미지 생성</title>

  <!-- React 18 + ReactDOM + Babel (브라우저 내 JSX 변환) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 인스타그램 그라데이션 */
    .ig-gradient { background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
    .ig-text-gradient {
      background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* 아바타 링(스토리 느낌) */
    .ig-ring { background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); padding: 2px; border-radius: 9999px; }
    html, body { -webkit-font-smoothing: antialiased; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    @keyframes shimmer { 0%{ background-position: -468px 0 } 100%{ background-position: 468px 0 } }
    .shimmer { animation: shimmer 1.4s linear infinite; background: linear-gradient(90deg,#f3f3f3 8%,#e9e9e9 18%,#f3f3f3 33%); background-size: 800px 100%; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    /* =========================================================================
       하이브리드 이미지 생성 연동
       1순위) Google Gemini (gemini-2.5-flash-image) — 사용자가 넣은 API 키 사용
           POST .../models/gemini-2.5-flash-image:generateContent?key=<API_KEY>
           응답의 inlineData(base64)를 data URL로 표시.
       2순위) Pollinations.ai (무료·키 불필요) — Gemini가 실패(429 quota/인증/차단/네트워크)하면
           자동 폴백. 이미지 URL 자체가 생성 요청이며 <img>로 직접 로드(CORS 불필요).
       → 결과적으로 "내 키를 쓰되, 막히면 무료로라도 항상 그림이 나온다".
       ========================================================================= */
    // 공개 저장소 보안: 키를 비워둠. 키가 없으면 무료 Pollinations로 동작하고,
    // 설정(⚙️)에서 Gemini 키를 넣으면 그때부터 Gemini를 우선 사용한다.
    const DEFAULT_API_KEY = "";
    const MODEL_ID = "gemini-2.5-flash-image";
    const ENDPOINT = (key) =>
      "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL_ID +
      ":generateContent?key=" + encodeURIComponent(key);

    // Pollinations(무료 폴백)
    const POLLI_BASE = "https://image.pollinations.ai/prompt/";
    const POLLI_MODEL = "flux";

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // 스타일 프리셋: 선택 시 프롬프트 뒤에 영어 디스크립터를 덧붙임
    const STYLE_PRESETS = [
      { id: "toystory",   label: "토이스토리", emoji: "🤠", suffix: ", in the style of Pixar Toy Story, 3D animated movie, glossy cute characters, vibrant colorful render, cinematic lighting" },
      { id: "transformer",label: "트랜스포머", emoji: "🤖", suffix: ", as a giant Transformers mecha robot, intricate mechanical metal parts, Michael Bay cinematic, dramatic lighting, sci-fi" },
      { id: "watercolor", label: "수채화느낌", emoji: "🎨", suffix: ", delicate watercolor painting, soft color washes, visible paper texture, hand-painted, artistic" },
      { id: "pixel",      label: "픽셀아트",   emoji: "👾", suffix: ", 8-bit pixel art, retro video game sprite, pixelated, limited palette" },
      { id: "futurism",   label: "퓨처리즘",   emoji: "🛸", suffix: ", futurism, cyberpunk, neon-lit, sci-fi, sleek futuristic design, holographic" },
    ];

    // 비율: id는 Gemini 프롬프트 힌트로, w/h는 Pollinations 픽셀로, ratio는 카드 표시(CSS)용
    const ASPECTS = [
      { id: "1:1",  label: "정방형 1:1", ratio: "1 / 1",  w: 1024, h: 1024 },
      { id: "3:4",  label: "세로 3:4",   ratio: "3 / 4",  w: 768,  h: 1024 },
      { id: "4:3",  label: "가로 4:3",   ratio: "4 / 3",  w: 1024, h: 768 },
      { id: "9:16", label: "세로 9:16",  ratio: "9 / 16", w: 576,  h: 1024 },
      { id: "16:9", label: "가로 16:9",  ratio: "16 / 9", w: 1024, h: 576 },
    ];

    // 이미지 한 장 생성 (Gemini 호출 1회)
    async function generateOneImage({ key, prompt }) {
      const res = await fetch(ENDPOINT(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseModalities: ["IMAGE"] },
        }),
      });

      if (!res.ok) {
        let msg = res.statusText;
        try { const e = await res.json(); msg = (e.error && e.error.message) || msg; } catch (_) {}
        if (res.status === 429) {
          throw new Error("무료 사용량(quota)을 초과했어요. 무료 일일 이미지 한도가 소진된 상태예요. 잠시 후(또는 내일) 다시 시도하거나 ai.dev/projects 에서 결제를 설정하세요.");
        }
        if (res.status === 401 || res.status === 403) {
          throw new Error("API 키 인증 실패예요. 설정(⚙️)에서 키를 확인해주세요. (" + res.status + ")");
        }
        if (res.status === 400 && /paid|billing|upgrade/i.test(msg)) {
          throw new Error("이 기능은 유료 플랜이 필요해요. ai.dev/projects 에서 결제를 설정하세요.");
        }
        throw new Error("생성 실패 (" + res.status + "): " + msg);
      }

      const data = await res.json();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const imgPart = parts.find((p) => p.inlineData && p.inlineData.data);
      if (!imgPart) {
        const blocked = data.promptFeedback && data.promptFeedback.blockReason;
        throw new Error(blocked
          ? ("안전 필터로 차단되었어요 (" + blocked + "). 다른 프롬프트로 시도해보세요.")
          : "이미지를 받지 못했어요. 다른 프롬프트로 시도해보세요.");
      }
      return "data:" + (imgPart.inlineData.mimeType || "image/png") + ";base64," + imgPart.inlineData.data;
    }

    /* -------- Pollinations(무료 폴백) -------- */
    function polliUrl({ prompt, w, h, seed }) {
      const params = new URLSearchParams({
        width: String(w), height: String(h), seed: String(seed),
        model: POLLI_MODEL, nologo: "true",
      });
      return POLLI_BASE + encodeURIComponent(prompt) + "?" + params.toString();
    }
    // URL을 <img>로 실제 로드해 정상 생성 확인 (성공 시 그 URL 반환)
    function polliLoad(url, timeoutMs = 150000) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; reject(new Error("Pollinations 시간 초과")); } }, timeoutMs);
        img.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(url); } };
        img.onerror = () => { if (!done) { done = true; clearTimeout(timer); reject(new Error("Pollinations 로드 실패")); } };
        img.src = url;
      });
    }
    async function polliOne({ prompt, w, h, i }) {
      const seed = Math.floor(Math.random() * 1e9) + i;
      try { return await polliLoad(polliUrl({ prompt, w, h, seed })); }
      catch (e) { await sleep(2200); return await polliLoad(polliUrl({ prompt, w, h, seed: seed + 7777 })); }
    }

    /* -------- 하이브리드 생성: Gemini 우선, 실패 시 Pollinations 폴백 --------
       무료 등급 제한을 고려해 한 장씩 순차 생성. Gemini가 한 번 막히면(geminiDown)
       이후 장은 곧장 Pollinations로 생성한다. 각 이미지의 출처(source)도 함께 기록. */
    async function generateImages({ key, geminiPrompt, polliPrompt, w, h, count, onProgress }) {
      const images = [], sources = [];
      let geminiDown = !key, lastErr; // 키 없으면 곧장 무료 모델로
      for (let i = 0; i < count; i++) {
        const n = count > 1 ? ((i + 1) + "/" + count + " ") : "";
        // 1순위: Gemini
        if (!geminiDown) {
          onProgress && onProgress(n + "Gemini로 그리는 중...");
          try { images.push(await generateOneImage({ key, prompt: geminiPrompt })); sources.push("Gemini");
                if (i < count - 1) await sleep(600); continue; }
          catch (e) { lastErr = e; geminiDown = true; } // 막혔으니 이후는 무료로
        }
        // 2순위: Pollinations(무료)
        onProgress && onProgress(n + "무료 모델로 그리는 중...");
        try { images.push(await polliOne({ prompt: polliPrompt, w, h, i })); sources.push("무료"); }
        catch (e) { lastErr = e; }
        if (i < count - 1) await sleep(700);
      }
      if (!images.length) throw lastErr || new Error("이미지를 생성하지 못했어요.");
      return { images, sources };
    }

    /* ============================== 아이콘 ============================== */
    const Icon = ({ path, className = "w-6 h-6", fill = "none", stroke = "currentColor", sw = 1.8 }) => (
      <svg viewBox="0 0 24 24" className={className} fill={fill} stroke={stroke} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {path}
      </svg>
    );
    const HeartIcon = (p) => <Icon {...p} path={<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />} />;
    const CommentIcon = (p) => <Icon {...p} path={<path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z" />} />;
    const ShareIcon = (p) => <Icon {...p} path={<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" />} />;
    const BookmarkIcon = (p) => <Icon {...p} path={<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />} />;
    const DownloadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>} />;
    const TrashIcon = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>} />;
    const SparkleIcon = (p) => <Icon {...p} path={<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" />} />;
    const PlusIcon = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>} />;
    const XIcon = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>} />;
    const HomeIcon = (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></>} />;

    /* ============================== 상단 바 ============================== */
    function TopBar({ onOpenSettings }) {
      return (
        <header className="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
          <div className="max-w-[600px] mx-auto px-4 h-14 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="ig-gradient w-8 h-8 rounded-xl flex items-center justify-center shadow-sm">
                <SparkleIcon className="w-5 h-5 text-white" fill="white" stroke="white" />
              </div>
              <h1 className="text-xl font-bold tracking-tight" style={{fontFamily:'"Segoe Script","Snell Roundhand",cursive'}}>
                <span className="ig-text-gradient">AI&nbsp;Studio</span>
              </h1>
            </div>
            <button onClick={onOpenSettings} className="text-sm text-gray-500 hover:text-gray-900 flex items-center gap-1">
              <Icon className="w-5 h-5" path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.2.62.78 1.05 1.43 1.05H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />
            </button>
          </div>
        </header>
      );
    }

    /* ============================== 스타일 칩 ============================== */
    function StyleChips({ value, onChange }) {
      return (
        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
          {STYLE_PRESETS.map((s) => {
            const active = value === s.id;
            return (
              <button key={s.id} onClick={() => onChange(active ? null : s.id)}
                className="flex flex-col items-center gap-1 flex-shrink-0 focus:outline-none">
                <div className={active ? "ig-ring" : "p-[2px] rounded-full bg-gray-200"}>
                  <div className={"w-16 h-16 rounded-full flex items-center justify-center text-2xl " + (active ? "bg-white" : "bg-gray-100")}>
                    {s.emoji}
                  </div>
                </div>
                <span className={"text-xs " + (active ? "font-bold text-gray-900" : "text-gray-500")}>{s.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    /* ============================== 작성(Composer) ============================== */
    function Composer({ onGenerate, busy, status }) {
      const [prompt, setPrompt] = useState("");
      const [style, setStyle] = useState(null);
      const [aspect, setAspect] = useState("1:1");
      const [count, setCount] = useState(1);

      const submit = () => {
        if (!prompt.trim() || busy) return;
        onGenerate({ prompt: prompt.trim(), style, aspect, count });
      };

      return (
        <section className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm">
          <div className="flex items-center gap-2 mb-3">
            <div className="ig-gradient w-7 h-7 rounded-full flex items-center justify-center">
              <PlusIcon className="w-4 h-4 text-white" />
            </div>
            <span className="font-semibold text-sm">새 이미지 만들기</span>
          </div>

          <textarea
            value={prompt}
            onChange={(e) => setPrompt(e.target.value)}
            onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit(); }}
            placeholder="어떤 이미지를 만들고 싶나요? 예) 노을 지는 해변을 걷는 강아지"
            rows={3}
            className="w-full resize-none rounded-xl border border-gray-200 bg-gray-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white"
          />

          <div className="mt-3">
            <p className="text-xs font-semibold text-gray-500 mb-2">스타일 프리셋</p>
            <StyleChips value={style} onChange={setStyle} />
          </div>

          <div className="mt-3 grid grid-cols-2 gap-3">
            <label className="text-xs text-gray-500">
              <span className="block mb-1 font-semibold">비율</span>
              <select value={aspect} onChange={(e) => setAspect(e.target.value)}
                className="w-full rounded-lg border border-gray-200 bg-white px-2 py-2 text-sm">
                {ASPECTS.map((a) => <option key={a.id} value={a.id}>{a.label}</option>)}
              </select>
            </label>
            <label className="text-xs text-gray-500">
              <span className="block mb-1 font-semibold">장 수: {count}</span>
              <input type="range" min="1" max="4" value={count} onChange={(e) => setCount(Number(e.target.value))}
                className="w-full accent-pink-500 mt-2" />
            </label>
          </div>

          <button onClick={submit} disabled={busy || !prompt.trim()}
            className={"mt-4 w-full ig-gradient text-white font-bold py-3 rounded-xl shadow-sm transition active:scale-[.99] flex items-center justify-center gap-2 " + ((busy || !prompt.trim()) ? "opacity-50 cursor-not-allowed" : "hover:brightness-105")}>
            {busy ? (
              <>
                <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                {status || "생성 중..."}
              </>
            ) : (
              <><SparkleIcon className="w-5 h-5" fill="white" stroke="white" /> 생성하기</>
            )}
          </button>
          <p className="text-[11px] text-gray-400 text-center mt-2">⌘/Ctrl + Enter 로도 생성 · Gemini 우선, 막히면 무료 모델로 자동 전환</p>
        </section>
      );
    }

    /* ============================== 생성 중 스켈레톤 ============================== */
    function PendingCard({ status, aspect }) {
      const ratio = (ASPECTS.find((a) => a.id === aspect) || ASPECTS[0]).ratio;
      return (
        <article className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
          <div className="flex items-center gap-2 px-3 py-2.5">
            <div className="ig-ring"><div className="w-8 h-8 rounded-full bg-white flex items-center justify-center"><SparkleIcon className="w-4 h-4 ig-text-gradient" /></div></div>
            <span className="text-sm font-semibold">AI Studio</span>
            <span className="ml-auto text-xs text-pink-500 font-medium">{status || "생성 중..."}</span>
          </div>
          <div className="shimmer w-full flex items-center justify-center" style={{ aspectRatio: ratio }}>
            <span className="w-7 h-7 border-2 border-pink-400 border-t-transparent rounded-full animate-spin"></span>
          </div>
        </article>
      );
    }

    /* ============================== 게시물 카드 ============================== */
    function PostCard({ post, onDelete, onView }) {
      const [liked, setLiked] = useState(false);
      const [saved, setSaved] = useState(false);
      const styleLabel = post.styleLabel;
      const time = new Date(post.createdAt);
      const timeStr = time.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });

      // data URL(Gemini)·원격 URL(Pollinations) 모두 대응
      const download = async (url, idx) => {
        const name = "ai-studio-" + post.id + (idx ? "-" + idx : "") + ".png";
        try {
          if (url.startsWith("data:")) {
            const a = document.createElement("a");
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            return;
          }
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          const blob = await res.blob();
          const obj = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = obj; a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(obj), 1000);
        } catch (e) {
          window.open(url, "_blank");
        }
      };

      const [imgIdx, setImgIdx] = useState(0);
      const multi = post.images.length > 1;

      return (
        <article className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="flex items-center gap-2 px-3 py-2.5">
            <div className="ig-ring"><div className="w-8 h-8 rounded-full bg-white flex items-center justify-center"><SparkleIcon className="w-4 h-4 ig-text-gradient" /></div></div>
            <div className="leading-tight">
              <p className="text-sm font-semibold">AI Studio</p>
              {styleLabel && <p className="text-[11px] text-gray-400">#{styleLabel}</p>}
            </div>
            <button onClick={() => onDelete(post.id)} className="ml-auto text-gray-400 hover:text-red-500 p-1" title="삭제">
              <TrashIcon className="w-5 h-5" />
            </button>
          </div>

          {/* 이미지 */}
          <div className="relative bg-black select-none">
            <img src={post.images[imgIdx]} alt={post.prompt}
              onClick={() => onView(post.images[imgIdx])}
              className="w-full object-cover cursor-zoom-in" style={{ aspectRatio: post.ratio }} loading="lazy" />
            {post.sources && post.sources[imgIdx] && (
              <div className="absolute top-2 left-2 bg-black/55 text-white text-[11px] font-medium px-2 py-0.5 rounded-full backdrop-blur-sm">
                {post.sources[imgIdx] === "Gemini" ? "✦ Gemini" : "🆓 무료"}
              </div>
            )}
            {multi && (
              <>
                <div className="absolute top-2 right-2 bg-black/60 text-white text-[11px] px-2 py-0.5 rounded-full">{imgIdx + 1}/{post.images.length}</div>
                <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5">
                  {post.images.map((_, i) => (
                    <button key={i} onClick={() => setImgIdx(i)} className={"w-1.5 h-1.5 rounded-full " + (i === imgIdx ? "bg-white" : "bg-white/40")}></button>
                  ))}
                </div>
              </>
            )}
          </div>

          {/* 액션 바 */}
          <div className="flex items-center gap-4 px-3 pt-3">
            <button onClick={() => setLiked((v) => !v)} className="transition active:scale-90">
              <HeartIcon className="w-7 h-7" fill={liked ? "#ed4956" : "none"} stroke={liked ? "#ed4956" : "currentColor"} />
            </button>
            <button className="transition active:scale-90"><CommentIcon className="w-7 h-7" /></button>
            <button onClick={() => download(post.images[imgIdx], multi ? imgIdx + 1 : 0)} className="transition active:scale-90" title="다운로드">
              <DownloadIcon className="w-6 h-6" />
            </button>
            <button onClick={() => setSaved((v) => !v)} className="ml-auto transition active:scale-90">
              <BookmarkIcon className="w-7 h-7" fill={saved ? "currentColor" : "none"} />
            </button>
          </div>

          {/* 좋아요/캡션 */}
          <div className="px-3 pb-3 pt-2">
            <p className="text-sm font-semibold">좋아요 {(liked ? 1 : 0) + (post.id % 90 + 11)}개</p>
            <p className="text-sm mt-1">
              <span className="font-semibold mr-1">ai_studio</span>
              {post.prompt}
              {styleLabel && <span className="ig-text-gradient font-semibold"> #{styleLabel}</span>}
            </p>
            <button onClick={() => onView(post.images[imgIdx])} className="text-xs text-pink-500 mt-1">이미지 보기</button>
            <p className="text-[11px] text-gray-400 mt-1">{timeStr}</p>
          </div>
        </article>
      );
    }

    /* ============================== 이미지 모달 ============================== */
    function Lightbox({ url, onClose }) {
      if (!url) return null;
      return (
        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={onClose}>
          <button className="absolute top-4 right-4 text-white/80 hover:text-white"><XIcon className="w-8 h-8" /></button>
          <img src={url} className="max-w-full max-h-full rounded-lg shadow-2xl" onClick={(e) => e.stopPropagation()} />
        </div>
      );
    }

    /* ============================== 설정 모달 ============================== */
    function SettingsModal({ open, apiKey, onSave, onClose }) {
      const [val, setVal] = useState(apiKey);
      useEffect(() => setVal(apiKey), [apiKey, open]);
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-bold">설정</h3>
              <button onClick={onClose}><XIcon className="w-5 h-5" /></button>
            </div>
            <label className="text-xs font-semibold text-gray-500">Google Gemini API 키</label>
            <input value={val} onChange={(e) => setVal(e.target.value)}
              placeholder="Gemini API 키 (선택 — 비우면 무료 모델 사용)"
              className="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2 text-sm font-mono" />
            <p className="text-[11px] text-gray-400 mt-2">키는 이 브라우저(localStorage)에만 저장됩니다. 1순위 <code>gemini-2.5-flash-image</code>, 실패 시 무료 <code>Pollinations</code>로 자동 폴백돼요.</p>
            <button onClick={() => { onSave(val.trim()); onClose(); }}
              className="mt-4 w-full ig-gradient text-white font-bold py-2.5 rounded-xl">저장</button>
          </div>
        </div>
      );
    }

    /* ============================== 앱 ============================== */
    function App() {
      const [posts, setPosts] = useState(() => {
        try { return JSON.parse(localStorage.getItem("aistudio_posts") || "[]"); } catch { return []; }
      });
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("aistudio_gemini_key_v2") || DEFAULT_API_KEY);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("");
      const [pendingAspect, setPendingAspect] = useState("1:1");
      const [error, setError] = useState("");
      const [lightbox, setLightbox] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const counter = useRef(Date.now());

      useEffect(() => {
        try { localStorage.setItem("aistudio_posts", JSON.stringify(posts)); } catch (_) {}
      }, [posts]);
      useEffect(() => { localStorage.setItem("aistudio_gemini_key_v2", apiKey); }, [apiKey]);

      const handleGenerate = useCallback(async ({ prompt, style, aspect, count }) => {
        setError("");
        setBusy(true);
        setPendingAspect(aspect);
        const preset = STYLE_PRESETS.find((s) => s.id === style);
        const aspectObj = ASPECTS.find((a) => a.id === aspect) || ASPECTS[0];
        const basePrompt = prompt + (preset ? preset.suffix : "");
        // Gemini는 프롬프트 힌트로 비율 전달, Pollinations는 w/h 픽셀로 전달
        const geminiPrompt = basePrompt + ", aspect ratio " + aspect + ", high quality, detailed";
        try {
          const { images, sources } = await generateImages({
            key: apiKey, geminiPrompt, polliPrompt: basePrompt,
            w: aspectObj.w, h: aspectObj.h, count, onProgress: setStatus,
          });
          const post = {
            id: counter.current++,
            prompt, images, sources, ratio: aspectObj.ratio, aspect,
            styleLabel: preset ? preset.label : null,
            createdAt: Date.now(),
          };
          setPosts((p) => [post, ...p]);
        } catch (e) {
          setError(e.message || "알 수 없는 오류가 발생했어요.");
        } finally {
          setBusy(false);
          setStatus("");
        }
      }, [apiKey]);

      const deletePost = (id) => setPosts((p) => p.filter((x) => x.id !== id));

      return (
        <div className="min-h-screen pb-20">
          <TopBar onOpenSettings={() => setSettingsOpen(true)} />

          <main className="max-w-[600px] mx-auto px-3 sm:px-4 py-4 space-y-4">
            <Composer onGenerate={handleGenerate} busy={busy} status={status} />

            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 flex items-start gap-2">
                <span>⚠️</span>
                <div className="flex-1">{error}</div>
                <button onClick={() => setError("")}><XIcon className="w-4 h-4" /></button>
              </div>
            )}

            {busy && <PendingCard status={status} aspect={pendingAspect} />}

            {!busy && posts.length === 0 && (
              <div className="text-center py-16 text-gray-400">
                <div className="ig-gradient w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4">
                  <SparkleIcon className="w-8 h-8 text-white" fill="white" stroke="white" />
                </div>
                <p className="font-semibold text-gray-600">아직 생성된 이미지가 없어요</p>
                <p className="text-sm mt-1">첫 작품을 만들어보세요! ✨</p>
              </div>
            )}

            {posts.map((post) => (
              <PostCard key={post.id} post={post} onDelete={deletePost} onView={setLightbox} />
            ))}
          </main>

          {/* 하단 탭바 (인스타 느낌의 장식) */}
          <nav className="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur border-t border-gray-200 z-30">
            <div className="max-w-[600px] mx-auto h-14 flex items-center justify-around text-gray-700">
              <HomeIcon className="w-7 h-7" />
              <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
                <div className="ig-gradient w-9 h-9 rounded-xl flex items-center justify-center"><PlusIcon className="w-5 h-5 text-white" /></div>
              </button>
              <div className="ig-ring"><div className="w-7 h-7 rounded-full bg-white flex items-center justify-center"><SparkleIcon className="w-4 h-4 ig-text-gradient" /></div></div>
            </div>
          </nav>

          <Lightbox url={lightbox} onClose={() => setLightbox(null)} />
          <SettingsModal open={settingsOpen} apiKey={apiKey} onSave={setApiKey} onClose={() => setSettingsOpen(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
