<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧑‍🍳 냉장고 셰프 · AI 레시피 메이커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    /* ===== SMEG 냉장고 + 1970s 아메리칸 레트로 테마 ===== */
    :root{
      --mint:#5cffd1;        /* 메인 컬러 1 */
      --mint-pale:#BDFCC9;   /* 메인 컬러 2 */
      --cream:#FDF3E0;
      --orange:#FF7A4D;      /* 70s 액센트 */
      --mustard:#F2B441;
      --ink:#2c2a26;
    }
    body{
      margin:0; min-height:100vh; color:var(--ink);
      font-family:'Jua','Apple SD Gothic Neo',sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #fff6e0 0%, var(--cream) 45%, #f4e6c8 100%);
    }
    /* 70s 도트 패턴 오버레이 */
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
      background-image: radial-gradient(rgba(92,255,209,.25) 2px, transparent 2px);
      background-size: 26px 26px;
    }
    .script{ font-family:'Pacifico',cursive; }

    /* 냉장고 본체 */
    .fridge{
      position:relative; z-index:1;
      background:linear-gradient(165deg, var(--mint-pale) 0%, var(--mint) 100%);
      border:7px solid #ffffff;
      border-radius:48px;
      box-shadow:0 26px 60px rgba(45,70,60,.28), inset 0 3px 0 rgba(255,255,255,.7);
      overflow:hidden;
    }
    /* 상단 글로스 하이라이트 */
    .fridge::after{
      content:""; position:absolute; top:0; left:0; right:0; height:120px; pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    }
    /* 70s 스트라이프 액센트 바 */
    .stripes{ height:10px; display:flex; }
    .stripes i{ flex:1; }

    .card{ background:#fffdf8; border-radius:30px; box-shadow:0 10px 26px rgba(45,70,60,.14); }
    .btn{
      font-family:'Jua',sans-serif; border:none; cursor:pointer; border-radius:999px;
      transition:transform .08s, box-shadow .08s, filter .08s;
      box-shadow:0 6px 0 rgba(0,0,0,.12);
    }
    .btn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; }
    .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 12px; font-size:13px; }
    input::placeholder,textarea::placeholder{ color:#b3ac9b; }
    .spin{ animation:spin 1s linear infinite; display:inline-block; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const MINT = '#5cffd1', MINT_PALE = '#BDFCC9', ORANGE = '#FF7A4D', MUSTARD = '#F2B441', INK = '#2c2a26';

    function fmt(iso) {
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
    }
    async function api(url, opts) {
      const res = await fetch(url, opts);
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.success) throw new Error(json.message || '요청에 실패했습니다.');
      return json.data;
    }

    function Stripes() {
      const cols = [MINT, MINT_PALE, MUSTARD, ORANGE, MINT];
      return <div className="stripes">{cols.map((c, i) => <i key={i} style={{ background: c }} />)}</div>;
    }

    function Toast({ msg }) {
      if (!msg) return null;
      return (
        <div className="card" style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', zIndex: 50, padding: '10px 20px', background: INK, color: '#fff', borderRadius: 999 }}>
          {msg}
        </div>
      );
    }

    // ----- 난이도/시간/출처 배지 -----
    function Badges({ recipe }) {
      const src = recipe.source === 'ai'
        ? { t: '🤖 AI 생성', bg: '#e8fff8', c: '#0b8f73' }
        : { t: '🧪 데모 생성', bg: '#fff1e6', c: '#c2632a' };
      return (
        <div className="flex flex-wrap gap-2 mt-1">
          {recipe.cook_time && <span className="pill" style={{ background: MINT_PALE, color: INK }}>⏱ {recipe.cook_time}</span>}
          {recipe.difficulty && <span className="pill" style={{ background: '#fff7d6', color: '#8a6a12' }}>🔥 {recipe.difficulty}</span>}
          <span className="pill" style={{ background: src.bg, color: src.c }}>{src.t}</span>
        </div>
      );
    }

    function RecipeBody({ recipe }) {
      return (
        <>
          {recipe.description && <p className="mt-3 text-[15px] text-[#6b6452] leading-relaxed">{recipe.description}</p>}
          {recipe.ingredients?.length > 0 && (
            <div className="mt-4">
              <p className="text-[15px] mb-1" style={{ color: ORANGE }}>🧺 재료</p>
              <ul className="text-[15px] text-[#43403a] space-y-1">
                {recipe.ingredients.map((it, i) => <li key={i}>· {it}</li>)}
              </ul>
            </div>
          )}
          {recipe.steps?.length > 0 && (
            <div className="mt-4">
              <p className="text-[15px] mb-1" style={{ color: ORANGE }}>👩‍🍳 조리 순서</p>
              <ol className="text-[15px] text-[#43403a] space-y-1.5">
                {recipe.steps.map((st, i) => (
                  <li key={i} className="flex gap-2">
                    <span style={{ background: MINT, color: INK, borderRadius: 999, minWidth: 22, height: 22, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 13 }}>{i + 1}</span>
                    <span className="flex-1">{st}</span>
                  </li>
                ))}
              </ol>
            </div>
          )}
        </>
      );
    }

    // ============================================================
    function App() {
      const [ai, setAi] = useState(null);          // {ai, model} | null
      const [input, setInput] = useState('');
      const [generating, setGenerating] = useState(false);
      const [preview, setPreview] = useState(null);
      const [saving, setSaving] = useState(false);
      const [recipes, setRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [open, setOpen] = useState(null);       // 펼쳐진 레시피 id
      const [toast, setToast] = useState('');

      const notify = useCallback((m) => { setToast(m); setTimeout(() => setToast(''), 2400); }, []);

      const chips = [...new Set(input.split(/[,\n]/).map((s) => s.trim()).filter(Boolean))];

      const loadRecipes = useCallback(async () => {
        setLoading(true);
        try { setRecipes(await api('/api/recipes')); }
        catch (e) { notify(e.message); }
        finally { setLoading(false); }
      }, [notify]);

      useEffect(() => {
        api('/api/status').then(setAi).catch(() => setAi({ ai: false }));
        loadRecipes();
      }, [loadRecipes]);

      const generate = async () => {
        if (chips.length === 0 || generating) return;
        setGenerating(true); setPreview(null);
        try {
          const r = await api('/api/recipes/generate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ingredients: chips }),
          });
          setPreview(r);
        } catch (e) { notify(e.message); }
        finally { setGenerating(false); }
      };

      const save = async () => {
        if (!preview || saving) return;
        setSaving(true);
        try {
          const saved = await api('/api/recipes', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(preview),
          });
          setRecipes((prev) => [saved, ...prev]);
          setPreview(null);
          notify('레시피를 냉장고에 저장했어요! 🧊');
        } catch (e) { notify(e.message); }
        finally { setSaving(false); }
      };

      const remove = async (id) => {
        if (!window.confirm('이 레시피를 삭제할까요?')) return;
        try {
          await api(`/api/recipes/${id}`, { method: 'DELETE' });
          setRecipes((prev) => prev.filter((r) => r.id !== id));
          notify('삭제했어요.');
        } catch (e) { notify(e.message); }
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-8">
          <div className="fridge">
            <Stripes />

            <div className="px-6 py-7 sm:px-8">
              {/* 브랜드 헤더 (SMEG 스타일 크롬 배지) */}
              <header className="text-center mb-5">
                <div className="inline-block px-6 py-2 rounded-full mb-2"
                     style={{ background: 'linear-gradient(180deg,#fafafa,#d9d9d9)', boxShadow: '0 4px 10px rgba(0,0,0,.18), inset 0 1px 0 #fff' }}>
                  <span className="script text-[26px]" style={{ color: '#3a3a3a' }}>Fridge&nbsp;Chef</span>
                </div>
                <h1 className="text-[26px] leading-tight" style={{ color: INK }}>🧑‍🍳 냉장고 셰프</h1>
                <p className="text-[14px] text-[#6b6452] mt-1">재료만 넣으면 AI가 레시피를 만들어 드려요</p>
                {ai && (
                  <span className="pill mt-2" style={ai.ai
                    ? { background: '#e8fff8', color: '#0b8f73' }
                    : { background: '#fff1e6', color: '#c2632a' }}>
                    {ai.ai ? `✨ AI 연결됨 · ${ai.model}` : '🧪 데모 모드 (API 키 없음 · 규칙 기반 생성)'}
                  </span>
                )}
              </header>

              {/* 재료 입력 + 생성 */}
              <div className="card p-5">
                <label className="text-[15px]" style={{ color: ORANGE }}>🧺 냉장고 속 재료</label>
                <textarea
                  value={input} onChange={(e) => setInput(e.target.value)}
                  placeholder="쉼표로 구분해 입력하세요  (예: 양파, 계란, 대파, 햄)"
                  rows={2} maxLength={400}
                  className="w-full mt-2 p-3 text-[15px] resize-none outline-none"
                  style={{ background: '#fff', border: '2px solid ' + MINT_PALE, borderRadius: 18 }}
                />
                {chips.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {chips.map((c, i) => <span key={i} className="pill" style={{ background: MINT_PALE, color: INK }}>{c}</span>)}
                  </div>
                )}
                <button
                  onClick={generate} disabled={chips.length === 0 || generating}
                  className="btn w-full mt-4 py-3 text-[17px]"
                  style={{ background: MINT, color: INK }}>
                  {generating ? <span><span className="spin">🍳</span> 레시피 만드는 중…</span> : '✨ AI 레시피 생성'}
                </button>
              </div>

              {/* 생성 미리보기 */}
              {preview && (
                <div className="card p-5 mt-5" style={{ border: '3px solid ' + MINT }}>
                  <p className="pill mb-1" style={{ background: ORANGE, color: '#fff' }}>방금 만든 레시피</p>
                  <h2 className="text-[22px] mt-1" style={{ color: INK }}>{preview.title}</h2>
                  <Badges recipe={preview} />
                  <RecipeBody recipe={preview} />
                  <div className="flex gap-2 mt-5">
                    <button onClick={save} disabled={saving} className="btn flex-1 py-3 text-[16px]" style={{ background: MINT, color: INK }}>
                      {saving ? '저장 중…' : '💾 냉장고에 저장'}
                    </button>
                    <button onClick={generate} disabled={generating} className="btn py-3 px-5 text-[16px]" style={{ background: '#fff', color: INK, boxShadow: '0 6px 0 ' + MINT_PALE }}>
                      🔄 다시
                    </button>
                  </div>
                </div>
              )}

              {/* 저장된 레시피 목록 */}
              <div className="mt-7">
                <div className="flex items-center gap-2 mb-3">
                  <h2 className="text-[19px]" style={{ color: INK }}>🧊 저장된 레시피</h2>
                  <span className="pill" style={{ background: '#fff', color: '#6b6452' }}>{recipes.length}</span>
                </div>

                {loading ? (
                  <p className="text-center py-8 text-[#6b6452]">불러오는 중…</p>
                ) : recipes.length === 0 ? (
                  <div className="card p-6 text-center text-[#6b6452]">
                    아직 저장된 레시피가 없어요.<br />위에서 재료를 넣고 레시피를 만들어 보세요! 🥕
                  </div>
                ) : (
                  <div className="space-y-3">
                    {recipes.map((r) => (
                      <div key={r.id} className="card p-4">
                        <div className="flex items-start justify-between gap-2">
                          <button onClick={() => setOpen(open === r.id ? null : r.id)} className="text-left flex-1">
                            <h3 className="text-[18px]" style={{ color: INK }}>{r.title}</h3>
                            <Badges recipe={r} />
                          </button>
                          <button onClick={() => remove(r.id)} className="btn px-3 py-1.5 text-[13px]" style={{ background: '#ffe3e0', color: '#c0392b', boxShadow: '0 4px 0 #f3c4c0' }}>삭제</button>
                        </div>
                        {open === r.id && <div className="mt-1"><RecipeBody recipe={r} /></div>}
                        <div className="flex items-center justify-between mt-3">
                          <span className="text-[12px] text-[#a59e8b]">📅 {fmt(r.created_at)}</span>
                          <button onClick={() => setOpen(open === r.id ? null : r.id)} className="text-[13px]" style={{ color: ORANGE }}>
                            {open === r.id ? '접기 ▲' : '자세히 ▼'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <p className="text-center text-[12px] text-[#a59e8b] mt-7">🍒 Fridge Chef · PostgreSQL 저장 · since 1972</p>
            </div>

            <Stripes />
          </div>
          <Toast msg={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
