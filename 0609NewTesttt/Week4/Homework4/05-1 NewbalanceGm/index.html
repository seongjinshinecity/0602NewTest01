<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BALANCE GAME · 실시간 밸런스 게임</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:      #f1eee6;
      --ink:     #15131a;
      --red:     #ff2e5f;
      --yellow:  #ffc400;
      --blue:    #3a2bff;
      --cyan:    #00c2d6;
      --green:   #11d08a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Gothic A1', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .display { font-family: 'Black Han Sans', 'Gothic A1', sans-serif; letter-spacing: .01em; }

    /* 떠다니는 3D 기하 도형 (포스터 무드) */
    .shape {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: .9;
      animation: float 14s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-26px) rotate(6deg); }
    }
    /* 하프톤 점 텍스처 */
    .halftone {
      background-image: radial-gradient(rgba(0,0,0,.22) 1.4px, transparent 1.5px);
      background-size: 9px 9px;
    }
    /* 3D 블록 (입체 그림자) */
    .block3d { box-shadow: 10px 12px 0 rgba(21,19,26,.9); }
    .block3d-sm { box-shadow: 6px 7px 0 rgba(21,19,26,.85); }

    .bar { transition: width .9s cubic-bezier(.16,1,.3,1); }
    .pop { animation: pop .35s cubic-bezier(.16,1.4,.4,1); }
    @keyframes pop { 0% { transform: scale(.92); } 100% { transform: scale(1); } }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: #15131a; border-radius: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const api = {
      list: () => fetch('/api/questions').then(r => r.json()),
      add:  (optionA, optionB) => fetch('/api/questions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ optionA, optionB }),
      }).then(r => r.json()),
      vote: (id, choice) => fetch(`/api/questions/${id}/vote`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice }),
      }).then(r => r.json()),
      remove: (id) => fetch(`/api/questions/${id}`, { method: 'DELETE' }).then(r => r.json()),
    };

    // 내가 어떤 질문에 어떤 선택을 했는지 브라우저에 기억 (중복 투표 방지 + 결과 강조)
    const VOTED_KEY = 'balance_voted_v1';
    const loadVoted = () => { try { return JSON.parse(localStorage.getItem(VOTED_KEY)) || {}; } catch { return {}; } };
    const saveVoted = (m) => localStorage.setItem(VOTED_KEY, JSON.stringify(m));

    // ----- 배경 3D 도형 -----
    function Shapes() {
      const blocks = [
        { c:'var(--red)',    top:'8%',  left:'4%',  w:90,  h:130, d:'8s',  r:'-8deg' },
        { c:'var(--yellow)', top:'14%', left:'82%', w:120, h:90,  d:'11s', r:'10deg' },
        { c:'var(--blue)',   top:'62%', left:'2%',  w:100, h:110, d:'13s', r:'6deg'  },
        { c:'var(--cyan)',   top:'78%', left:'88%', w:80,  h:120, d:'9s',  r:'-12deg'},
        { c:'var(--green)',  top:'40%', left:'92%', w:70,  h:90,  d:'15s', r:'4deg'  },
      ];
      return blocks.map((b, i) => (
        <div key={i} className="shape halftone" style={{
          top:b.top, left:b.left, width:b.w, height:b.h, background:b.c,
          animationDuration:b.d, transform:`rotate(${b.r})`,
          boxShadow:`12px 14px 0 rgba(21,19,26,.9)`,
        }} />
      ));
    }

    // ----- 질문 등록 폼 -----
    function NewQuestion({ onAdd }) {
      const [a, setA] = useState('');
      const [b, setB] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        if (!a.trim() || !b.trim()) { setErr('두 선택지를 모두 입력해 주세요.'); return; }
        setBusy(true); setErr('');
        const res = await api.add(a.trim(), b.trim());
        setBusy(false);
        if (res.success) { setA(''); setB(''); onAdd(); }
        else setErr(res.message || '등록 실패');
      };

      return (
        <form onSubmit={submit} className="relative z-10 bg-white block3d border-[3px] border-[#15131a] p-5 sm:p-7">
          <div className="display text-xl sm:text-2xl mb-4 flex items-center gap-2">
            <span className="inline-block bg-[#ffc400] text-[#15131a] px-2 border-2 border-[#15131a]">NEW</span>
            <span>밸런스 질문 등록</span>
          </div>
          <div className="grid sm:grid-cols-[1fr_auto_1fr] gap-3 items-center">
            <input value={a} onChange={e=>setA(e.target.value)} maxLength={80}
              placeholder="선택지 A 예) 평생 치킨만"
              className="w-full bg-[#fff0f4] border-[3px] border-[#15131a] px-4 py-3 font-bold outline-none focus:bg-white placeholder:text-[#ff2e5f]/50" />
            <div className="display text-2xl text-center text-[#15131a] select-none">VS</div>
            <input value={b} onChange={e=>setB(e.target.value)} maxLength={80}
              placeholder="선택지 B 예) 평생 피자만"
              className="w-full bg-[#eef0ff] border-[3px] border-[#15131a] px-4 py-3 font-bold outline-none focus:bg-white placeholder:text-[#3a2bff]/50" />
          </div>
          {err && <p className="mt-3 text-[#ff2e5f] font-bold text-sm">⚠ {err}</p>}
          <button disabled={busy}
            className="display mt-4 w-full sm:w-auto bg-[#15131a] text-white text-lg px-8 py-3 block3d-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition active:scale-95 disabled:opacity-50">
            {busy ? '등록 중…' : '＋ 질문 올리기'}
          </button>
        </form>
      );
    }

    // ----- 한쪽 선택지 (투표 전: 버튼 / 투표 후: 결과 바) -----
    function Side({ side, label, percent, votes, color, soft, voted, myChoice, onVote, total }) {
      const isMine = myChoice === side;
      if (!voted) {
        return (
          <button onClick={() => onVote(side)}
            className="group relative overflow-hidden flex-1 border-[3px] border-[#15131a] text-left px-5 py-7 sm:py-9 transition active:scale-[.98] hover:-translate-y-1"
            style={{ background: soft }}>
            <div className="halftone absolute inset-0 opacity-0 group-hover:opacity-100 transition" style={{ background:`${color}`, mixBlendMode:'multiply' }} />
            <div className="relative">
              <div className="display text-xs tracking-widest mb-2" style={{ color }}>{side === 'a' ? 'A' : 'B'}</div>
              <div className="display text-xl sm:text-2xl leading-tight break-keep">{label}</div>
              <div className="mt-3 font-bold text-sm opacity-60">👆 눌러서 투표</div>
            </div>
          </button>
        );
      }
      return (
        <div className="relative flex-1 border-[3px] border-[#15131a] overflow-hidden bg-white">
          {/* 부드러운 색 채움 (퍼센티지) + 우측 굵은 색 경계선 + 은은한 점 텍스처 */}
          <div className="bar absolute inset-y-0 left-0" style={{ width:`${percent}%`, background:`${color}22`, borderRight:`5px solid ${color}` }} />
          <div className="bar absolute inset-y-0 left-0 halftone" style={{ width:`${percent}%`, opacity:.18 }} />
          <div className="relative px-5 py-6">
            <div className="flex items-center gap-2 mb-1">
              <span className="display text-xs tracking-widest" style={{ color }}>{side === 'a' ? 'A' : 'B'}</span>
              {isMine && <span className="text-[10px] font-extrabold bg-[#15131a] text-white px-1.5 py-0.5">MY PICK</span>}
            </div>
            <div className="display text-lg sm:text-xl leading-tight break-keep">{label}</div>
            <div className="mt-2 flex items-end gap-2">
              <span className="display text-3xl sm:text-4xl pop" style={{ color }}>{percent}%</span>
              <span className="font-bold text-sm opacity-60 mb-1">{votes.toLocaleString()}표</span>
            </div>
          </div>
        </div>
      );
    }

    // ----- 질문 카드 -----
    function QuestionCard({ q, voted, myChoice, onVote, onDelete }) {
      const showResult = voted;
      return (
        <div className="relative z-10 bg-white block3d border-[3px] border-[#15131a] p-4 sm:p-5">
          <div className="flex items-center justify-between mb-3">
            <div className="font-bold text-sm opacity-60">
              👥 참여 <span className="display text-base text-[#15131a] opacity-100">{q.total.toLocaleString()}</span> 명
            </div>
            <button onClick={() => onDelete(q.id)} title="삭제"
              className="text-xs font-bold text-[#15131a]/40 hover:text-[#ff2e5f] transition">삭제 ✕</button>
          </div>

          <div className="flex flex-col sm:flex-row items-stretch gap-2 relative">
            <Side side="a" label={q.optionA} percent={q.percentA} votes={q.votesA}
              color="var(--red)" soft="#fff0f4" voted={showResult} myChoice={myChoice}
              onVote={(s)=>onVote(q.id, s)} total={q.total} />
            <div className="display text-lg sm:text-2xl flex items-center justify-center text-white bg-[#15131a] w-12 sm:w-12 mx-auto sm:mx-0 px-0 py-1 sm:py-0 select-none">VS</div>
            <Side side="b" label={q.optionB} percent={q.percentB} votes={q.votesB}
              color="var(--blue)" soft="#eef0ff" voted={showResult} myChoice={myChoice}
              onVote={(s)=>onVote(q.id, s)} total={q.total} />
          </div>

          {showResult && (
            <div className="mt-3 text-center text-xs font-bold opacity-50">
              실시간 집계 중 · 자동 갱신
            </div>
          )}
        </div>
      );
    }

    // ----- 앱 본체 -----
    function App() {
      const [questions, setQuestions] = useState([]);
      const [total, setTotal] = useState(0);
      const [voted, setVoted] = useState(loadVoted());
      const [loading, setLoading] = useState(true);
      const votedRef = useRef(voted);
      votedRef.current = voted;

      const refresh = useCallback(async () => {
        const res = await api.list();
        if (res.success) { setQuestions(res.data); setTotal(res.totalParticipants); }
        setLoading(false);
      }, []);

      // 최초 로드 + 2.5초마다 폴링 (실시간 퍼센티지)
      useEffect(() => {
        refresh();
        const t = setInterval(refresh, 2500);
        return () => clearInterval(t);
      }, [refresh]);

      const handleVote = async (id, choice) => {
        if (votedRef.current[id]) return; // 이미 투표함
        // 낙관적 업데이트
        const next = { ...votedRef.current, [id]: choice };
        setVoted(next); saveVoted(next);
        setQuestions(qs => qs.map(q => q.id === id ? {
          ...q,
          votesA: q.votesA + (choice === 'a' ? 1 : 0),
          votesB: q.votesB + (choice === 'b' ? 1 : 0),
        } : q));
        const res = await api.vote(id, choice);
        if (res.success) refresh();
      };

      const handleDelete = async (id) => {
        if (!confirm('이 질문을 삭제할까요?')) return;
        const res = await api.remove(id);
        if (res.success) {
          const next = { ...votedRef.current }; delete next[id];
          setVoted(next); saveVoted(next);
          refresh();
        }
      };

      return (
        <>
          <Shapes />
          <div className="relative z-10 max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

            {/* 헤더 */}
            <header className="mb-8 sm:mb-12">
              <div className="flex flex-wrap items-end justify-between gap-3">
                <div>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="w-4 h-4 bg-[#ff2e5f] inline-block border-2 border-[#15131a]" />
                    <span className="w-4 h-4 bg-[#ffc400] inline-block border-2 border-[#15131a]" />
                    <span className="w-4 h-4 bg-[#3a2bff] inline-block border-2 border-[#15131a]" />
                    <span className="w-4 h-4 bg-[#11d08a] inline-block border-2 border-[#15131a]" />
                  </div>
                  <h1 className="display text-5xl sm:text-7xl leading-[0.9]">
                    밸런스<br/>게임<span className="text-[#ff2e5f]">.</span>
                  </h1>
                  <p className="mt-2 font-bold text-sm opacity-60">REAL-TIME BALANCE GAME · 둘 중 하나만 골라!</p>
                </div>
                <div className="bg-[#15131a] text-white block3d-sm border-[3px] border-[#15131a] px-5 py-3 text-center">
                  <div className="text-[10px] font-bold tracking-widest opacity-70">총 참여자</div>
                  <div className="display text-3xl sm:text-4xl leading-none mt-1 text-[#ffc400]">{total.toLocaleString()}</div>
                </div>
              </div>
            </header>

            {/* 등록 폼 */}
            <div className="mb-8"><NewQuestion onAdd={refresh} /></div>

            {/* 질문 목록 */}
            <div className="space-y-5">
              {loading ? (
                <div className="text-center py-16 font-bold opacity-50">불러오는 중…</div>
              ) : questions.length === 0 ? (
                <div className="bg-white border-[3px] border-dashed border-[#15131a]/40 p-12 text-center">
                  <div className="display text-2xl mb-2">아직 질문이 없어요</div>
                  <p className="font-bold opacity-60">위에서 첫 번째 밸런스 질문을 만들어 보세요!</p>
                </div>
              ) : (
                questions.map(q => (
                  <QuestionCard key={q.id} q={q}
                    voted={!!voted[q.id]} myChoice={voted[q.id]}
                    onVote={handleVote} onDelete={handleDelete} />
                ))
              )}
            </div>

            <footer className="mt-14 text-center text-xs font-bold opacity-40">
              데이터는 PostgreSQL(Supabase)에 저장됩니다 · 2.5초마다 실시간 갱신
            </footer>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
