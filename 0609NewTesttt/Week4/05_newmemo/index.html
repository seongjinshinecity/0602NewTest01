<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메모장 · PostgreSQL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API = '/api/memos';

    function fmt(iso) {
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // ---------- 작성 폼 ----------
    function Composer({ onCreate }) {
      const [content, setContent] = useState('');
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        const text = content.trim();
        if (!text || busy) return;
        setBusy(true);
        try {
          await onCreate(text);
          setContent('');
        } finally {
          setBusy(false);
        }
      };

      return (
        <form onSubmit={submit} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
          <textarea
            value={content}
            onChange={(e) => setContent(e.target.value)}
            onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submit(e); }}
            placeholder="새 메모를 입력하세요…  (⌘/Ctrl + Enter 로 저장)"
            rows={3}
            maxLength={1000}
            className="w-full resize-none outline-none text-slate-800 placeholder-slate-400 text-[15px] leading-relaxed"
          />
          <div className="flex items-center justify-between mt-2">
            <span className="text-xs text-slate-400">{content.length}/1000</span>
            <button
              type="submit"
              disabled={!content.trim() || busy}
              className="px-4 py-1.5 rounded-lg bg-slate-900 text-white text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-700 transition"
            >
              {busy ? '저장 중…' : '저장'}
            </button>
          </div>
        </form>
      );
    }

    // ---------- 메모 카드 (조회 / 수정 / 삭제) ----------
    function MemoCard({ memo, onUpdate, onDelete }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(memo.content);
      const [busy, setBusy] = useState(false);
      const taRef = useRef(null);

      useEffect(() => {
        if (editing && taRef.current) {
          taRef.current.focus();
          taRef.current.setSelectionRange(draft.length, draft.length);
        }
      }, [editing]);

      const save = async () => {
        const text = draft.trim();
        if (!text || busy) return;
        setBusy(true);
        try {
          await onUpdate(memo.id, text);
          setEditing(false);
        } finally {
          setBusy(false);
        }
      };

      const cancel = () => { setDraft(memo.content); setEditing(false); };

      const remove = async () => {
        if (!window.confirm('이 메모를 삭제할까요?')) return;
        setBusy(true);
        try { await onDelete(memo.id); } finally { setBusy(false); }
      };

      const edited = memo.updated_at !== memo.created_at;

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 group">
          {editing ? (
            <>
              <textarea
                ref={taRef}
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => {
                  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') save();
                  if (e.key === 'Escape') cancel();
                }}
                rows={3}
                maxLength={1000}
                className="w-full resize-none outline-none text-slate-800 text-[15px] leading-relaxed border border-slate-200 rounded-lg p-2"
              />
              <div className="flex items-center justify-end gap-2 mt-2">
                <button onClick={cancel} className="px-3 py-1 rounded-lg text-sm text-slate-500 hover:bg-slate-100 transition">취소</button>
                <button onClick={save} disabled={!draft.trim() || busy}
                  className="px-3 py-1 rounded-lg bg-slate-900 text-white text-sm font-medium disabled:opacity-40 hover:bg-slate-700 transition">
                  {busy ? '저장 중…' : '저장'}
                </button>
              </div>
            </>
          ) : (
            <>
              <p className="text-slate-800 text-[15px] leading-relaxed whitespace-pre-wrap break-words">{memo.content}</p>
              <div className="flex items-center justify-between mt-3">
                <span className="text-xs text-slate-400">
                  {fmt(memo.created_at)}{edited && ' · 수정됨'}
                </span>
                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition">
                  <button onClick={() => { setDraft(memo.content); setEditing(true); }}
                    className="px-2.5 py-1 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition">수정</button>
                  <button onClick={remove} disabled={busy}
                    className="px-2.5 py-1 rounded-lg text-xs text-red-500 hover:bg-red-50 transition">삭제</button>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ---------- 앱 ----------
    function App() {
      const [memos, setMemos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const load = async () => {
        try {
          const res = await fetch(API);
          const json = await res.json();
          if (!json.success) throw new Error(json.message);
          setMemos(json.data);
          setError('');
        } catch (e) {
          setError('메모를 불러오지 못했습니다. 서버가 켜져 있는지 확인하세요.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { load(); }, []);

      const handle = async (fn, fallbackMsg) => {
        try {
          const res = await fn();
          const json = await res.json();
          if (!json.success) throw new Error(json.message || fallbackMsg);
          return json;
        } catch (e) {
          alert(e.message || fallbackMsg);
          throw e;
        }
      };

      const create = async (content) => {
        const json = await handle(
          () => fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) }),
          '저장에 실패했습니다.'
        );
        setMemos((prev) => [json.data, ...prev]);
      };

      const update = async (id, content) => {
        const json = await handle(
          () => fetch(`${API}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) }),
          '수정에 실패했습니다.'
        );
        setMemos((prev) => {
          const next = prev.map((m) => (m.id === id ? json.data : m));
          next.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at) || b.id - a.id);
          return next;
        });
      };

      const remove = async (id) => {
        await handle(
          () => fetch(`${API}/${id}`, { method: 'DELETE' }),
          '삭제에 실패했습니다.'
        );
        setMemos((prev) => prev.filter((m) => m.id !== id));
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-10">
          <header className="mb-6">
            <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
              <span>📝</span> 메모장
            </h1>
            <p className="text-sm text-slate-500 mt-1">
              PostgreSQL에 저장되어 앱을 껐다 켜도 메모가 유지됩니다.
            </p>
          </header>

          <Composer onCreate={create} />

          <div className="mt-6 space-y-3">
            {loading ? (
              <p className="text-center text-slate-400 py-10">불러오는 중…</p>
            ) : error ? (
              <p className="text-center text-red-500 py-10">{error}</p>
            ) : memos.length === 0 ? (
              <p className="text-center text-slate-400 py-10">아직 메모가 없습니다. 첫 메모를 작성해 보세요!</p>
            ) : (
              memos.map((m) => (
                <MemoCard key={m.id} memo={m} onUpdate={update} onDelete={remove} />
              ))
            )}
          </div>

          {!loading && !error && memos.length > 0 && (
            <p className="text-center text-xs text-slate-400 mt-6">총 {memos.length}개의 메모</p>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
