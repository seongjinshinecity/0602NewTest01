<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 전국도감</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.35s ease-out both; }
    @keyframes pop { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: pop 0.3s ease-out both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin 1s linear infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .animate-blink { animation: blink 1.6s ease-in-out infinite; }
    .lcd-scanlines {
      background-image: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0) 4px
      );
    }
    .thin-scroll::-webkit-scrollbar { width: 7px; height: 7px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-zinc-900">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useMemo, useEffect } = React;

    // ========================================
    // ⚙️ Config — PokeAPI
    // ========================================
    const API = 'https://pokeapi.co/api/v2';
    const DEX_COUNT = 1025;            // 전국도감 총 마리 수
    const INDEX_KEY = 'pokedex-kr-index-v2'; // localStorage 캐시 키
    const LIST_CONCURRENCY = 24;       // 한글 이름 동시 요청 수

    const ARTWORK = (id) =>
      `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    const dexNo = (id) => '#' + String(id).padStart(4, '0');

    const STAT_KO = {
      'hp': 'HP', 'attack': '공격', 'defense': '방어',
      'special-attack': '특수공격', 'special-defense': '특수방어', 'speed': '스피드',
    };

    const ALL_TYPES = ['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
    const TYPE_BADGE = {
      normal:'bg-slate-100 text-slate-700', fire:'bg-orange-100 text-orange-700',
      water:'bg-sky-100 text-sky-700', electric:'bg-yellow-100 text-yellow-700',
      grass:'bg-green-100 text-green-700', ice:'bg-cyan-100 text-cyan-700',
      fighting:'bg-red-100 text-red-700', poison:'bg-purple-100 text-purple-700',
      ground:'bg-amber-100 text-amber-700', flying:'bg-indigo-100 text-indigo-700',
      psychic:'bg-pink-100 text-pink-700', bug:'bg-lime-100 text-lime-700',
      rock:'bg-stone-200 text-stone-700', ghost:'bg-violet-100 text-violet-700',
      dragon:'bg-indigo-200 text-indigo-800', dark:'bg-neutral-200 text-neutral-700',
      steel:'bg-zinc-200 text-zinc-700', fairy:'bg-rose-100 text-rose-700',
    };
    const TYPE_GRADIENT = {
      normal:'from-slate-400 to-slate-500', fire:'from-orange-400 to-red-500',
      water:'from-sky-400 to-blue-500', electric:'from-yellow-300 to-amber-400',
      grass:'from-green-400 to-emerald-500', ice:'from-cyan-300 to-sky-400',
      fighting:'from-red-400 to-rose-600', poison:'from-purple-400 to-fuchsia-500',
      ground:'from-amber-400 to-yellow-600', flying:'from-indigo-300 to-sky-400',
      psychic:'from-pink-400 to-rose-500', bug:'from-lime-400 to-green-500',
      rock:'from-stone-400 to-stone-600', ghost:'from-violet-400 to-purple-600',
      dragon:'from-indigo-400 to-violet-600', dark:'from-neutral-600 to-neutral-800',
      steel:'from-zinc-300 to-slate-500', fairy:'from-rose-300 to-pink-500',
    };
    // 종족 색상(species.color) → 목록 썸네일 배경
    const COLOR_GRADIENT = {
      black:'from-gray-600 to-gray-800', blue:'from-sky-400 to-blue-500',
      brown:'from-amber-500 to-yellow-700', gray:'from-slate-400 to-slate-500',
      green:'from-green-400 to-emerald-500', pink:'from-pink-300 to-rose-400',
      purple:'from-purple-400 to-fuchsia-500', red:'from-orange-400 to-red-500',
      white:'from-slate-200 to-slate-400', yellow:'from-yellow-300 to-amber-400',
    };

    // ========================================
    // 📡 API Layer
    // ========================================
    const cache = new Map();
    function getJSON(url) {
      if (cache.has(url)) return cache.get(url);
      const p = fetch(url).then((r) => {
        if (!r.ok) throw new Error(`요청 실패: ${url}`);
        return r.json();
      });
      cache.set(url, p);
      return p;
    }

    const idFromUrl = (url) => parseInt(url.replace(/\/$/, '').split('/').pop(), 10);
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const koName = (names, fallback) => {
      const ko = names.find((n) => n.language.name === 'ko');
      return ko ? ko.name : fallback;
    };

    // 동시 실행 풀: items 를 worker 로 처리, 동시 concurrency 개, 진행 콜백
    async function pool(items, worker, concurrency, onProgress) {
      const results = new Array(items.length);
      let next = 0, done = 0;
      async function run() {
        while (next < items.length) {
          const idx = next++;
          try { results[idx] = await worker(items[idx], idx); }
          catch (e) { results[idx] = null; }
          done++;
          if (onProgress) onProgress(done, items.length);
        }
      }
      const runners = Array.from({ length: Math.min(concurrency, items.length) }, run);
      await Promise.all(runners);
      return results;
    }

    // 전국도감 인덱스(가벼운 목록): id, 한글이름, 영문slug, 종족색상
    async function buildIndex(onProgress) {
      const ids = Array.from({ length: DEX_COUNT }, (_, k) => k + 1);
      const entries = await pool(ids, async (id) => {
        const sp = await getJSON(`${API}/pokemon-species/${id}`);
        return {
          id,
          ko: koName(sp.names, sp.name),
          en: sp.name,
          color: (sp.color && sp.color.name) || 'gray',
        };
      }, LIST_CONCURRENCY, onProgress);
      return entries.filter(Boolean);
    }

    // ---- 상세 정보 로딩 (선택 시에만) ----
    async function loadType(name) {
      const t = await getJSON(`${API}/type/${name}`);
      const dr = t.damage_relations;
      return {
        ko: koName(t.names, name),
        doubleFrom: dr.double_damage_from.map((x) => x.name),
        halfFrom: dr.half_damage_from.map((x) => x.name),
        noFrom: dr.no_damage_from.map((x) => x.name),
      };
    }

    async function computeWeaknesses(defTypeNames) {
      const defs = await Promise.all(defTypeNames.map(loadType));
      const result = [];
      for (const atk of ALL_TYPES) {
        let mult = 1;
        for (const d of defs) {
          if (d.doubleFrom.includes(atk)) mult *= 2;
          else if (d.halfFrom.includes(atk)) mult *= 0.5;
          else if (d.noFrom.includes(atk)) mult *= 0;
        }
        if (mult > 1) {
          const tk = await loadType(atk);
          result.push({ name: tk.ko, key: atk });
        }
      }
      return result;
    }

    async function loadAbilityKo(name) {
      const a = await getJSON(`${API}/ability/${name}`);
      return koName(a.names, name);
    }

    async function evoCondition(details) {
      if (!details || !details.length) return '';
      const d = details[0];
      if (d.min_level) return `Lv.${d.min_level}`;
      if (d.item) {
        const item = await getJSON(d.item.url);
        return koName(item.names, d.item.name);
      }
      if (d.min_happiness) return '친밀도';
      if (d.trigger && d.trigger.name === 'trade') return '교환';
      return '진화';
    }

    async function parseEvolution(chainUrl) {
      const data = await getJSON(chainUrl);
      const stages = [];
      let node = data.chain;
      let details = null;
      while (node) {
        const id = idFromUrl(node.species.url);
        const sp = await getJSON(`${API}/pokemon-species/${id}`);
        stages.push({ id, name: koName(sp.names, node.species.name), condition: await evoCondition(details) });
        if (node.evolves_to && node.evolves_to.length) {
          details = node.evolves_to[0].evolution_details;
          node = node.evolves_to[0];
        } else node = null;
      }
      return stages;
    }

    async function loadPokemon(id) {
      const [p, sp] = await Promise.all([
        getJSON(`${API}/pokemon/${id}`),
        getJSON(`${API}/pokemon-species/${id}`),
      ]);
      const typeNames = [...p.types].sort((a, b) => a.slot - b.slot).map((t) => t.type.name);
      const types = await Promise.all(typeNames.map(async (n) => {
        const tk = await loadType(n);
        return { name: tk.ko, key: n };
      }));
      const abilities = await Promise.all(p.abilities.map((a) => loadAbilityKo(a.ability.name)));
      const weaknesses = await computeWeaknesses(typeNames);
      const stats = {};
      p.stats.forEach((s) => { const k = STAT_KO[s.stat.name]; if (k) stats[k] = s.base_stat; });
      const evolution = await parseEvolution(sp.evolution_chain.url);
      const flavorEntry = sp.flavor_text_entries.find((f) => f.language.name === 'ko')
        || sp.flavor_text_entries.find((f) => f.language.name === 'en') || {};
      const genusEntry = sp.genera.find((g) => g.language.name === 'ko')
        || sp.genera.find((g) => g.language.name === 'en') || {};
      return {
        id,
        name: koName(sp.names, p.name),
        enName: cap(p.name),
        dexNo: dexNo(id),
        types,
        color: TYPE_GRADIENT[typeNames[0]] || 'from-slate-400 to-slate-500',
        height: (p.height / 10) + 'm',
        weight: (p.weight / 10) + 'kg',
        category: genusEntry.genus || '',
        description: (flavorEntry.flavor_text || '').replace(/[\n\f\r­]/g, ' ').replace(/\s+/g, ' ').trim(),
        abilities, weaknesses, stats, evolution,
      };
    }

    // ========================================
    // 🎨 작은 표현용 컴포넌트
    // ========================================
    function TypeBadge({ label, typeKey, className = '' }) {
      const style = TYPE_BADGE[typeKey] || 'bg-slate-100 text-slate-700';
      return <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-bold ${style} ${className}`}>{label}</span>;
    }

    function Lens() {
      return (
        <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-white p-1 shadow-md shrink-0">
          <div className="w-full h-full rounded-full bg-gradient-to-br from-sky-300 to-blue-600 relative overflow-hidden ring-2 ring-blue-900/30">
            <div className="absolute top-1.5 left-2 w-3 h-3 rounded-full bg-white/70 blur-[1px]" />
            <div className="absolute inset-2 rounded-full border border-white/20" />
          </div>
        </div>
      );
    }

    function Leds() {
      return (
        <div className="flex gap-1.5">
          <span className="w-3.5 h-3.5 rounded-full bg-red-500 shadow-inner ring-1 ring-red-900/30" />
          <span className="w-3.5 h-3.5 rounded-full bg-yellow-400 shadow-inner ring-1 ring-yellow-700/30" />
          <span className="w-3.5 h-3.5 rounded-full bg-green-500 shadow-inner ring-1 ring-green-900/30" />
        </div>
      );
    }

    function StatChart({ stats }) {
      const MAX = 150;
      const COLORS = {
        'HP': 'bg-rose-500', '공격': 'bg-orange-500', '방어': 'bg-amber-500',
        '특수공격': 'bg-sky-500', '특수방어': 'bg-emerald-500', '스피드': 'bg-fuchsia-500',
      };
      const entries = Object.entries(stats);
      const total = entries.reduce((sum, [, v]) => sum + v, 0);
      return (
        <div className="space-y-2">
          {entries.map(([label, value]) => (
            <div key={label} className="flex items-center gap-2">
              <span className="w-14 shrink-0 text-[11px] font-semibold text-emerald-900/70 text-right">{label}</span>
              <span className="w-7 shrink-0 text-[11px] font-bold text-emerald-950 text-right">{value}</span>
              <div className="flex-1 h-2.5 bg-emerald-900/10 rounded-full overflow-hidden">
                <div className={`h-full rounded-full ${COLORS[label] || 'bg-slate-400'} transition-all duration-500`}
                     style={{ width: `${Math.min(100, (value / MAX) * 100)}%` }} />
              </div>
            </div>
          ))}
          <div className="flex items-center gap-2 pt-1 border-t border-emerald-900/15">
            <span className="w-14 shrink-0 text-[11px] font-bold text-emerald-900/80 text-right">총합</span>
            <span className="w-7 shrink-0 text-[11px] font-extrabold text-emerald-950 text-right">{total}</span>
          </div>
        </div>
      );
    }

    function EvolutionChain({ chain, currentId, onPick }) {
      return (
        <div className="flex items-center justify-center flex-wrap gap-1">
          {chain.map((stage, i) => (
            <React.Fragment key={stage.id}>
              {i > 0 && (
                <div className="flex flex-col items-center text-emerald-900/50 px-0.5">
                  <span className="text-base leading-none">→</span>
                  {stage.condition && <span className="text-[9px] whitespace-nowrap">{stage.condition}</span>}
                </div>
              )}
              <button onClick={() => onPick && onPick(stage.id)}
                className={`flex flex-col items-center p-1 rounded-lg transition ${stage.id === currentId ? 'bg-emerald-900/10 ring-2 ring-emerald-600' : 'hover:bg-emerald-900/5'}`}>
                <img src={ARTWORK(stage.id)} alt={stage.name} loading="lazy" className="w-12 h-12 object-contain" />
                <span className={`text-[11px] font-semibold ${stage.id === currentId ? 'text-emerald-700' : 'text-emerald-900/70'}`}>{stage.name}</span>
              </button>
            </React.Fragment>
          ))}
        </div>
      );
    }

    function Info({ label, value, span }) {
      return (
        <div className={span ? 'col-span-2' : ''}>
          <span className="text-emerald-900/50">{label} </span>
          <span className="font-semibold">{value}</span>
        </div>
      );
    }

    // ========================================
    // 📋 좌측 목록 (전국도감)
    // ========================================
    function ListItem({ entry, active, onClick }) {
      const grad = COLOR_GRADIENT[entry.color] || 'from-slate-400 to-slate-500';
      return (
        <button
          onClick={onClick}
          aria-pressed={active}
          className={`w-full flex items-center gap-2.5 p-1.5 rounded-xl transition text-left
            ${active ? 'bg-slate-700 ring-2 ring-rose-400' : 'hover:bg-slate-700/60 ring-2 ring-transparent'}`}
        >
          <div className={`w-10 h-10 rounded-lg bg-gradient-to-br ${grad} flex items-center justify-center shrink-0 shadow-inner`}>
            <img src={ARTWORK(entry.id)} alt={entry.ko} loading="lazy" className="w-8 h-8 object-contain drop-shadow" />
          </div>
          <span className={`text-sm font-semibold flex-1 truncate ${active ? 'text-white' : 'text-slate-200'}`}>{entry.ko}</span>
          <span className="text-[10px] text-slate-500 shrink-0">{dexNo(entry.id)}</span>
        </button>
      );
    }

    function SidePanel({ entries, total, query, setQuery, selectedId, onSelect }) {
      return (
        <aside className="bg-slate-800 lg:w-72 w-full p-4 flex flex-col gap-3 shrink-0">
          <div className="flex items-center gap-2 px-1">
            <span className="w-3 h-3 rounded-full bg-rose-500 animate-blink" />
            <h1 className="text-white font-extrabold tracking-wide">전국도감</h1>
            <span className="ml-auto text-[11px] text-slate-400">{total}마리</span>
          </div>
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="이름·번호 검색"
              aria-label="포켓몬 검색"
              className="w-full pl-9 pr-8 py-2 rounded-full bg-slate-900 text-slate-100 text-sm placeholder-slate-500 border border-slate-700 focus:border-rose-400 outline-none" />
            {query && <button onClick={() => setQuery('')} aria-label="지우기"
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-sm">✕</button>}
          </div>
          {entries.length === 0 ? (
            <p className="text-slate-500 text-sm px-1 py-4 text-center">검색 결과 없음</p>
          ) : (
            <div className="thin-scroll flex flex-col gap-1.5 overflow-y-auto max-h-[42vh] lg:max-h-[520px] pr-1">
              {entries.map((e) => (
                <ListItem key={e.id} entry={e} active={e.id === selectedId} onClick={() => onSelect(e.id)} />
              ))}
            </div>
          )}
          <p className="text-[10px] text-slate-500 px-1 mt-auto hidden lg:block">데이터: PokeAPI (pokeapi.co)</p>
        </aside>
      );
    }

    // ========================================
    // 🖥 LCD 화면
    // ========================================
    function DexScreen({ pokemon, onPick }) {
      const [tab, setTab] = useState('정보');
      const tabs = ['정보', '능력치', '진화'];
      return (
        <div className="lcd-scanlines bg-[#e9f0d4] rounded-xl h-full flex flex-col overflow-hidden text-emerald-950">
          <div className="flex items-end justify-between px-4 pt-3">
            <div>
              <span className="text-[11px] font-bold text-emerald-900/60">{pokemon.dexNo}</span>
              <h2 className="text-xl font-extrabold leading-tight">{pokemon.name}</h2>
              <p className="text-[11px] text-emerald-900/60">{pokemon.enName} · {pokemon.category}</p>
            </div>
            <div className="flex gap-1 pb-1">
              {pokemon.types.map((t) => <TypeBadge key={t.key} label={t.name} typeKey={t.key} />)}
            </div>
          </div>
          <div className={`mx-4 mt-2 rounded-lg bg-gradient-to-br ${pokemon.color} flex items-center justify-center py-3`}>
            <img key={pokemon.id} src={ARTWORK(pokemon.id)} alt={pokemon.name} className="w-32 h-32 object-contain drop-shadow-lg animate-pop" />
          </div>
          <div className="flex gap-1 px-4 mt-3">
            {tabs.map((t) => (
              <button key={t} onClick={() => setTab(t)}
                className={`flex-1 text-xs font-bold py-1.5 rounded-t-lg transition ${tab === t ? 'bg-emerald-900/10 text-emerald-900' : 'text-emerald-900/40 hover:text-emerald-900/70'}`}>{t}</button>
            ))}
          </div>
          <div className="thin-scroll flex-1 overflow-y-auto px-4 py-3 bg-emerald-900/5">
            {tab === '정보' && (
              <div className="space-y-3 animate-fade-in">
                <p className="text-[13px] leading-relaxed">{pokemon.description}</p>
                <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-[12px]">
                  <Info label="키" value={pokemon.height} />
                  <Info label="몸무게" value={pokemon.weight} />
                  <Info label="특성" value={pokemon.abilities.join(', ')} span />
                </div>
                <div>
                  <p className="text-[11px] font-bold text-emerald-900/60 mb-1">⚠️ 약점</p>
                  <div className="flex flex-wrap gap-1">
                    {pokemon.weaknesses.length
                      ? pokemon.weaknesses.map((w) => <TypeBadge key={w.key} label={w.name} typeKey={w.key} />)
                      : <span className="text-[12px] text-emerald-900/50">없음</span>}
                  </div>
                </div>
              </div>
            )}
            {tab === '능력치' && <div className="animate-fade-in"><StatChart stats={pokemon.stats} /></div>}
            {tab === '진화' && (
              <div className="animate-fade-in">
                {pokemon.evolution.length > 1
                  ? <EvolutionChain chain={pokemon.evolution} currentId={pokemon.id} onPick={onPick} />
                  : <p className="text-[13px] text-emerald-900/60 text-center py-4">진화하지 않는 포켓몬입니다.</p>}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 상세 로딩 중 화면
    function LoadingScreen({ entry }) {
      return (
        <div className="lcd-scanlines bg-[#e9f0d4] rounded-xl h-full flex flex-col items-center justify-center text-emerald-950 gap-3">
          {entry && <img src={ARTWORK(entry.id)} alt={entry.ko} className="w-28 h-28 object-contain opacity-50 animate-pop" />}
          <div className="w-8 h-8 rounded-full border-4 border-emerald-900/20 border-t-emerald-700 animate-spin-slow" />
          <p className="text-sm font-semibold">{entry ? `${entry.ko} 정보 불러오는 중...` : '불러오는 중...'}</p>
        </div>
      );
    }

    // ========================================
    // 🔴 포켓덱스 본체
    // ========================================
    function Pokedex({ detail, entry, loading, onPick }) {
      return (
        <div className="flex-1 bg-gradient-to-br from-red-500 to-red-700 p-4 sm:p-6 flex flex-col">
          <div className="flex items-center gap-4 mb-3">
            <Lens /><Leds />
          </div>
          <div className="bg-slate-200 rounded-2xl p-2 shadow-lg flex-1 flex flex-col">
            <div className="flex items-center gap-2 px-2 pb-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-red-600" />
              <span className="w-2.5 h-2.5 rounded-full bg-red-600" />
              <span className="ml-auto text-[10px] font-bold text-slate-500 tracking-widest">POKéDEX</span>
            </div>
            <div className="flex-1 min-h-[420px]">
              {detail && !loading
                ? <DexScreen key={detail.id} pokemon={detail} onPick={onPick} />
                : <LoadingScreen entry={entry} />}
            </div>
          </div>
          <div className="flex items-center justify-between mt-4 px-1">
            <div className="flex items-center gap-3">
              <div className="w-16 h-9 rounded-md bg-green-500 shadow-inner ring-2 ring-green-700/30" />
              <div className="flex gap-1.5">
                <span className="w-7 h-2.5 rounded-full bg-red-800/60" />
                <span className="w-7 h-2.5 rounded-full bg-sky-700/60" />
              </div>
            </div>
            <div className="relative w-12 h-12" aria-hidden="true">
              <div className="absolute left-1/2 top-0 -translate-x-1/2 w-4 h-12 bg-slate-900 rounded-sm" />
              <div className="absolute top-1/2 left-0 -translate-y-1/2 h-4 w-12 bg-slate-900 rounded-sm" />
            </div>
          </div>
        </div>
      );
    }

    // 인덱스 로딩 진행 화면
    function IndexLoading({ done, total }) {
      const pct = total ? Math.round((done / total) * 100) : 0;
      return (
        <div className="flex-1 flex flex-col items-center justify-center bg-slate-800 p-10 gap-4">
          <div className="w-12 h-12 rounded-full border-4 border-slate-700 border-t-rose-500 animate-spin-slow" />
          <p className="text-slate-200 font-semibold">전국도감을 불러오는 중...</p>
          <div className="w-full max-w-sm h-3 bg-slate-700 rounded-full overflow-hidden">
            <div className="h-full bg-rose-500 transition-all duration-200" style={{ width: `${pct}%` }} />
          </div>
          <p className="text-slate-400 text-sm">{done} / {total} ({pct}%)</p>
          <p className="text-slate-500 text-[11px] text-center">첫 로딩만 시간이 걸리며, 이후에는 캐시되어 빠르게 열립니다.</p>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [index, setIndex] = useState([]);
      const [progress, setProgress] = useState({ done: 0, total: DEX_COUNT });
      const [indexLoading, setIndexLoading] = useState(true);
      const [error, setError] = useState(null);
      const [query, setQuery] = useState('');
      const [selectedId, setSelectedId] = useState(null);

      const [detail, setDetail] = useState(null);
      const [detailLoading, setDetailLoading] = useState(false);

      // 1) 전국도감 인덱스 로딩 (캐시 우선)
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const cached = localStorage.getItem(INDEX_KEY);
            if (cached) {
              const parsed = JSON.parse(cached);
              if (Array.isArray(parsed) && parsed.length > 0) {
                if (!cancelled) { setIndex(parsed); setSelectedId(parsed[0].id); setIndexLoading(false); }
                return;
              }
            }
            const entries = await buildIndex((done, total) => {
              if (!cancelled) setProgress({ done, total });
            });
            if (cancelled) return;
            try { localStorage.setItem(INDEX_KEY, JSON.stringify(entries)); } catch (e) {}
            setIndex(entries);
            setSelectedId(entries[0] ? entries[0].id : null);
          } catch (e) {
            if (!cancelled) setError(e.message || '도감을 불러오지 못했습니다.');
          } finally {
            if (!cancelled) setIndexLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      // 2) 선택된 포켓몬 상세 로딩 (lazy)
      useEffect(() => {
        if (selectedId == null) return;
        let cancelled = false;
        setDetailLoading(true);
        loadPokemon(selectedId)
          .then((d) => { if (!cancelled) setDetail(d); })
          .catch(() => { if (!cancelled) setDetail(null); })
          .finally(() => { if (!cancelled) setDetailLoading(false); });
        return () => { cancelled = true; };
      }, [selectedId]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return index;
        return index.filter((e) =>
          e.ko.toLowerCase().includes(q) ||
          e.en.toLowerCase().includes(q) ||
          String(e.id).includes(q) ||
          dexNo(e.id).toLowerCase().includes(q)
        );
      }, [query, index]);

      const selectedEntry = index.find((e) => e.id === selectedId) || null;
      const detailMatches = detail && detail.id === selectedId;

      return (
        <div className="min-h-screen w-full flex items-center justify-center p-3 sm:p-6">
          <div className="w-full max-w-5xl rounded-3xl overflow-hidden shadow-2xl flex flex-col lg:flex-row bg-slate-800 ring-4 ring-red-900/40">
            {indexLoading ? (
              <IndexLoading done={progress.done} total={progress.total} />
            ) : error ? (
              <div className="flex-1 text-center py-24 bg-slate-800 px-6">
                <span className="text-5xl">⚠️</span>
                <p className="text-slate-200 mt-4 font-semibold">도감을 불러오지 못했습니다.</p>
                <p className="text-slate-400 text-sm mt-1">{error}</p>
              </div>
            ) : (
              <>
                <SidePanel
                  entries={filtered}
                  total={index.length}
                  query={query}
                  setQuery={setQuery}
                  selectedId={selectedId}
                  onSelect={setSelectedId}
                />
                <Pokedex
                  detail={detailMatches ? detail : null}
                  entry={selectedEntry}
                  loading={detailLoading || !detailMatches}
                  onPick={setSelectedId}
                />
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
