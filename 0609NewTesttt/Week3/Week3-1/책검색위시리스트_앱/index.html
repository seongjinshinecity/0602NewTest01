<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>책 검색 & 독서 위시리스트</title>
<style>
  :root{ --accent:#7c3aed; --accent2:#a855f7; --text:#1e1b2e; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f5f3ff; --card:#fff; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg); color:var(--text); padding:28px 16px;}
  .wrap{max-width:1000px; margin:0 auto;}
  header h1{font-size:26px; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  header p{color:var(--muted); margin:0 0 22px; font-size:14px;}
  form{display:flex; gap:8px; margin-bottom:8px;}
  input[type=text]{flex:1; padding:13px 15px; border:1.5px solid var(--line);
    border-radius:12px; font-size:15px; outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  button{border:none; cursor:pointer; font-weight:600; border-radius:12px;
    background:var(--accent); color:#fff; padding:13px 20px; font-size:15px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .layout{display:grid; grid-template-columns:1fr 340px; gap:24px; margin-top:18px;}
  @media(max-width:780px){ .layout{grid-template-columns:1fr;} }
  h2{font-size:16px; margin:0 0 12px; display:flex; align-items:center; gap:6px;}
  .count{color:var(--muted); font-weight:400; font-size:13px;}
  .state{color:var(--muted); font-size:14px; padding:20px 0; text-align:center;}
  .spinner{display:inline-block; width:24px; height:24px; border:3px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .results{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .book{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px; display:flex; flex-direction:column; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .cover{width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:8px; background:#ede9fe;}
  .nocover{display:flex; align-items:center; justify-content:center; font-size:32px; color:#c4b5fd;}
  .title{font-size:14px; font-weight:700; margin:8px 0 2px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .author{font-size:12px; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .year{font-size:11px; color:#9ca3af; margin-top:2px;}
  .addbtn{margin-top:10px; font-size:13px; padding:8px; width:100%;}
  .addbtn.added{background:#ede9fe; color:var(--accent); cursor:default;}
  aside{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; align-self:start; position:sticky; top:20px;}
  .wl{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .wl:last-child{border-bottom:none;}
  .wl img,.wl .wlnocover{width:42px; height:60px; border-radius:6px; object-fit:cover;
    flex-shrink:0; background:#ede9fe;}
  .wlnocover{display:flex; align-items:center; justify-content:center; color:#c4b5fd;}
  .wlinfo{flex:1; min-width:0;}
  .wltitle{font-size:13px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .wlauthor{font-size:11px; color:var(--muted); margin-top:2px;}
  .wlactions{display:flex; gap:8px; margin-top:4px; align-items:center;}
  .done-toggle{font-size:11px; color:var(--accent); cursor:pointer; user-select:none;}
  .del{background:none; color:#ef4444; padding:0; font-size:12px; font-weight:600;}
  .wl.done .wltitle{text-decoration:line-through; color:var(--muted);}
  .wl.done img,.wl.done .wlnocover{opacity:.5;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 책 검색 & 독서 위시리스트</h1>
    <p>Google Books에서 책을 찾아 "읽고 싶어요" 목록에 담아 두세요 (브라우저에 자동 저장)</p>
  </header>

  <form id="searchForm">
    <input id="q" type="text" placeholder="제목이나 저자로 검색 (예: 파친코)" autocomplete="off" />
    <button type="submit">검색</button>
  </form>

  <div class="layout">
    <section>
      <h2>🔍 검색 결과 <span class="count" id="resCount"></span></h2>
      <div class="state" id="state">검색어를 입력해 보세요.</div>
      <div class="results" id="results"></div>
    </section>

    <aside>
      <h2>⭐ 읽고 싶어요 <span class="count" id="wlCount"></span></h2>
      <div id="wishlist"></div>
    </aside>
  </div>
</div>

<script>
const API = "https://www.googleapis.com/books/v1/volumes";
const WL_KEY = "book_wishlist_v1";
const $ = (id)=>document.getElementById(id);
const resultsEl=$("results"), stateEl=$("state");

let wishlist = JSON.parse(localStorage.getItem(WL_KEY) || "[]");
const saveWL = ()=> localStorage.setItem(WL_KEY, JSON.stringify(wishlist));
const inWL = (id)=> wishlist.some(b=>b.id===id);

// Google Books 응답에서 필요한 필드만 추림
function normalize(item){
  const v = item.volumeInfo || {};
  let thumb = v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail) : "";
  if (thumb) thumb = thumb.replace("http://","https://");
  return {
    id: item.id,
    title: v.title || "(제목 없음)",
    author: (v.authors && v.authors.join(", ")) || "저자 미상",
    year: (v.publishedDate || "").slice(0,4),
    thumb,
  };
}

function coverHTML(b, cls, nocls){
  return b.thumb
    ? `<img class="${cls}" src="${b.thumb}" alt="${b.title} 표지" loading="lazy" />`
    : `<div class="${cls} ${nocls}">📖</div>`;
}

function renderResults(books){
  if (!books.length){ stateEl.textContent="검색 결과가 없어요. 다른 검색어로 시도해 보세요."; stateEl.style.display="block"; resultsEl.innerHTML=""; $("resCount").textContent=""; return; }
  stateEl.style.display="none";
  $("resCount").textContent = `(${books.length}권)`;
  resultsEl.innerHTML = books.map(b=>`
    <div class="book">
      ${coverHTML(b,"cover","nocover")}
      <div class="title" title="${b.title}">${b.title}</div>
      <div class="author">${b.author}</div>
      <div class="year">${b.year || ""}</div>
      <button class="addbtn ${inWL(b.id)?"added":""}" data-id="${b.id}" ${inWL(b.id)?"disabled":""}>
        ${inWL(b.id)?"✓ 담음":"+ 읽고 싶어요"}
      </button>
    </div>`).join("");
  // 결과 데이터 캐시(위시리스트 추가용)
  resultsEl._books = books;
}

resultsEl.addEventListener("click",(e)=>{
  const btn = e.target.closest(".addbtn");
  if (!btn || btn.disabled) return;
  const book = (resultsEl._books||[]).find(b=>b.id===btn.dataset.id);
  if (!book || inWL(book.id)) return;
  wishlist.unshift({...book, done:false});
  saveWL(); renderWishlist();
  btn.classList.add("added"); btn.disabled=true; btn.textContent="✓ 담음";
});

function renderWishlist(){
  $("wlCount").textContent = wishlist.length ? `(${wishlist.length})` : "";
  if (!wishlist.length){ $("wishlist").innerHTML = `<div class="empty">아직 담은 책이 없어요.<br>검색 결과에서 추가해 보세요.</div>`; return; }
  $("wishlist").innerHTML = wishlist.map(b=>`
    <div class="wl ${b.done?"done":""}" data-id="${b.id}">
      ${coverHTML(b,"","wlnocover")}
      <div class="wlinfo">
        <div class="wltitle">${b.title}</div>
        <div class="wlauthor">${b.author}${b.year?" · "+b.year:""}</div>
        <div class="wlactions">
          <span class="done-toggle">${b.done?"↩ 다시 읽을 책":"✓ 읽음 완료"}</span>
          <button class="del">삭제</button>
        </div>
      </div>
    </div>`).join("");
}

$("wishlist").addEventListener("click",(e)=>{
  const row = e.target.closest(".wl"); if(!row) return;
  const id = row.dataset.id;
  if (e.target.classList.contains("del")){
    wishlist = wishlist.filter(b=>b.id!==id); saveWL(); renderWishlist();
    // 검색 결과의 버튼 상태 되돌리기
    const btn = resultsEl.querySelector(`.addbtn[data-id="${id}"]`);
    if (btn){ btn.classList.remove("added"); btn.disabled=false; btn.textContent="+ 읽고 싶어요"; }
  } else if (e.target.classList.contains("done-toggle")){
    const b = wishlist.find(x=>x.id===id); if(b){ b.done=!b.done; saveWL(); renderWishlist(); }
  }
});

async function search(q){
  stateEl.style.display="block";
  stateEl.innerHTML = '<span class="spinner"></span>';
  resultsEl.innerHTML=""; $("resCount").textContent="";
  try{
    const res = await fetch(`${API}?q=${encodeURIComponent(q)}&maxResults=20&langRestrict=ko`);
    if (res.status===429){ stateEl.textContent="검색 한도를 초과했어요 (429). 잠시 후 다시 시도하세요."; return; }
    if (!res.ok){ stateEl.textContent=`검색 중 오류가 발생했어요 (${res.status}).`; return; }
    const data = await res.json();
    const books = (data.items||[]).map(normalize);
    renderResults(books);
  }catch(err){
    stateEl.textContent="네트워크 오류로 검색하지 못했어요. 연결을 확인해 주세요.";
  }
}

$("searchForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q){ stateEl.style.display="block"; stateEl.textContent="검색어를 입력해 주세요."; return; }
  search(q);
});

renderWishlist();
</script>
</body>
</html>
