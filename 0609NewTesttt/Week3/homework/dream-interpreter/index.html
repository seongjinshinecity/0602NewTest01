<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌙 AI 꿈해몽 — Dream Interpreter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Noto Sans KR', sans-serif;
        background: radial-gradient(circle at 20% 20%, #2a1a55 0%, transparent 45%),
          radial-gradient(circle at 80% 30%, #4c1d95 0%, transparent 40%),
          radial-gradient(circle at 50% 90%, #1e1b4b 0%, transparent 50%),
          #0b0a1f;
        min-height: 100vh;
      }
      .serif {
        font-family: 'Gowun Batang', serif;
      }
      /* 반짝이는 별 배경 */
      .stars::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent),
          radial-gradient(2px 2px at 60px 70px, #c4b5fd, transparent),
          radial-gradient(1px 1px at 130px 80px, #fff, transparent),
          radial-gradient(1.5px 1.5px at 90px 10px, #f0abfc, transparent),
          radial-gradient(2px 2px at 160px 120px, #fff, transparent),
          radial-gradient(1px 1px at 200px 50px, #ddd6fe, transparent);
        background-size: 220px 160px;
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
        animation: twinkle 6s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        from { opacity: 0.25; }
        to { opacity: 0.6; }
      }
      .neon-text {
        background: linear-gradient(90deg, #c084fc, #f0abfc, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass {
        background: rgba(30, 22, 64, 0.55);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(168, 130, 240, 0.25);
      }
      .persona-card.active {
        border-color: #c084fc;
        box-shadow: 0 0 22px rgba(192, 132, 252, 0.45);
        background: rgba(124, 58, 237, 0.35);
      }
      .glow-btn {
        background: linear-gradient(90deg, #7c3aed, #c026d3);
        box-shadow: 0 0 24px rgba(192, 38, 211, 0.4);
      }
      .glow-btn:hover:not(:disabled) {
        box-shadow: 0 0 34px rgba(192, 38, 211, 0.7);
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #f0abfc;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade-in { animation: fadeIn 0.6s ease both; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body class="stars text-slate-100">
    <main class="relative z-10 max-w-3xl mx-auto px-5 py-12">
      <!-- 헤더 -->
      <header class="text-center mb-10">
        <div class="text-5xl mb-3">🌙✨</div>
        <h1 class="serif text-4xl sm:text-5xl font-bold neon-text mb-3">
          AI 꿈해몽
        </h1>
        <p class="text-purple-200/80 text-sm sm:text-base">
          어젯밤 꾼 꿈을 들려주세요. 당신만의 해몽가가 무의식의 메시지를 풀어 드립니다.
        </p>
      </header>

      <!-- 입력 카드 -->
      <section class="glass rounded-3xl p-6 sm:p-8 shadow-2xl">
        <!-- 해몽가 선택 -->
        <label class="block text-purple-200 font-medium mb-3">
          해몽가를 선택하세요
        </label>
        <div
          id="persona-list"
          class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-7"
        >
          <button
            type="button"
            data-key="mystic"
            class="persona-card active rounded-2xl border border-purple-400/30 bg-purple-900/20 p-4 text-center transition hover:bg-purple-800/30"
          >
            <div class="text-2xl mb-1">🔮</div>
            <div class="text-xs sm:text-sm font-medium">신비로운 점술가</div>
          </button>
          <button
            type="button"
            data-key="psychologist"
            class="persona-card rounded-2xl border border-purple-400/30 bg-purple-900/20 p-4 text-center transition hover:bg-purple-800/30"
          >
            <div class="text-2xl mb-1">🧠</div>
            <div class="text-xs sm:text-sm font-medium">과학적 심리학자</div>
          </button>
          <button
            type="button"
            data-key="friend"
            class="persona-card rounded-2xl border border-purple-400/30 bg-purple-900/20 p-4 text-center transition hover:bg-purple-800/30"
          >
            <div class="text-2xl mb-1">😎</div>
            <div class="text-xs sm:text-sm font-medium">솔직한 절친</div>
          </button>
          <button
            type="button"
            data-key="sage"
            class="persona-card rounded-2xl border border-purple-400/30 bg-purple-900/20 p-4 text-center transition hover:bg-purple-800/30"
          >
            <div class="text-2xl mb-1">📜</div>
            <div class="text-xs sm:text-sm font-medium">동양 해몽 도사</div>
          </button>
        </div>

        <!-- 꿈 입력 -->
        <label for="dream-input" class="block text-purple-200 font-medium mb-3">
          어젯밤 꿈 내용
        </label>
        <textarea
          id="dream-input"
          rows="5"
          placeholder="예) 끝없이 펼쳐진 바다 위를 맨발로 걸었고, 하늘에서 보랏빛 비가 내렸어요..."
          class="w-full rounded-2xl bg-slate-900/60 border border-purple-400/30 p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-fuchsia-400/60 resize-none"
        ></textarea>

        <!-- 에러 메시지 -->
        <p id="error-msg" class="hidden text-rose-300 text-sm mt-3"></p>

        <!-- 해몽 버튼 -->
        <button
          id="submit-btn"
          class="glow-btn w-full mt-6 py-4 rounded-2xl font-bold text-white text-lg transition disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          <span id="btn-text">✨ 해몽하기</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
      </section>

      <!-- 결과 영역 -->
      <section
        id="result-section"
        class="hidden glass rounded-3xl p-6 sm:p-8 mt-8 shadow-2xl fade-in"
      >
        <div class="flex items-center gap-2 mb-4 flex-wrap">
          <span class="text-2xl">🌟</span>
          <h2 id="result-character" class="serif text-xl font-bold neon-text">
            해몽 결과
          </h2>
          <!-- 길흉 판정 배지 -->
          <span id="result-fortune" class="hidden ml-auto text-sm font-bold px-3 py-1 rounded-full border"></span>
        </div>

        <!-- 한 줄 요약 -->
        <p id="result-summary" class="serif text-fuchsia-100 text-lg mb-5"></p>

        <!-- 핵심 상징 키워드 -->
        <div id="result-keywords-wrap" class="hidden mb-5">
          <p class="text-purple-300/70 text-xs font-semibold mb-2 tracking-wide">핵심 상징</p>
          <div id="result-keywords" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 해석 본문 -->
        <div class="mb-5">
          <p class="text-purple-300/70 text-xs font-semibold mb-2 tracking-wide">해석</p>
          <div
            id="result-text"
            class="serif text-purple-50/90 leading-relaxed whitespace-pre-line text-[15px] sm:text-base"
          ></div>
        </div>

        <!-- 조언 -->
        <div id="result-advice-wrap" class="hidden rounded-2xl bg-fuchsia-900/20 border border-fuchsia-400/25 p-4">
          <p class="text-fuchsia-200 text-xs font-semibold mb-1">💜 오늘의 조언</p>
          <p id="result-advice" class="serif text-purple-50/90 text-[15px]"></p>
        </div>
      </section>

      <footer class="text-center text-purple-300/40 text-xs mt-12">
        🌌 Dream Interpreter · Powered by Claude
      </footer>
    </main>

    <script src="client.js"></script>
  </body>
</html>
