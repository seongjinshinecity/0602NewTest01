<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>당근클론 — 동네 중고거래</title>
<style>
  :root { --carrot:#FF6F0F; --ink:#212124; --mut:#868b94; --line:#eaebee; --bg:#fff; --soft:#f8f9fa; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  a { color:inherit; text-decoration:none; }
  header { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .hwrap { max-width:960px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; }
  .logo { font-size:20px; font-weight:800; color:var(--carrot); white-space:nowrap; cursor:pointer; }
  .hood { font-size:14px; font-weight:700; white-space:nowrap; }
  #q { flex:1; min-width:80px; font:inherit; font-size:14px; background:var(--soft); border:1px solid var(--line); border-radius:9px; padding:9px 12px; }
  .wrap { max-width:960px; margin:0 auto; padding:20px; }
  button { font:inherit; border:none; border-radius:9px; padding:10px 16px; background:var(--carrot); color:#fff; font-weight:700; cursor:pointer; }
  button.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  button.sm { padding:6px 12px; font-size:13px; }
  input, textarea, select { width:100%; font:inherit; background:#fff; border:1px solid var(--line); border-radius:9px; padding:11px; margin-top:6px; }
  label { font-size:13px; color:var(--mut); display:block; margin-top:12px; }
  .err { color:#e5503c; font-size:13px; min-height:18px; margin-top:8px; }
  .muted { color:var(--mut); font-size:13px; }
  /* 카테고리 칩 */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:14px 0 4px; }
  .chip { flex:none; font-size:13.5px; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  /* 상품 그리드 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; margin-top:16px; }
  .card { cursor:pointer; }
  .card .ph { aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:var(--soft) center/cover no-repeat; position:relative; }
  .card .st { position:absolute; left:8px; top:8px; font-size:11.5px; font-weight:700; color:#fff; background:var(--ink); padding:4px 8px; border-radius:6px; }
  .card .st.done { background:var(--mut); }
  .card h3 { font-size:15px; font-weight:500; margin-top:10px; line-height:1.35; }
  .card .pr { font-size:16px; font-weight:800; margin-top:4px; }
  .card .mt { font-size:12.5px; color:var(--mut); margin-top:4px; }
  /* 상세 */
  .detail { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
  @media (max-width:760px){ .detail { grid-template-columns:1fr; } }
  .slider { position:relative; }
  .slider .main { width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; border:1px solid var(--line); background:var(--soft); }
  .thumbs { display:flex; gap:8px; margin-top:10px; }
  .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:9px; border:2px solid transparent; cursor:pointer; }
  .thumbs img.on { border-color:var(--carrot); }
  .dtitle { font-size:22px; font-weight:800; margin-top:6px; }
  .dprice { font-size:24px; font-weight:800; margin-top:10px; }
  .ddesc { margin-top:16px; line-height:1.65; white-space:pre-wrap; font-size:15px; }
  .seller { display:flex; align-items:center; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .actions { display:flex; gap:10px; margin-top:22px; }
  .actions button { flex:1; }
  .heart { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .heart.on { color:#e5503c; border-color:#e5503c; }
  /* 등록 폼 */
  .imgpick { display:flex; gap:10px; margin-top:8px; }
  .imgpick .slot { width:84px; height:84px; border-radius:10px; border:1px dashed var(--line); background:var(--soft) center/cover; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:22px; cursor:pointer; position:relative; }
  .imgpick .slot .x { position:absolute; right:-6px; top:-6px; width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
  /* 채팅 */
  .chatlist .row { display:flex; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .chatlist .ph { width:52px; height:52px; border-radius:10px; background:var(--soft) center/cover; flex:none; }
  .chatroom { display:flex; flex-direction:column; height:calc(100vh - 170px); max-height:640px; }
  .msgs { flex:1; overflow-y:auto; padding:16px 4px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:70%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.45; }
  .msg.mine { align-self:flex-end; background:var(--carrot); color:#fff; border-bottom-right-radius:4px; }
  .msg.theirs { align-self:flex-start; background:var(--soft); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .composer { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--line); }
  .composer input { margin:0; }
  /* 탭 */
  .tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); margin-top:6px; }
  .tabs div { padding:10px 2px; font-weight:700; color:var(--mut); cursor:pointer; border-bottom:2px solid transparent; }
  .tabs div.on { color:var(--ink); border-color:var(--ink); }
  .fab { position:fixed; right:24px; bottom:24px; width:56px; height:56px; border-radius:50%; font-size:26px; box-shadow:0 6px 18px rgba(255,111,15,.4); }
  #login-view { max-width:400px; margin:40px auto; }
  .empty { text-align:center; color:var(--mut); padding:60px 0; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo" onclick="location.hash='#/'">🥕 당근클론</div>
    <div class="hood" id="hood"></div>
    <input id="q" placeholder="검색: 물건 이름, 설명" />
    <div id="nav" style="display:flex; gap:8px; white-space:nowrap;"></div>
  </div>
</header>
<div class="wrap" id="view"></div>
<button class="fab" id="fab" onclick="location.hash='#/new'" style="display:none;">+</button>

<script>
const $ = (s) => document.querySelector(s);
const won = (n) => Number(n).toLocaleString('ko-KR') + '원';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const timeago = (t) => { const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return `${~~(s/60)}분 전`;
  if (s < 86400) return `${~~(s/3600)}시간 전`; return `${~~(s/86400)}일 전`; };
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '오류가 발생했습니다');
  return data;
};

let ME = null, HOOD = '', CATS = [], pollTimer = null;

async function boot() {
  const [{ user }, { categories }] = await Promise.all([api('/api/auth/me'), api('/api/categories')]);
  ME = user; CATS = categories;
  if (ME) { const p = await api('/api/profile'); HOOD = p.neighborhood; }
  $('#hood').textContent = ME ? `📍 ${HOOD || '동네 미설정'}` : '';
  $('#nav').innerHTML = ME
    ? `<button class="ghost sm" onclick="location.hash='#/chats'">채팅</button>
       <button class="ghost sm" onclick="location.hash='#/me'">나의 당근</button>
       <button class="ghost sm" onclick="logout()">로그아웃</button>`
    : `<button class="sm" onclick="location.hash='#/login'">로그인</button>`;
  $('#fab').style.display = ME ? 'block' : 'none';
  route();
}
window.logout = async () => { await api('/api/auth/logout', { method: 'POST' }); ME = null; location.hash = '#/'; boot(); };

$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { location.hash = '#/'; renderList(); } });

// ── 라우터 ──
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
window.addEventListener('hashchange', route);
function route() {
  stopPoll();
  const h = location.hash || '#/';
  const m = (re) => h.match(re);
  let x;
  if ((x = m(/^#\/p\/(\d+)/))) return renderDetail(+x[1]);
  if ((x = m(/^#\/chat\/(\d+)/))) return renderChat(+x[1]);
  if (h.startsWith('#/login')) return renderLogin();
  if (h.startsWith('#/new')) return ME ? renderNew() : renderLogin();
  if (h.startsWith('#/chats')) return ME ? renderChats() : renderLogin();
  if (h.startsWith('#/me')) return ME ? renderMe('products') : renderLogin();
  renderList();
}

// ── 목록 ──
let CAT = '';
async function renderList() {
  const q = $('#q').value.trim();
  const params = new URLSearchParams(); if (CAT) params.set('category', CAT); if (q) params.set('q', q);
  const { products } = await api('/api/products?' + params);
  $('#view').innerHTML = `
    <div class="chips">
      <div class="chip ${CAT ? '' : 'on'}" onclick="setCat('')">전체</div>
      ${CATS.map((c) => `<div class="chip ${CAT === c ? 'on' : ''}" onclick="setCat('${c}')">${c}</div>`).join('')}
    </div>
    ${products.length ? `<div class="grid">${products.map(cardHtml).join('')}</div>`
      : `<div class="empty">등록된 물건이 없어요.<br/>첫 물건을 올려보세요 🥕</div>`}`;
}
window.setCat = (c) => { CAT = c; renderList(); };
const cardHtml = (p) => `
  <div class="card" onclick="location.hash='#/p/${p.id}'">
    <div class="ph" style="background-image:url('${esc(p.thumb || '')}')">
      ${p.status !== '판매중' ? `<span class="st ${p.status === '판매완료' ? 'done' : ''}">${p.status}</span>` : ''}
    </div>
    <h3>${esc(p.title)}</h3>
    <div class="pr">${won(p.price)}</div>
    <div class="mt">${esc(p.neighborhood || '동네 미설정')} · ${timeago(p.created_at)}${p.favorites ? ` · ♥ ${p.favorites}` : ''}</div>
  </div>`;

// ── 상세 ──
async function renderDetail(id) {
  const { product: p } = await api('/api/products/' + id);
  const mine = ME && ME.id === p.user_id;
  let liked = false;
  $('#view').innerHTML = `
    <div class="detail">
      <div class="slider">
        <img class="main" id="mainImg" src="${esc(p.images[0] || '')}" />
        ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((u, i) =>
          `<img src="${esc(u)}" class="${i ? '' : 'on'}" onclick="pickImg(this, '${esc(u)}')" />`).join('')}</div>` : ''}
      </div>
      <div>
        <div class="seller"><div class="avatar">🥕</div>
          <div><b>${esc(p.seller)}</b><div class="muted">${esc(p.neighborhood || '동네 미설정')}</div></div></div>
        <div class="dtitle">${esc(p.title)}</div>
        <div class="muted" style="margin-top:6px;">${esc(p.category)} · ${timeago(p.created_at)} · 관심 ${p.favorites}</div>
        <div class="dprice">${won(p.price)} ${p.status !== '판매중' ? `<span class="muted">· ${p.status}</span>` : ''}</div>
        <div class="ddesc">${esc(p.description)}</div>
        <div class="actions" id="actions">
          ${mine ? `
            <select id="stSel" style="margin:0;">
              ${['판매중','예약중','판매완료'].map((s) => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <button class="ghost" onclick="setStatus(${p.id})">상태 변경</button>
            <button class="ghost" style="color:#e5503c;" onclick="delProduct(${p.id})">삭제</button>`
          : `
            <button class="heart" id="favBtn" onclick="toggleFav(${p.id})">♥ 관심</button>
            <button onclick="startChat(${p.id})">채팅하기</button>`}
        </div>
        <div class="err" id="dErr"></div>
      </div>
    </div>`;
  window.pickImg = (el, u) => { $('#mainImg').src = u; document.querySelectorAll('.thumbs img').forEach((t) => t.classList.remove('on')); el.classList.add('on'); };
  window.toggleFav = async (pid) => {
    if (!ME) return location.hash = '#/login';
    try { const r = await api(`/api/products/${pid}/favorite`, { method: 'POST' });
      liked = r.liked; $('#favBtn').classList.toggle('on', liked);
      $('#favBtn').textContent = `♥ 관심 ${r.favorites}`; } catch (e) { $('#dErr').textContent = e.message; }
  };
  window.startChat = async (pid) => {
    if (!ME) return location.hash = '#/login';
    try { const { chatId } = await api(`/api/products/${pid}/chat`, { method: 'POST' });
      location.hash = '#/chat/' + chatId; } catch (e) { $('#dErr').textContent = e.message; }
  };
  window.setStatus = async (pid) => {
    try { await api('/api/products/' + pid, { method: 'PUT', body: JSON.stringify({ status: $('#stSel').value }) });
      renderDetail(pid); } catch (e) { $('#dErr').textContent = e.message; }
  };
  window.delProduct = async (pid) => {
    try { await api('/api/products/' + pid, { method: 'DELETE' }); location.hash = '#/'; }
    catch (e) { $('#dErr').textContent = e.message; }
  };
}

// ── 로그인/가입 ──
function renderLogin() {
  $('#view').innerHTML = `
    <div id="login-view">
      <h2 style="font-size:22px;">🥕 당근클론 시작하기</h2>
      <label>이메일</label><input id="email" type="email" />
      <label>비밀번호 (6자 이상)</label><input id="pw" type="password" />
      <div id="regExtra" style="display:none;">
        <label>닉네임</label><input id="nick" placeholder="예: 성수동카레" />
        <label>내 동네 (직접 입력)</label><input id="hoodIn" placeholder="예: 성수동" />
      </div>
      <div class="err" id="lErr"></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button onclick="doLogin()">로그인</button>
        <button class="ghost" id="regBtn" onclick="doRegister()">회원가입</button>
      </div>
    </div>`;
  window.doLogin = async () => {
    try { await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) });
      location.hash = '#/'; boot(); } catch (e) { $('#lErr').textContent = e.message; }
  };
  window.doRegister = async () => {
    if ($('#regExtra').style.display === 'none') { $('#regExtra').style.display = 'block'; $('#regBtn').textContent = '가입 완료'; return; }
    try {
      await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#pw').value, name: $('#nick').value }) });
      const hood = $('#hoodIn').value.trim();
      if (hood) await api('/api/profile', { method: 'POST', body: JSON.stringify({ neighborhood: hood }) });
      location.hash = '#/'; boot();
    } catch (e) { $('#lErr').textContent = e.message; }
  };
}

// ── 상품 등록 ──
function renderNew() {
  let imgs = []; // dataURL 배열 (최대 3)
  $('#view').innerHTML = `
    <div style="max-width:560px; margin:0 auto;">
      <h2 style="font-size:20px;">내 물건 팔기</h2>
      <label>사진 (최대 3장 · 첫 장이 대표)</label>
      <div class="imgpick" id="imgpick"></div>
      <input type="file" id="file" accept="image/*" multiple style="display:none;" />
      <label>제목</label><input id="nTitle" placeholder="예: 아이패드 에어 5세대" />
      <label>카테고리</label><select id="nCat">${CATS.map((c) => `<option>${c}</option>`).join('')}</select>
      <label>가격(원)</label><input id="nPrice" type="number" min="0" placeholder="예: 350000" />
      <label>설명</label><textarea id="nDesc" rows="5" placeholder="상태, 구매 시기, 거래 방법 등"></textarea>
      <div class="err" id="nErr"></div>
      <button style="width:100%; margin-top:14px;" onclick="submitNew()">등록하기</button>
    </div>`;
  const drawSlots = () => {
    $('#imgpick').innerHTML = imgs.map((u, i) =>
      `<div class="slot" style="background-image:url('${u}')"><span class="x" onclick="rmImg(event, ${i})">✕</span></div>`).join('')
      + (imgs.length < 3 ? `<div class="slot" onclick="$('#file').click()">＋</div>` : '');
  };
  window.rmImg = (e, i) => { e.stopPropagation(); imgs.splice(i, 1); drawSlots(); };
  $('#file').addEventListener('change', async (e) => {
    for (const f of [...e.target.files].slice(0, 3 - imgs.length)) {
      const dataUrl = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
      imgs.push(await shrink(dataUrl));
    }
    drawSlots();
  });
  drawSlots();
  window.submitNew = async () => {
    $('#nErr').textContent = '';
    try {
      const { id } = await api('/api/products', { method: 'POST', body: JSON.stringify({
        title: $('#nTitle').value, price: Number($('#nPrice').value),
        description: $('#nDesc').value, category: $('#nCat').value, images: imgs,
      }) });
      location.hash = '#/p/' + id;
    } catch (e) { $('#nErr').textContent = e.message; }
  };
}
// 업로드 전 리사이즈 (긴 변 1000px, JPEG 0.85)
async function shrink(dataUrl) {
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = dataUrl; });
  const max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.85);
}

// ── 채팅 목록 ──
async function renderChats() {
  const { chats } = await api('/api/chats');
  $('#view').innerHTML = `<h2 style="font-size:20px;">채팅</h2>
    <div class="chatlist">${chats.length ? chats.map((c) => `
      <div class="row" onclick="location.hash='#/chat/${c.id}'">
        <div class="ph" style="background-image:url('${esc(c.thumb || '')}')"></div>
        <div style="flex:1;"><b>${esc(c.partner)}</b> <span class="muted">· ${esc(c.title)}</span>
          <div class="muted">${esc(c.last_message || '대화를 시작해보세요')}</div></div>
        <div class="muted">${c.last_at ? timeago(c.last_at) : ''}</div>
      </div>`).join('') : '<div class="empty">아직 채팅이 없어요</div>'}</div>`;
}

// ── 채팅방 (폴링) ──
async function renderChat(id) {
  let lastId = 0;
  $('#view').innerHTML = `
    <div class="chatroom">
      <div class="seller" id="chatHead"></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <input id="mIn" placeholder="메시지 보내기" />
        <button onclick="sendMsg(${id})">전송</button>
      </div>
      <div class="err" id="cErr"></div>
    </div>`;
  const pull = async () => {
    try {
      const d = await api(`/api/chats/${id}/messages?after=${lastId}`);
      $('#chatHead').innerHTML = `<div class="avatar">🥕</div><div><b>${esc(d.chat.partner)}</b>
        <div class="muted">${esc(d.chat.title)} · ${won(d.chat.price)}</div></div>`;
      if (d.messages.length) {
        lastId = d.messages.at(-1).id;
        $('#msgs').insertAdjacentHTML('beforeend', d.messages.map((m) =>
          `<div class="msg ${m.sender_id === d.me ? 'mine' : 'theirs'}">${esc(m.content)}</div>`).join(''));
        $('#msgs').scrollTop = $('#msgs').scrollHeight;
      }
    } catch (e) { $('#cErr').textContent = e.message; stopPoll(); }
  };
  await pull();
  pollTimer = setInterval(pull, 3000); // Polling — 주기적으로 DB 변화 체크
  $('#mIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') window.sendMsg(id); });
  window.sendMsg = async (cid) => {
    const content = $('#mIn').value.trim(); if (!content) return;
    $('#mIn').value = '';
    try { await api(`/api/chats/${cid}/messages`, { method: 'POST', body: JSON.stringify({ content }) }); await pull(); }
    catch (e) { $('#cErr').textContent = e.message; }
  };
}

// ── 마이페이지 ──
async function renderMe(tab) {
  const url = tab === 'favorites' ? '/api/me/favorites' : '/api/me/products';
  const { products } = await api(url);
  $('#view').innerHTML = `
    <h2 style="font-size:20px;">나의 당근 <span class="muted" style="font-weight:500;">${esc(ME.name)} · ${esc(HOOD || '동네 미설정')}</span></h2>
    <div class="tabs">
      <div class="${tab === 'products' ? 'on' : ''}" onclick="renderMe('products')">내 상품</div>
      <div class="${tab === 'favorites' ? 'on' : ''}" onclick="renderMe('favorites')">관심 목록</div>
      <div onclick="location.hash='#/chats'">채팅</div>
    </div>
    ${products.length ? `<div class="grid">${products.map((p) => cardHtml({ ...p, neighborhood: HOOD, favorites: 0 })).join('')}</div>`
      : '<div class="empty">비어 있어요</div>'}`;
}
window.renderMe = renderMe;

boot();
</script>
</body>
</html>
