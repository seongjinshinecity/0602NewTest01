<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>명함 - 뒷면</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1063px;
    height: 638px;
    overflow: hidden;
    background: #2B2A28;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
    color: #F5F1EA;
    position: relative;
  }

  .card {
    width: 1063px;
    height: 638px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .time {
    font-size: 220px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #F5F1EA;
    line-height: 1;
  }

  .slogan {
    margin-top: 26px;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #F5F1EA;
    opacity: 0.7;
  }

  .handle {
    position: absolute;
    right: 56px;
    bottom: 40px;
    font-size: 17px;
    font-weight: 400;
    color: #F5F1EA;
    opacity: 0.45;
    letter-spacing: 0.02em;
  }

  @media print {
    @page { size: 90mm 54mm; margin: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="time">8<span>:</span>30</div>
    <div class="slogan">출근길의 커피, 여덟 시 반</div>
  </div>
  <div class="handle">@quarterncoffee</div>
</body>
</html>
