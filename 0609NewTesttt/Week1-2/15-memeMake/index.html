<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밈 생성기 — Meme Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* 밈 텍스트 스타일: Impact 느낌 + 흰 글씨 + 검은 외곽선(text-shadow 레이어) */
    .meme-text {
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-shadow:
        -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
        -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
        0 3px 4px rgba(0,0,0,0.6);
      word-break: keep-all;
    }
    /* 스크롤바 다크 톤 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
  </style>
</head>
<body class="bg-zinc-950">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = "primary", size = "md", disabled, onClick, className = "", children, type = "button" }) {
      const variants = {
        primary: "bg-indigo-600 hover:bg-indigo-500 text-white",
        secondary: "bg-zinc-700 hover:bg-zinc-600 text-zinc-100",
        danger: "bg-rose-600 hover:bg-rose-500 text-white",
        ghost: "bg-transparent hover:bg-zinc-800 text-zinc-300 border border-zinc-700",
        success: "bg-emerald-600 hover:bg-emerald-500 text-white",
      };
      const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2 text-sm", lg: "px-6 py-3 text-base" };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`rounded-xl font-semibold transition-colors duration-150 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-indigo-400/50 ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ className = "", children }) {
      return <div className={`bg-zinc-900 border border-zinc-800 rounded-2xl shadow-lg ${className}`}>{children}</div>;
    }

    function Label({ children, htmlFor }) {
      return <label htmlFor={htmlFor} className="block text-xs font-semibold text-zinc-400 mb-1.5 uppercase tracking-wide">{children}</label>;
    }

    function TextArea({ label, value, onChange, placeholder, rows = 3 }) {
      return (
        <div>
          {label && <Label>{label}</Label>}
          <textarea
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            rows={rows}
            className="w-full rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-100 px-3.5 py-2.5 text-sm placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 resize-none"
          />
        </div>
      );
    }

    function Input({ label, value, onChange, placeholder }) {
      return (
        <div>
          {label && <Label>{label}</Label>}
          <input
            type="text"
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            className="w-full rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 px-3 py-2 text-sm placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500"
          />
        </div>
      );
    }

    function Select({ label, value, onChange, options }) {
      return (
        <div>
          {label && <Label>{label}</Label>}
          <select
            value={value}
            onChange={onChange}
            className="w-full rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-100 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500"
          >
            {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Badge({ children, color = "indigo" }) {
      const colors = {
        indigo: "bg-indigo-500/15 text-indigo-300 border-indigo-500/30",
        amber: "bg-amber-500/15 text-amber-300 border-amber-500/30",
        emerald: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
        rose: "bg-rose-500/15 text-rose-300 border-rose-500/30",
      };
      return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border ${colors[color]}`}>{children}</span>;
    }

    // ========================================
    // 🧠 도메인 데이터: 템플릿 정의
    // ========================================
    const TEMPLATES = {
      ANAKIN_PADME: {
        id: "ANAKIN_PADME",
        name: "아나킨 & 파드메 (기대→현실 반전)",
        emoji: "🌌",
        slots: 4,
        slotLabels: ["1컷 — 기대 (아나킨)", "2컷 — 공감 (파드메)", "3컷 — 불안 (파드메)", "4컷 — 현실/침묵 (파드메)"],
        desc: "기대했다가 무너지는 반전. 처음엔 좋았는데 현실은 시궁창.",
      },
      UNO_DRAW25: {
        id: "UNO_DRAW25",
        name: "UNO Draw 25 (차라리 손해를)",
        emoji: "🃏",
        slots: 1,
        slotLabels: ["요구되는 행동 (카드 위 텍스트)"],
        desc: "극단적 선택을 거부하고 차라리 불이익(25장 뽑기)을 감수.",
      },
      DRAKE: {
        id: "DRAKE",
        name: "Drake (싫어함 vs 선호함)",
        emoji: "🙅",
        slots: 2,
        slotLabels: ["위 패널 — 거부하는 것 🙅", "아래 패널 — 선택하는 것 👉"],
        desc: "이것보다 저것이 낫다. 선호/비교/before vs after.",
      },
      WOMAN_CAT: {
        id: "WOMAN_CAT",
        name: "여자가 고양이에게 소리침 (갈등)",
        emoji: "😡",
        slots: 2,
        slotLabels: ["왼쪽 — 소리치는 말 😡", "오른쪽 — 고양이 반응 😼"],
        desc: "의견 충돌 / 세대 차이 / 회사·개발자 갈등 / 고객 vs 개발자.",
      },
      UPLOAD: {
        id: "UPLOAD",
        name: "내 사진 업로드 (직접 짤 만들기)",
        emoji: "🖼️",
        slots: 2,
        slotLabels: ["위 텍스트 (TOP)", "아래 텍스트 (BOTTOM)"],
        desc: "내 이미지를 올리고 위·아래 자막을 넣어 클래식 짤을 만듭니다.",
      },
    };
    // 자동 추천/랜덤 풀에는 CSS 프리셋 4종만 포함 (UPLOAD은 이미지가 필요하므로 제외)
    const TEMPLATE_ORDER = ["ANAKIN_PADME", "UNO_DRAW25", "DRAKE", "WOMAN_CAT"];

    const CATEGORIES = [
      { value: "work", label: "💼 직장" },
      { value: "dev", label: "💻 개발" },
      { value: "invest", label: "📈 투자" },
      { value: "love", label: "💕 연애" },
      { value: "etc", label: "✨ 기타" },
    ];

    // ========================================
    // 🔍 키워드 기반 템플릿 추천 엔진
    // ========================================
    const KEYWORD_RULES = [
      { template: "WOMAN_CAT", reason: "갈등/충돌/언쟁 분위기가 느껴져요", keywords: ["갈등", "충돌", "싸움", "언쟁", "세대", "꼰대", "고객", "갑질", "다툼", "화남", "빡침", "짜증", "상사", "팀장", "회의", "탓", "책임", "버그누구", "남탓", "vs", "대립", "분노"] },
      { template: "DRAKE", reason: "비교/선호('이것보다 저것') 구도가 있어요", keywords: ["보다", "차라리", "낫다", "선호", "비교", "vs", "대신", "전환", "before", "after", "이직", "갈아탐", "바꿈", "선택", "취향", "추천"] },
      { template: "UNO_DRAW25", reason: "극단적 선택을 피하고 손해를 감수하는 상황이에요", keywords: ["차라리", "포기", "감수", "거부", "안함", "절대", "리스크", "위험", "회피", "도망", "버틴다", "그냥말지", "안할래", "관둔다", "퇴사"] },
      { template: "ANAKIN_PADME", reason: "기대했다가 무너지는 반전 서사가 어울려요", keywords: ["기대", "실망", "반전", "현실", "처음", "줄알았", "그런데", "막상", "알고보니", "희망", "꿈", "결국", "시궁창", "망함", "속았", "줄 알았", "기대했"] },
    ];

    function recommendTemplate(text, category) {
      const t = (text || "").toLowerCase();
      const scores = {};
      TEMPLATE_ORDER.forEach((id) => (scores[id] = 0));
      const matchedReasons = {};
      KEYWORD_RULES.forEach((rule) => {
        rule.keywords.forEach((kw) => {
          if (t.includes(kw.toLowerCase())) {
            scores[rule.template] += 1;
            if (!matchedReasons[rule.template]) matchedReasons[rule.template] = rule.reason;
          }
        });
      });
      // 카테고리 가중치 (약하게)
      const catBias = {
        work: "WOMAN_CAT", dev: "WOMAN_CAT", invest: "ANAKIN_PADME", love: "DRAKE", etc: null,
      };
      if (catBias[category]) scores[catBias[category]] += 0.4;

      let best = null, bestScore = 0;
      TEMPLATE_ORDER.forEach((id) => {
        if (scores[id] > bestScore) { bestScore = scores[id]; best = id; }
      });
      if (!best || bestScore <= 0) return null;
      return { template: best, reason: matchedReasons[best] || "입력 내용과 가장 잘 맞아요", score: bestScore };
    }

    // ========================================
    // ✍️ 규칙 기반 한국어 문구 생성기
    // ========================================
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // 입력에서 핵심 주제 추출 (간단히 정리)
    function topicOf(text, category) {
      const cleaned = (text || "").trim().replace(/\s+/g, " ");
      if (cleaned) return cleaned.length > 22 ? cleaned.slice(0, 22) + "…" : cleaned;
      const fallback = { work: "이번 프로젝트", dev: "이 코드", invest: "내 포트폴리오", love: "우리 사이", etc: "이 상황" };
      return fallback[category] || "이 상황";
    }

    // 카테고리별 색깔 있는 단어 풀
    const CAT_FLAVOR = {
      work: { good: ["칼퇴", "성과급", "워라밸", "재택근무"], bad: ["야근", "주말출근", "성과면담", "추가업무"], villain: ["팀장님", "상무님", "고객사"], me: ["나" ] },
      dev: { good: ["배포 성공", "버그 0개", "코드리뷰 통과", "테스트 그린"], bad: ["프로덕션 장애", "머지 충돌", "레거시 코드", "금요일 배포"], villain: ["QA", "기획자", "PM"], me: ["개발자"] },
      invest: { good: ["떡상", "익절", "배당금", "원금 회복"], bad: ["물타기", "손절", "마이너스", "강제 장기투자"], villain: ["증권사", "유튜버 추천"], me: ["나"] },
      love: { good: ["답장", "데이트", "기념일 챙김"], bad: ["읽씹", "잠수", "환승이별"], villain: ["전남친", "썸남"], me: ["나"] },
      etc: { good: ["성공", "행복", "여유"], bad: ["실패", "현타", "번아웃"], villain: ["세상", "현실"], me: ["나"] },
    };

    function flavor(category) { return CAT_FLAVOR[category] || CAT_FLAVOR.etc; }

    // 템플릿별 생성기 — 각 함수는 슬롯 텍스트 배열을 반환
    const GENERATORS = {
      ANAKIN_PADME(topic, category) {
        const f = flavor(category);
        const variants = [
          [
            `${topic}, 이번엔 진짜 잘 풀릴 거야`,
            `정말? 다행이다 🥹`,
            `정말 잘 풀리는 거 맞지…?`,
            ``,
          ],
          [
            `${topic} 끝나면 ${pick(f.good)} 가능하다며`,
            `우와 진짜 좋다!`,
            `진짜 가능한 거지…?`,
            ``,
          ],
          [
            `이번 ${topic}만 끝나면 인생 핀다`,
            `드디어 ${pick(f.good)}이네!`,
            `…핀다는 거 맞지?`,
            ``,
          ],
        ];
        return pick(variants);
      },
      UNO_DRAW25(topic, category) {
        const f = flavor(category);
        const variants = [
          `${topic} 다시 하기`,
          `${pick(f.bad)} 한 번 더`,
          `${topic} 인정하고 사과하기`,
          `${pick(f.villain)} 의견에 동의하기`,
          `${topic} 처음부터 다시`,
        ];
        return [pick(variants)];
      },
      DRAKE(topic, category) {
        const f = flavor(category);
        const variants = [
          [`${pick(f.bad)} 견디며 ${topic} 하기`, `깔끔하게 ${pick(f.good)} 택하기`],
          [`${topic} 정공법으로 풀기`, `${topic} 그냥 넘겨버리기`],
          [`${pick(f.villain)} 말 듣기`, `내 ${topic} 밀고 가기`],
          [`어제의 ${topic}`, `오늘의 ${pick(f.good)}`],
        ];
        return pick(variants);
      },
      WOMAN_CAT(topic, category) {
        const f = flavor(category);
        const variants = [
          [`${topic} 이거 누가 이렇게 한 거야!!`, `${pick(f.me)}: 그게 원래 그래요 😼`],
          [`${pick(f.villain)}: ${topic} 당장 고쳐!!`, `나: 그건 사양입니다 😼`],
          [`이 ${topic} 때문에 다 망했잖아!!`, `😼 흠… 그래서요?`],
          [`${topic} 책임자 나와!!`, `😼 (천천히 눈 깜빡)`],
        ];
        return pick(variants);
      },
      UPLOAD(topic, category) {
        // 업로드 이미지용 클래식 상/하단 자막
        const variants = [
          [`${topic}`, `결국 이렇게 됐다`],
          [`${topic} 하는 중`, `(아무도 못 말림)`],
          [`나: ${topic}`, `현실: ...`],
          [`${topic} 라고 했지`, `근데 왜 이래?`],
        ];
        return pick(variants);
      },
    };

    function generateTexts(templateId, text, category) {
      const topic = topicOf(text, category);
      return GENERATORS[templateId](topic, category);
    }

    // ========================================
    // 🖼️ 밈 렌더링 컴포넌트 (CSS 레이아웃, 외부 이미지 無)
    // ========================================
    function MemeTextOverlay({ text, className = "", style = {} }) {
      return <div className={`meme-text ${className}`} style={style}>{text}</div>;
    }

    // 아나킨 & 파드메 4컷
    function AnakinPadme({ texts }) {
      const panels = [
        { emoji: "😎", bg: "from-sky-700 to-sky-900", label: "아나킨" },
        { emoji: "🙂", bg: "from-amber-600 to-amber-800", label: "파드메" },
        { emoji: "😟", bg: "from-rose-700 to-rose-900", label: "파드메" },
        { emoji: "😶", bg: "from-zinc-700 to-zinc-900", label: "파드메" },
      ];
      return (
        <div className="grid grid-cols-2 gap-1 bg-black p-1 aspect-square">
          {panels.map((p, i) => (
            <div key={i} className={`relative bg-gradient-to-br ${p.bg} flex flex-col items-center justify-end overflow-hidden`}>
              <div className="absolute top-2 left-2 text-[10px] text-white/60 font-bold">{p.label}</div>
              <div className="text-5xl sm:text-6xl mt-4 select-none">{p.emoji}</div>
              <MemeTextOverlay text={texts[i]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" />
            </div>
          ))}
        </div>
      );
    }

    // UNO Draw 25 카드
    function UnoDraw25({ texts }) {
      return (
        <div className="bg-gradient-to-br from-yellow-50 to-amber-100 aspect-square flex flex-col items-center justify-center p-6 gap-5">
          <MemeTextOverlay text={texts[0]} className="text-center text-lg sm:text-2xl px-2" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          <div className="text-3xl">⬇️</div>
          <div className="relative w-40 h-56 sm:w-48 sm:h-64 rounded-2xl bg-red-600 shadow-2xl border-4 border-white flex items-center justify-center rotate-[-6deg]">
            <div className="absolute inset-2 rounded-xl border-2 border-white/40"></div>
            <div className="text-center">
              <div className="text-white font-black text-2xl sm:text-3xl leading-tight" style={{ textShadow: "2px 2px 0 #00000055" }}>DRAW</div>
              <div className="text-white font-black text-5xl sm:text-6xl leading-none" style={{ textShadow: "2px 2px 0 #00000055" }}>25</div>
              <div className="mt-2 text-white text-3xl">🃏</div>
            </div>
            <div className="absolute top-1.5 left-2 text-white font-black text-lg">+25</div>
            <div className="absolute bottom-1.5 right-2 text-white font-black text-lg rotate-180">+25</div>
          </div>
          <div className="text-sm font-bold text-zinc-700">나: 그냥 25장 뽑고 만다 😤</div>
        </div>
      );
    }

    // Drake Hotline Bling
    function Drake({ texts }) {
      return (
        <div className="grid grid-cols-2 grid-rows-2 aspect-square bg-black gap-1 p-1">
          {/* 위: 거부 */}
          <div className="bg-gradient-to-br from-orange-300 to-orange-400 flex items-center justify-center relative">
            <div className="text-6xl sm:text-7xl select-none">🙅‍♂️</div>
            <div className="absolute bottom-1 right-1 text-xs">🚫</div>
          </div>
          <div className="bg-zinc-100 flex items-center justify-center p-3">
            <MemeTextOverlay text={texts[0]} className="text-center text-sm sm:text-lg" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
          {/* 아래: 선호 */}
          <div className="bg-gradient-to-br from-amber-400 to-amber-500 flex items-center justify-center relative">
            <div className="text-6xl sm:text-7xl select-none">👉😎</div>
          </div>
          <div className="bg-zinc-100 flex items-center justify-center p-3">
            <MemeTextOverlay text={texts[1]} className="text-center text-sm sm:text-lg" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
        </div>
      );
    }

    // 여자가 고양이에게 소리침
    function WomanCat({ texts }) {
      return (
        <div className="grid grid-cols-2 aspect-square bg-black gap-1 p-1">
          <div className="relative bg-gradient-to-br from-rose-200 to-rose-400 flex flex-col items-center justify-end overflow-hidden">
            <div className="text-6xl sm:text-7xl mt-6 select-none">😡👈</div>
            <MemeTextOverlay text={texts[0]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" />
          </div>
          <div className="relative bg-gradient-to-br from-slate-200 to-slate-400 flex flex-col items-center justify-end overflow-hidden">
            <div className="absolute top-2 right-2 text-2xl">🍽️</div>
            <div className="text-6xl sm:text-7xl mt-6 select-none">😼</div>
            <MemeTextOverlay text={texts[1]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
        </div>
      );
    }

    // 업로드한 내 사진 + 상/하단 자막 (클래식 짤)
    function CustomImage({ texts, image }) {
      return (
        <div className="relative aspect-square bg-black overflow-hidden flex items-center justify-center">
          {image
            ? <img src={image} alt="업로드 이미지" crossOrigin="anonymous" className="absolute inset-0 w-full h-full object-contain" />
            : <div className="text-zinc-600 text-sm">이미지를 업로드해 주세요</div>}
          {/* 상단 자막 */}
          {texts[0] && (
            <MemeTextOverlay text={texts[0]}
              className="absolute top-0 left-0 right-0 text-center px-3 pt-3 text-xl sm:text-3xl uppercase" />
          )}
          {/* 하단 자막 */}
          {texts[1] && (
            <MemeTextOverlay text={texts[1]}
              className="absolute bottom-0 left-0 right-0 text-center px-3 pb-3 text-xl sm:text-3xl uppercase" />
          )}
        </div>
      );
    }

    function MemeCanvas({ templateId, texts, image, innerRef }) {
      const Comp = { ANAKIN_PADME: AnakinPadme, UNO_DRAW25: UnoDraw25, DRAKE: Drake, WOMAN_CAT: WomanCat }[templateId];
      return (
        <div ref={innerRef} className="w-full max-w-md mx-auto select-none">
          {templateId === "UPLOAD"
            ? <CustomImage texts={texts} image={image} />
            : <Comp texts={texts} />}
        </div>
      );
    }

    // ========================================
    // 📄 메인 App
    // ========================================
    function App() {
      const [text, setText] = useState("");
      const [category, setCategory] = useState("work");
      const [templateChoice, setTemplateChoice] = useState("AUTO"); // AUTO | 템플릿ID
      const [activeTemplate, setActiveTemplate] = useState(null);
      const [texts, setTexts] = useState([]);
      const [recommendation, setRecommendation] = useState(null);
      const [downloading, setDownloading] = useState(false);
      const [uploadImage, setUploadImage] = useState(null); // 업로드한 이미지 data URL
      const lastTemplateRef = useRef(null);
      const memeRef = useRef(null);
      const fileInputRef = useRef(null);

      // 파일 업로드 → data URL 로 변환 (브라우저 내 처리, 서버 전송 없음)
      const handleFile = useCallback((file) => {
        if (!file) return;
        if (!file.type.startsWith("image/")) { alert("이미지 파일만 업로드할 수 있어요."); return; }
        if (file.size > 8 * 1024 * 1024) { alert("8MB 이하 이미지를 올려주세요."); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
          setUploadImage(e.target.result);
          setTemplateChoice("UPLOAD"); // 업로드하면 자동으로 업로드 템플릿 선택
        };
        reader.readAsDataURL(file);
      }, []);

      // 입력에 따라 실시간 추천 표시 (AUTO 모드일 때만 의미)
      useEffect(() => {
        setRecommendation(recommendTemplate(text, category));
      }, [text, category]);

      // 랜덤 템플릿 선택 (직전 사용 제외)
      const pickRandomTemplate = useCallback(() => {
        let pool = TEMPLATE_ORDER.filter((id) => id !== lastTemplateRef.current);
        if (pool.length === 0) pool = TEMPLATE_ORDER;
        return pool[Math.floor(Math.random() * pool.length)];
      }, []);

      // 템플릿 결정 로직: 명시 선택 > AUTO(추천 > 랜덤)
      const resolveTemplate = useCallback(() => {
        if (templateChoice !== "AUTO") return templateChoice;
        const rec = recommendTemplate(text, category);
        if (rec) return rec.template;
        return pickRandomTemplate();
      }, [templateChoice, text, category, pickRandomTemplate]);

      const handleGenerate = useCallback(() => {
        const tpl = resolveTemplate();
        if (tpl === "UPLOAD" && !uploadImage) {
          alert("먼저 이미지를 업로드해 주세요. (아래 '내 사진 업로드' 영역)");
          return;
        }
        const generated = generateTexts(tpl, text, category);
        setActiveTemplate(tpl);
        setTexts(generated);
        lastTemplateRef.current = tpl;
      }, [resolveTemplate, text, category, uploadImage]);

      // 같은 입력/템플릿으로 문구만 다시 뽑기
      const handleRegenerate = useCallback(() => {
        if (!activeTemplate) return handleGenerate();
        setTexts(generateTexts(activeTemplate, text, category));
      }, [activeTemplate, text, category, handleGenerate]);

      const updateSlot = (i, val) => {
        setTexts((prev) => prev.map((t, idx) => (idx === i ? val : t)));
      };

      const handleDownload = useCallback(async () => {
        if (!memeRef.current || !window.html2canvas) return;
        setDownloading(true);
        try {
          const canvas = await window.html2canvas(memeRef.current, {
            backgroundColor: "#000000",
            scale: 2,
            useCORS: true,
            logging: false,
          });
          const link = document.createElement("a");
          link.download = `meme-${activeTemplate}-${Date.now()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (e) {
          alert("이미지 생성 중 오류가 발생했습니다: " + e.message);
        } finally {
          setDownloading(false);
        }
      }, [activeTemplate]);

      const activeTplMeta = activeTemplate ? TEMPLATES[activeTemplate] : null;

      const templateOptions = [
        { value: "AUTO", label: "🎲 자동 (추천/랜덤)" },
        ...TEMPLATE_ORDER.map((id) => ({ value: id, label: `${TEMPLATES[id].emoji} ${TEMPLATES[id].name}` })),
        { value: "UPLOAD", label: `${TEMPLATES.UPLOAD.emoji} ${TEMPLATES.UPLOAD.name}` },
      ];

      return (
        <div className="min-h-screen text-zinc-100 pb-16">
          {/* 헤더 */}
          <header className="border-b border-zinc-800 bg-zinc-900/60 backdrop-blur sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 py-4 flex items-center gap-3">
              <span className="text-3xl">🤣</span>
              <div>
                <h1 className="text-xl font-black tracking-tight">밈 생성기</h1>
                <p className="text-xs text-zinc-400">프리셋 템플릿으로 자동 생성하거나, 내 사진을 올려 직접 짤을 만드세요</p>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 mt-6 grid lg:grid-cols-2 gap-6">
            {/* 좌측: 입력 영역 */}
            <div className="space-y-5">
              <Card className="p-5 space-y-4">
                <h2 className="text-sm font-bold text-zinc-200 flex items-center gap-2">📝 무슨 이야기를 밈으로 만들까요?</h2>
                <TextArea
                  label="주제 · 상황 · 감정"
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="예) 금요일 오후에 프로덕션 배포하자는 팀장님 / 차라리 야근하고 말지 / 떡상할 줄 알았는데…"
                  rows={4}
                />
                <div className="grid grid-cols-2 gap-3">
                  <Select label="카테고리" value={category} onChange={(e) => setCategory(e.target.value)} options={CATEGORIES} />
                  <Select label="템플릿" value={templateChoice} onChange={(e) => setTemplateChoice(e.target.value)} options={templateOptions} />
                </div>

                {/* 추천 표시 */}
                {templateChoice === "AUTO" && (
                  <div className="rounded-xl bg-zinc-800/60 border border-zinc-700 p-3 text-sm">
                    {recommendation ? (
                      <div className="flex flex-col gap-1.5">
                        <div className="flex items-center gap-2 flex-wrap">
                          <Badge color="emerald">추천</Badge>
                          <span className="font-bold">{TEMPLATES[recommendation.template].emoji} {TEMPLATES[recommendation.template].name}</span>
                        </div>
                        <p className="text-zinc-400 text-xs">💡 {recommendation.reason}</p>
                      </div>
                    ) : (
                      <p className="text-zinc-500 text-xs">⌨️ 키워드를 입력하면 어울리는 템플릿을 추천해 드려요. (추천 없으면 랜덤 선택)</p>
                    )}
                  </div>
                )}

                <Button size="lg" className="w-full" onClick={handleGenerate}>✨ 밈 생성하기</Button>
              </Card>

              {/* 내 사진 업로드 */}
              <Card className="p-5 space-y-3">
                <h2 className="text-sm font-bold text-zinc-200 flex items-center gap-2">🖼️ 내 사진으로 짤 만들기</h2>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => handleFile(e.target.files && e.target.files[0])}
                />
                <div
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
                  className="rounded-xl border-2 border-dashed border-zinc-700 hover:border-indigo-500 cursor-pointer p-4 text-center transition-colors"
                >
                  {uploadImage ? (
                    <div className="flex flex-col items-center gap-2">
                      <img src={uploadImage} alt="미리보기" className="max-h-32 rounded-lg" />
                      <span className="text-xs text-indigo-300">다른 이미지로 바꾸려면 클릭 · 위 '밈 생성하기'를 누르면 자막이 올라가요</span>
                    </div>
                  ) : (
                    <div className="text-zinc-400 text-sm py-4">
                      <div className="text-3xl mb-1">⬆️</div>
                      클릭하거나 이미지를 끌어다 놓으세요<br />
                      <span className="text-xs text-zinc-500">(JPG·PNG·GIF · 8MB 이하 · 브라우저에서만 처리)</span>
                    </div>
                  )}
                </div>
                {uploadImage && (
                  <Button variant="ghost" size="sm" className="w-full" onClick={() => { setUploadImage(null); if (activeTemplate === "UPLOAD") { setActiveTemplate(null); setTexts([]); } }}>
                    🗑️ 업로드 이미지 제거
                  </Button>
                )}
              </Card>

              {/* 텍스트 편집 영역 */}
              {activeTemplate && (
                <Card className="p-5 space-y-3">
                  <h2 className="text-sm font-bold text-zinc-200 flex items-center gap-2">✏️ 문구 직접 편집</h2>
                  <p className="text-xs text-zinc-500">{activeTplMeta.emoji} {activeTplMeta.name}</p>
                  {texts.map((t, i) => (
                    <Input
                      key={i}
                      label={activeTplMeta.slotLabels[i]}
                      value={t}
                      onChange={(e) => updateSlot(i, e.target.value)}
                      placeholder="문구 입력…"
                    />
                  ))}
                  <div className="flex gap-2 pt-1">
                    <Button variant="secondary" className="flex-1" onClick={handleRegenerate}>🔄 다시 생성</Button>
                    <Button variant="success" className="flex-1" onClick={handleDownload} disabled={downloading}>
                      {downloading ? "⏳ 생성 중…" : "⬇️ PNG 다운로드"}
                    </Button>
                  </div>
                </Card>
              )}
            </div>

            {/* 우측: 미리보기 */}
            <div className="space-y-3">
              <Card className="p-5">
                <h2 className="text-sm font-bold text-zinc-200 mb-4 flex items-center gap-2">🖼️ 미리보기</h2>
                {activeTemplate ? (
                  <>
                    <MemeCanvas templateId={activeTemplate} texts={texts} image={uploadImage} innerRef={memeRef} />
                    <p className="text-center text-[11px] text-zinc-500 mt-3">{activeTplMeta.emoji} {activeTplMeta.name}</p>
                  </>
                ) : (
                  <div className="aspect-square rounded-xl border-2 border-dashed border-zinc-700 flex flex-col items-center justify-center text-zinc-600 gap-2">
                    <span className="text-5xl">🪄</span>
                    <p className="text-sm">왼쪽에서 입력 후 <b className="text-zinc-400">밈 생성하기</b>를 눌러보세요</p>
                  </div>
                )}
              </Card>
            </div>
          </main>

          <footer className="max-w-5xl mx-auto px-4 mt-10 text-center text-xs text-zinc-600">
            <p>오프라인 동작 · 프리셋 템플릿 + 내 사진 업로드 지원 · 모든 처리는 브라우저에서 · React + Tailwind + html2canvas</p>
          </footer>
        </div>
      );
    }

    // ========================================
    // 🚀 Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
