<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QUARTER STORE — 쇼핑몰 완성판</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1><a href="/shop.html">QUARTER&nbsp;STORE</a></h1>
  <div class="row" id="authBar"></div>
</header>
<div class="wrap">
  <div class="row" style="justify-content:space-between; margin-bottom:16px;">
    <span class="muted">미니멀 홈·리빙 편집샵 — 이미지 업로드 + 결제 + 마이페이지 완성판</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <h2>🛒 장바구니</h2>
  <div class="citems" id="citems"></div>
  <div class="cfoot">
    <div class="row" style="justify-content:space-between; margin-bottom:10px;">
      <span class="muted">총 금액</span><strong id="total" style="font-size:18px;">₩0</strong>
    </div>
    <button style="width:100%" id="orderBtn" onclick="goCheckout()">주문하기</button>
  </div>
</aside>

<dialog id="authDlg">
  <strong>로그인 / 회원가입</strong>
  <p class="muted" style="margin:6px 0 0;">장바구니를 쓰려면 로그인하세요</p>
  <label>이메일</label><input id="email" type="email" />
  <label>비밀번호 (6자 이상)</label><input id="pw" type="password" />
  <label>닉네임 (가입 시)</label><input id="name" />
  <div class="err" id="authErr"></div>
  <div class="row" style="gap:8px; margin-top:6px;">
    <button onclick="login()">로그인</button>
    <button class="ghost" onclick="register()">회원가입</button>
    <button class="ghost" onclick="authDlg.close()" style="margin-left:auto;">닫기</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const won = (n) => '₩' + Number(n).toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '오류');
  return data;
};
let me = null, cartCount = 0;

async function boot() {
  const { user } = await api('/api/auth/me');
  me = user;
  let admin = false;
  if (me) { try { admin = (await api('/api/admin/me')).admin; } catch {} }
  renderAuthBar(admin);
  await renderProducts();
  if (me) await renderCart();
}

function renderAuthBar(admin) {
  if (me) {
    $('#authBar').innerHTML = `<span class="muted">${esc(me.name)} 님</span>
      ${admin ? '<a href="/admin.html"><button class="ghost sm">⚙️ 관리자</button></a>' : ''}
      <a href="/mypage.html"><button class="ghost sm">📦 마이페이지</button></a>
      <button class="ghost sm" id="cartBtn" onclick="openCart()">🛒<span class="badge" id="badge">0</span></button>
      <button class="ghost sm" onclick="logout()">로그아웃</button>`;
  } else {
    $('#authBar').innerHTML = `<button class="ghost sm" onclick="authDlg.showModal()">로그인</button>`;
  }
}

async function renderProducts() {
  const items = await api('/api/products');
  $('#grid').innerHTML = items.map((p) => `
    <div class="product">
      <img src="${p.image_url}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.opacity=.3" />
      <div class="p">
        <div class="name">${esc(p.name)}</div>
        <div class="desc">${esc(p.description)}</div>
        <div class="row" style="justify-content:space-between; margin-top:6px;">
          <span class="price">${won(p.price)}</span>
          <button class="sm" onclick="add(${p.id})">담기</button>
        </div>
      </div>
    </div>`).join('');
}

window.add = async (id) => {
  if (!me) { authDlg.showModal(); return; }
  try { const c = await api('/api/cart', { method:'POST', body: JSON.stringify({ product_id: id, quantity: 1 }) }); paint(c); openCart(); }
  catch (e) { alert(e.message); }
};

async function renderCart() { paint(await api('/api/cart')); }
function paint(c) {
  cartCount = c.count;
  const badge = $('#badge'); if (badge) badge.textContent = c.count;
  $('#total').textContent = won(c.total);
  $('#orderBtn').disabled = !c.items.length;
  $('#citems').innerHTML = c.items.length ? c.items.map((i) => `
    <div class="citem">
      <img src="${i.image_url}" />
      <div style="flex:1;">
        <div style="font-size:14px;">${esc(i.name)}</div>
        <div class="muted">${won(i.price)} · 합계 ${won(i.line_total)}</div>
        <div class="qty" style="margin-top:6px;">
          <button onclick="chg(${i.product_id},-1)">−</button>
          <span>${i.quantity}</span>
          <button onclick="chg(${i.product_id},1)">+</button>
          <button class="ghost sm" style="margin-left:8px;" onclick="rm(${i.product_id})">삭제</button>
        </div>
      </div>
    </div>`).join('') : '<p class="muted" style="padding:20px;text-align:center;">장바구니가 비었습니다</p>';
}
window.chg = async (pid, d) => { paint(await api('/api/cart/' + pid, { method:'PATCH', body: JSON.stringify({ delta: d }) })); };
window.rm = async (pid) => { paint(await api('/api/cart/' + pid, { method:'DELETE' })); };

window.goCheckout = () => { if (cartCount > 0) location.href = '/checkout.html'; };

window.openCart = () => { $('#drawer').classList.add('open'); $('#overlay').classList.add('open'); };
window.closeCart = () => { $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); };

window.register = async () => {
  try { await api('/api/auth/register', { method:'POST', body: JSON.stringify({ email:$('#email').value, password:$('#pw').value, name:$('#name').value }) }); authDlg.close(); await boot(); }
  catch (e) { $('#authErr').textContent = e.message; }
};
window.login = async () => {
  try { await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email:$('#email').value, password:$('#pw').value }) }); authDlg.close(); await boot(); }
  catch (e) { $('#authErr').textContent = e.message; }
};
window.logout = async () => { await api('/api/auth/logout', { method:'POST' }); closeCart(); await boot(); };

boot();
</script>
</body>
</html>
