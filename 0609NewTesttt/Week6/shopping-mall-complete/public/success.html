<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결제 완료 — QUARTER STORE</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1><a href="/shop.html">QUARTER&nbsp;STORE</a></h1>
</header>
<div class="wrap" style="max-width:520px; text-align:center;">
  <div class="card">
    <div id="state">
      <p style="font-size:40px; margin:8px 0;">⏳</p>
      <strong>결제 승인 중…</strong>
      <p class="muted">서버에서 금액 검증 후 토스 승인 API 를 호출하고 있습니다.</p>
    </div>
  </div>
  <div class="row" style="justify-content:center; gap:10px; margin-top:16px;">
    <a href="/mypage.html"><button>📦 마이페이지에서 주문 확인</button></a>
    <a href="/shop.html"><button class="ghost">계속 쇼핑</button></a>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const won = (n) => '₩' + Number(n).toLocaleString('ko-KR');

(async function confirm() {
  const q = new URLSearchParams(location.search);
  const paymentKey = q.get('paymentKey');
  const orderId = q.get('orderId');
  const amount = q.get('amount');
  try {
    const r = await fetch('/api/payments/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || '승인 실패');
    $('#state').innerHTML = `
      <p style="font-size:40px; margin:8px 0;">✅</p>
      <strong class="ok" style="font-size:18px;">결제가 완료되었습니다</strong>
      <p class="muted" style="margin:10px 0 0;">
        주문번호 <b>${(orderId || '').replace('order_','').slice(0,8)}</b><br/>
        결제수단 ${data.method || '-'} · 금액 ${won(amount)}<br/>
        ${data.alreadyPaid ? '(이미 승인된 주문입니다)' : `승인시각 ${data.approvedAt ? new Date(data.approvedAt).toLocaleString('ko-KR') : '-'}`}
      </p>`;
  } catch (e) {
    $('#state').innerHTML = `
      <p style="font-size:40px; margin:8px 0;">❌</p>
      <strong style="color:#ff6b6b;">결제 승인에 실패했습니다</strong>
      <p class="muted">${e.message}</p>`;
  }
})();
</script>
</body>
</html>
