    function parseHashQuery() {
      const params = new URLSearchParams();
      const search = new URLSearchParams(window.location.search);
      search.forEach((v, k) => params.set(k, v));
      const hash = window.location.hash; // 예: "#/payments/success?paymentType=NORMAL"
      const qi = hash.indexOf('?');

    const CartContext = createContext(null);

    function cartReducer(state, action) {
      switch (action.type) {
        case 'ADD': {
          const key = action.item.key;
          const exist = state.find((l) => l.key === key);
          if (exist) {
            return state.map((l) => l.key === key ? { ...l, qty: l.qty + action.item.qty } : l);
          }
          return [...state, action.item];
        }
        case 'QTY': {
          return state
            .map((l) => l.key === action.key ? { ...l, qty: Math.max(1, l.qty + action.delta) } : l);
        }
        case 'SET_QTY': {
          const q = parseInt(action.value, 10);
          if (!q || q < 1) return state;
          return state.map((l) => l.key === action.key ? { ...l, qty: q } : l);
        }
        case 'REMOVE':
          return state.filter((l) => l.key !== action.key);
        case 'CLEAR':
          return [];
        default:
          return state;
      }
    }

    function CartProvider({ children }) {
      const [items, dispatch] = useReducer(cartReducer, [], () => {
        try { return JSON.parse(localStorage.getItem('bean_cart_v2') || '[]'); }
        catch (e) { return []; }
      });
      const [drawerOpen, setDrawerOpen] = useState(false);

      useEffect(() => {
        try { localStorage.setItem('bean_cart_v2', JSON.stringify(items)); } catch (e) {}
      }, [items]);

      const totalQty = useMemo(() => items.reduce((s, l) => s + l.qty, 0), [items]);
      const totalPrice = useMemo(() => items.reduce((s, l) => s + l.price * l.qty, 0), [items]);

      const addItem = useCallback((bean, weight, qty = 1) => {
        const key = bean.id + '-' + weight.g;
        dispatch({ type: 'ADD', item: {
          key, id: bean.id, name: bean.name, country: bean.country, en: bean.en,
          roast: bean.roast, grad: bean.grad, weightLabel: weight.label,
          price: priceFor(bean.basePrice, weight.mult), qty,
        }});
      }, []);

      const value = { items, dispatch, totalQty, totalPrice, addItem, drawerOpen, setDrawerOpen };
      return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
    }
    const useCart = () => useContext(CartContext);

      const refresh = useCallback(async () => {
        try {
          const cfg = await fetch('/api/config', { credentials: 'include' })
            .then((r) => r.json()).catch(() => ({ authEnabled: false, imagekitEnabled: false }));
          setBackend(cfg);
          const res = await fetch('/api/me', { credentials: 'include' });
          if (res.ok) { const d = await res.json(); setUser(d.user); setProfile(d.profile); }
          else { setUser(null); setProfile(null); }
        } catch (e) {
          setUser(null); setProfile(null);
        } finally { setAuthReady(true); }
      }, []);
      useEffect(() => { refresh(); }, [refresh]);

      const authCall = async (path, body) => {
        const res = await fetch(path, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || '요청에 실패했어요.');
        return data;
      };
      const signup = async (email, password) => { await authCall('/api/auth/signup', { email, password }); await refresh(); };
      const login = async (email, password) => { await authCall('/api/auth/login', { email, password }); await refresh(); };
      const logout = async () => {
        try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
        setUser(null); setProfile(null);
      };
      const setAvatar = async (avatarUrl) => {
        const d = await authCall('/api/me/avatar', { avatarUrl });
        setProfile(d.profile);
      };

      const value = { user, profile, authReady, backend, loginOpen, setLoginOpen, signup, login, logout, setAvatar, refresh };
      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    const useAuth = () => useContext(AuthContext);

    // ImageKit 아바타 업로드: 서버에서 서명 받아 브라우저가 직접 ImageKit에 업로드
    async function uploadAvatarToImageKit(file, userId) {
      // 1) 서버에서 인증 파라미터(token/expire/signature) + publicKey 수령
      const authRes = await fetch('/api/imagekit-auth', { credentials: 'include' });
      const auth = await authRes.json().catch(() => ({}));
      if (!authRes.ok) throw new Error(auth.message || 'ImageKit 인증 파라미터를 받지 못했어요.');

      // 2) ImageKit 업로드 API에 직접 multipart POST (private 키는 서버에만 있음)
      const ext = (file.name.split('.').pop() || 'png').toLowerCase();
      const fd = new FormData();
      fd.append('file', file);
      fd.append('fileName', `avatar_${userId}_${Date.now()}.${ext}`);
      fd.append('publicKey', auth.publicKey);
      fd.append('signature', auth.signature);
      fd.append('token', auth.token);
      fd.append('expire', auth.expire);
      fd.append('folder', '/bean-shop-avatars');
      fd.append('useUniqueFileName', 'true');
      const up = await fetch('https://upload.imagekit.io/api/v1/files/upload', { method: 'POST', body: fd });
      const data = await up.json().catch(() => ({}));
      if (!up.ok) throw new Error(data.message || 'ImageKit 업로드에 실패했어요.');
      return data.url; // 저장·표시에 쓰는 최종 이미지 URL
    }

      }, []);
      const navigate = useCallback((to) => {
        window.location.hash = to;
        window.scrollTo({ top: 0 });
      }, []);
      return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
    }

      return (

          <div className="absolute inset-0 bg-ink-950/80 backdrop-blur-sm animate-fade" onClick={() => setDrawerOpen(false)}></div>
          <aside className="absolute right-0 top-0 h-full w-full max-w-md bg-ink-900 border-l border-ink-600 shadow-2xl flex flex-col animate-slide">
            <div className="flex items-center justify-between px-5 h-16 border-b border-ink-700 shrink-0">
              <h2 className="font-mono text-xs uppercase tracking-[0.3em] text-paper">Cart / 장바구니</h2>
              <button onClick={() => setDrawerOpen(false)} aria-label="닫기" className="p-2 border border-transparent hover:border-ink-600 text-paper">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
              </button>
            </div>

            {items.length === 0 ? (
              <div className="flex-1 flex flex-col items-center justify-center text-center px-6">
                <Spark className="w-14 h-14 mb-5 opacity-40" fill="#EB5A1E" />
                <p className="font-serif text-paper font-bold">장바구니가 비어있어요</p>
                <p className="text-sm text-paper-dim mt-1">마음에 드는 싱글오리진 원두를 담아보세요.</p>
                <Button className="mt-6" onClick={() => setDrawerOpen(false)}>원두 보러가기</Button>
              </div>
            ) : (
              <>
                <div className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
                  {items.map((l) => (
                    <div key={l.key} className="flex gap-3 bg-ink-950 border border-ink-700 p-3">
                      <div className="relative w-16 h-16 shrink-0 overflow-hidden border border-ink-700">
                        <div className="absolute inset-0" style={{ background: l.grad }}></div>
                        <div className="grain-layer"></div>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <div className="font-serif font-bold text-paper text-sm truncate">{l.name}</div>
                            <div className="font-mono text-[10px] uppercase tracking-[0.08em] text-paper-dim mt-0.5">{l.en || l.country} · {l.weightLabel} · {ROAST_META[l.roast].label}</div>
                          </div>
                          <button onClick={() => dispatch({ type: 'REMOVE', key: l.key })} aria-label="삭제"
                            className="text-paper-faint hover:text-flame shrink-0">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                          </button>
                        </div>
                        <div className="mt-2 flex items-center justify-between">
                          <div className="inline-flex items-center border border-ink-600">
                            <button onClick={() => dispatch({ type: 'QTY', key: l.key, delta: -1 })} className="w-7 h-7 hover:bg-ink-800 text-paper text-sm font-mono" aria-label="수량 감소">−</button>
                            <span className="w-8 text-center text-sm font-mono text-paper">{l.qty}</span>
                            <button onClick={() => dispatch({ type: 'QTY', key: l.key, delta: 1 })} className="w-7 h-7 hover:bg-ink-800 text-paper text-sm font-mono" aria-label="수량 증가">+</button>
                          </div>
                          <div className="font-serif font-bold text-paper text-sm">{won(l.price * l.qty)}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                  <button onClick={() => dispatch({ type: 'CLEAR' })} className="font-mono text-[10px] uppercase tracking-[0.15em] text-paper-faint hover:text-flame underline underline-offset-4">전체 비우기</button>
                </div>

                <div className="border-t border-ink-700 p-5 shrink-0 bg-ink-950">
                  <div className="flex justify-between font-mono text-xs text-paper-dim mb-1.5"><span>상품 금액</span><span>{won(totalPrice)}</span></div>
                  <div className="flex justify-between font-mono text-xs text-paper-dim mb-2">
                    <span>배송비</span><span>{shipping === 0 ? '무료' : won(shipping)}</span>
                  </div>
                  {shipping > 0 && (
                    <div className="font-mono text-[10px] text-flame mb-2">{won(30000 - totalPrice)} 더 담으면 무료배송</div>
                  )}
                  <div className="flex justify-between items-baseline pt-3 border-t border-ink-700">
                    <span className="font-mono text-[10px] uppercase tracking-[0.25em] text-paper-faint">결제 예정</span>
                    <span className="font-serif font-black text-flame text-xl">{won(totalPrice + shipping)}</span>
                  </div>
                  <Button size="lg" className="w-full mt-4" onClick={() => { setDrawerOpen(false); navigate('/checkout'); }}>
                    결제하기
                  </Button>
                </div>
              </>
            )}
          </aside>
        </div>
      );
    }

    // ========================================
    // 📄 결제 페이지 (/#/checkout) — 배송정보 + 토스 결제위젯
    //  위젯은 페이지 마운트당 1회만 렌더(renderedRef 가드), 금액 변경은 setAmount로만.
    // ========================================
    function CheckoutPage() {
      const { items, totalPrice } = useCart();
      const { navigate } = useRouter();
      const [form, setForm] = useState({ name: '', phone: '', address: '', memo: '' });
      const [errMsg, setErrMsg] = useState('');
      const [ready, setReady] = useState(false);   // 위젯 렌더 완료
      const [paying, setPaying] = useState(false);  // 결제창 호출 중
      const widgetsRef = useRef(null);
      const renderedRef = useRef(false);

      const shipping = totalPrice >= 30000 || totalPrice === 0 ? 0 : 3000;
      const amount = totalPrice + shipping;
      const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
      const inputCls = 'w-full bg-ink-950 border border-ink-600 px-3 py-2.5 text-sm text-paper placeholder:text-paper-faint focus:outline-none focus:border-flame transition';

      // 위젯 초기화 — 마운트당 1회
      useEffect(() => {
        if (items.length === 0) return;
        if (typeof TossPayments === 'undefined') {
          setErrMsg('토스 SDK를 불러오지 못했습니다. 네트워크를 확인하고 새로고침 해주세요.');
          return;
        }
        let cancelled = false;
        (async () => {
          try {
            const tossPayments = TossPayments(TOSS_CLIENT_KEY);
            const widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS }); // 비회원 결제
            widgetsRef.current = widgets;
            await widgets.setAmount({ currency: 'KRW', value: amount });
            if (!renderedRef.current) {
              await Promise.all([
                widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
                widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
              ]);
              renderedRef.current = true;
            }
            if (!cancelled) setReady(true);
          } catch (e) {
            if (!cancelled) setErrMsg('결제 위젯을 불러오지 못했어요: ' + (e && e.message ? e.message : e));
          }
        })();
        return () => { cancelled = true; };
      }, []);

      // 페이지에 머무는 동안 수량이 바뀌면 금액만 갱신 (재렌더 금지)
      useEffect(() => {
        if (widgetsRef.current && renderedRef.current) {
          widgetsRef.current.setAmount({ currency: 'KRW', value: amount });
        }
      }, [amount]);

      const handlePay = async () => {
        if (!form.name.trim() || !form.phone.trim() || !form.address.trim()) {
          setErrMsg('이름 · 연락처 · 주소를 모두 입력해주세요.');
          return;
        }
        if (!widgetsRef.current) { setErrMsg('결제 위젯이 아직 준비되지 않았어요.'); return; }
        setErrMsg('');
        setPaying(true);
        const orderId = 'bean_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const orderName = items.length === 1 ? items[0].name : `${items[0].name} 외 ${items.length - 1}건`;
        const trimmed = {
          name: form.name.trim(), phone: form.phone.trim(),
          address: form.address.trim(), memo: form.memo.trim(),
        };
        // /api는 server.js가 서빙하는 오리진에서만 존재 → 다른 오리진(Live Server 등)/file://이면 진단 메시지
        const onApiServer = window.location.protocol.startsWith('http') && window.location.port === '3000';
        const wrongOriginMsg = `이 앱은 결제 서버(server.js)가 서빙하는 http://localhost:3000 에서 열어야 합니다. `
          + `지금은 ${window.location.origin || 'file://'} 에서 열려 있어요. `
          + `터미널에서 "npm start" 실행 후 http://localhost:3000 으로 접속하세요.`;
        try {
          // 1) 서버에 기대 금액 등록 (승인 시 금액 위변조 검증용)
          let res;
          try {
            res = await fetch('/api/orders', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ orderId, amount, orderName }),
            });
          } catch (netErr) {
            // fetch 자체 실패(연결 거부/CORS) — 대개 오리진이 틀렸거나 서버 미실행
            throw new Error('결제 서버에 연결할 수 없어요. ' + (onApiServer ? '서버(server.js)가 켜져 있는지 확인하세요.' : wrongOriginMsg));
          }
          if (!res.ok) throw new Error(`주문 등록 실패 (HTTP ${res.status}). ` + (onApiServer ? '서버 로그를 확인하세요.' : wrongOriginMsg));
          // 2) 리다이렉트 브리지: 성공 페이지에서 DB 저장/표시에 쓸 정보 보관
          localStorage.setItem('bean_pending_order', JSON.stringify({
            orderId, amount, orderName, form: trimmed, items, shipping, totalPrice,
          }));
          // 3) 결제창 호출 (v2: 금액은 setAmount에서 옴 — requestPayment엔 넣지 않음)
          await widgetsRef.current.requestPayment({
            orderId, orderName,
            successUrl: `${window.location.origin}/#/payments/success`,
            failUrl: `${window.location.origin}/#/payments/fail`,
            customerName: trimmed.name,
            customerMobilePhone: trimmed.phone.replace(/[^0-9]/g, ''),
          });
        } catch (err) {
          setPaying(false);
          if (err && err.code === 'USER_CANCEL') setErrMsg('결제를 취소했어요.');
          else setErrMsg('결제 요청 중 오류: ' + (err && (err.message || err.code) ? (err.message || err.code) : err));
        }
      };

      if (items.length === 0) {
        return (
          <section className="max-w-2xl mx-auto px-4 py-24 text-center">
            <Spark className="w-14 h-14 mx-auto mb-6 opacity-40" fill="#EB5A1E" />
            <h2 className="font-serif text-2xl font-black text-paper">장바구니가 비어있어요</h2>
            <p className="text-sm text-paper-dim mt-2">결제할 원두를 먼저 담아주세요.</p>
            <div className="mt-6"><Button onClick={() => navigate('/beans')}>원두 보러가기</Button></div>
          </section>
        );
      }

      return (
        <section className="max-w-5xl mx-auto px-4 py-12">
          <div className="mb-8">
            <div className="font-mono text-[10px] uppercase tracking-[0.3em] text-flame mb-2">Checkout / 결제</div>
            <h2 className="font-serif text-3xl md:text-4xl font-black text-paper">주문 · 결제</h2>
            <button onClick={() => navigate('/beans')} className="mt-3 font-mono text-[11px] uppercase tracking-[0.2em] text-paper-dim hover:text-flame">← 쇼핑 계속하기</button>
          </div>

          <div className="grid gap-8 lg:grid-cols-5">
            {/* 좌: 배송정보 + 결제수단 */}
            <div className="lg:col-span-3 space-y-8">
              <Card className="relative p-6 md:p-7">
                <RegMarks />
                <div className="font-mono text-[10px] uppercase tracking-[0.25em] text-flame mb-4">Shipping / 배송 정보</div>
                <div className="space-y-3">
                  <div>
                    <label htmlFor="co-name" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Name / 이름 *</label>
                    <input id="co-name" className={inputCls} value={form.name} onChange={set('name')} placeholder="홍길동" />
                  </div>
                  <div>
                    <label htmlFor="co-phone" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Phone / 연락처 *</label>
                    <input id="co-phone" className={inputCls} value={form.phone} onChange={set('phone')} placeholder="010-0000-0000" />
                  </div>
                  <div>
                    <label htmlFor="co-addr" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Address / 주소 *</label>
                    <input id="co-addr" className={inputCls} value={form.address} onChange={set('address')} placeholder="서울시 ..." />
                  </div>
                  <div>
                    <label htmlFor="co-memo" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Memo / 요청사항</label>
                    <input id="co-memo" className={inputCls} value={form.memo} onChange={set('memo')} placeholder="분쇄도, 배송 메모 등 (선택)" />
                  </div>
                </div>
              </Card>

              <Card className="relative p-6 md:p-7">
                <RegMarks />
                <div className="font-mono text-[10px] uppercase tracking-[0.25em] text-flame mb-4">Payment / 결제 수단</div>
                {/* 토스 결제위젯이 렌더되는 영역 */}
                <div id="payment-method"></div>
                <div id="agreement" className="mt-2"></div>
                {!ready && !errMsg && (
                  <div className="py-8 text-center font-mono text-[11px] uppercase tracking-[0.25em] text-paper-dim animate-pulse">Loading widget…</div>
                )}
              </Card>
            </div>

            {/* 우: 주문 요약 + 결제 버튼 */}
            <div className="lg:col-span-2">
              <Card className="relative p-6 md:p-7 lg:sticky lg:top-24">
                <RegMarks />
                <div className="font-mono text-[10px] uppercase tracking-[0.25em] text-flame mb-4">Order / 주문 요약</div>
                <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                  {items.map((l) => (
                    <div key={l.key} className="flex gap-3 items-center">
                      <div className="relative w-12 h-12 shrink-0 overflow-hidden border border-ink-700">
                        <div className="absolute inset-0" style={{ background: l.grad }}></div>
                        <div className="grain-layer"></div>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="font-serif font-bold text-paper text-sm truncate">{l.name}</div>
                        <div className="font-mono text-[10px] uppercase tracking-[0.08em] text-paper-dim mt-0.5">{l.weightLabel} · {l.qty}개</div>
                      </div>
                      <div className="font-serif font-bold text-paper text-sm shrink-0">{won(l.price * l.qty)}</div>
                    </div>
                  ))}
                </div>
                <div className="mt-5 border-t border-ink-700 pt-4 space-y-1.5">
                  <div className="flex justify-between font-mono text-xs text-paper-dim"><span>상품 금액</span><span>{won(totalPrice)}</span></div>
                  <div className="flex justify-between font-mono text-xs text-paper-dim"><span>배송비</span><span>{shipping === 0 ? '무료' : won(shipping)}</span></div>
                  {shipping > 0 && (
                    <div className="font-mono text-[10px] text-flame">{won(30000 - totalPrice)} 더 담으면 무료배송</div>
                  )}
                  <div className="flex justify-between items-baseline pt-3 border-t border-ink-700">
                    <span className="font-mono text-[10px] uppercase tracking-[0.25em] text-paper-faint">결제 금액</span>
                    <span className="font-serif font-black text-flame text-xl">{won(amount)}</span>
                  </div>
                </div>

                {errMsg && (
                  <div className="mt-4 border border-flame/40 bg-flame/10 px-3 py-2.5 font-mono text-[11px] text-flame leading-relaxed">{errMsg}</div>
                )}

                <Button size="lg" className="w-full mt-5" onClick={handlePay} disabled={paying || !ready}>
                  {paying ? '결제창 여는 중…' : `${won(amount)} 결제하기`}
                </Button>
                <p className="mt-3 font-mono text-[9px] uppercase tracking-[0.15em] text-paper-faint text-center leading-relaxed">
                  테스트 결제 — 실제 청구 없음<br/>카드 아무 16자리 · 미래 만료월 · CVC 3자리
                </p>
              </Card>
            </div>
          </div>
        </section>
      );
    }

    // ========================================
    // 📄 결제 성공 (/#/payments/success) — 서버 승인 호출 → 결과 표시 → 장바구니 비우기
    // ========================================
    function PaymentSuccessPage() {
      const { dispatch } = useCart();
      const { navigate } = useRouter();
      const [phase, setPhase] = useState('confirming'); // confirming | success | error
      const [info, setInfo] = useState(null);
      const [errMsg, setErrMsg] = useState('');
      const ranRef = useRef(false);

      useEffect(() => {
        if (ranRef.current) return; // 재실행/재confirm 방지
        ranRef.current = true;
        const q = parseHashQuery();
        const paymentKey = q.get('paymentKey');
        const orderId = q.get('orderId');
        const amount = q.get('amount');
        if (!paymentKey || !orderId || !amount) {
          setPhase('error');
          setErrMsg('결제 정보가 올바르지 않습니다. (paymentKey / orderId / amount 누락)');
          return;
        }
        (async () => {
          let data = {};
          let ok = false;
          try {
            const res = await fetch('/api/confirm', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
            });
            data = await res.json();
            ok = res.ok || data.code === 'ALREADY_PROCESSED_PAYMENT';
          } catch (e) {
            setPhase('error');
            setErrMsg('승인 요청 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
            return;
          }
          // 새로고침 재confirm 방지 — location.search의 민감 파라미터 제거
          window.history.replaceState({}, '', window.location.pathname + window.location.hash);
          if (ok) {
            try { await savePendingOrderToDb(); } catch (e) {}
            dispatch({ type: 'CLEAR' });
            localStorage.removeItem('bean_pending_order');
            setInfo({
              orderId,
              amount: Number(amount),
              method: data.method || null,
              approvedAt: data.approvedAt || null,
              already: data.code === 'ALREADY_PROCESSED_PAYMENT',
            });
            setPhase('success');
          } else {
            setPhase('error');
            setErrMsg(`${data.code || 'CONFIRM_FAILED'} — ${data.message || '결제 승인에 실패했습니다.'}`);
          }
        })();
      }, []);

      if (phase === 'confirming') {
        return (
          <section className="max-w-lg mx-auto px-4 py-28 text-center">
            <Spark className="w-12 h-12 mx-auto mb-6 opacity-60 animate-pulse" fill="#EB5A1E" />
            <div className="font-mono text-[11px] uppercase tracking-[0.3em] text-paper-dim">Confirming / 결제를 승인하는 중…</div>
          </section>
        );
      }

      if (phase === 'error') {
        return (
          <section className="max-w-lg mx-auto px-4 py-20 text-center">
            <Card className="relative p-10">
              <RegMarks />
              <div className="font-mono text-[10px] uppercase tracking-[0.3em] text-flame mb-3">Confirm failed</div>
              <h2 className="font-serif text-2xl font-black text-paper">결제 승인에 실패했어요</h2>
              <div className="mt-5 border border-flame/40 bg-flame/10 px-4 py-3 font-mono text-[11px] text-flame leading-relaxed break-words">{errMsg}</div>
              <div className="mt-7 flex gap-2 justify-center">
                <Button variant="outline" onClick={() => navigate('/checkout')}>다시 결제하기</Button>
                <Button variant="ghost" onClick={() => navigate('/beans')}>원두 목록</Button>
              </div>
            </Card>
          </section>
        );
      }

      // success
      return (
        <section className="max-w-lg mx-auto px-4 py-20 text-center">
          <Card className="relative p-10">
            <RegMarks />
            <Spark className="w-12 h-12 mx-auto mb-6" fill="#EB5A1E" />
            <div className="font-mono text-[10px] uppercase tracking-[0.3em] text-flame mb-3">
              {info.already ? 'Already confirmed' : 'Payment confirmed'}
            </div>
            <h2 className="font-serif text-2xl font-black text-paper">결제가 완료되었습니다</h2>
            <div className="mt-6 border-t border-ink-700 pt-5 space-y-2 text-left">

    // ========================================
    // 📄 로그인 / 회원가입 모달 (서버 자체 인증)
    // ========================================
    function LoginModal() {
      const { loginOpen, setLoginOpen, login, signup, backend, authReady } = useAuth();
      const [mode, setMode] = useState('login'); // login | signup
      const [form, setForm] = useState({ email: '', password: '' });
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      useEffect(() => { if (loginOpen) { setForm({ email: '', password: '' }); setErr(''); setMode('login'); } }, [loginOpen]);
      if (!loginOpen) return null;
      const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
      const authDisabled = !backend.authEnabled;
      const submit = async (e) => {
        e.preventDefault();
        if (authDisabled) return;
        if (!form.email.trim() || !form.password) { setErr('이메일과 비밀번호를 입력해주세요.'); return; }
        if (form.password.length < 6) { setErr('비밀번호는 6자 이상이어야 해요.'); return; }
        setErr(''); setBusy(true);
        try {
          if (mode === 'signup') await signup(form.email.trim(), form.password);
          else await login(form.email.trim(), form.password);
          setLoginOpen(false);
        } catch (e2) { setErr(e2.message || '실패했어요.'); }
        finally { setBusy(false); }
      };
      const inputCls = 'w-full bg-ink-950 border border-ink-600 px-3 py-2.5 text-sm text-paper placeholder:text-paper-faint focus:outline-none focus:border-flame transition disabled:opacity-40';
      return (
        <Modal isOpen={loginOpen} onClose={() => setLoginOpen(false)} size="md">
          <form onSubmit={submit} className="relative p-7 md:p-8">
            <RegMarks />
            <div className="font-mono text-[10px] uppercase tracking-[0.3em] text-flame mb-2">{mode === 'signup' ? 'Sign up / 회원가입' : 'Sign in / 로그인'}</div>
            <h2 className="font-serif text-2xl font-black text-paper">{mode === 'signup' ? '계정 만들기' : '로그인'}</h2>

            {authDisabled && (
              <div className="mt-4"><ConfigBanner>인증 백엔드 미설정 (서버 <span className="underline">DATABASE_URL</span> 없음) — 로그인이 비활성화되어 있어요. 쇼핑·결제는 정상 이용 가능합니다.</ConfigBanner></div>
            )}

            <div className="mt-6 space-y-3">
              <div>
                <label htmlFor="au-email" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Email / 이메일</label>
                <input id="au-email" type="email" autoComplete="email" className={inputCls} value={form.email} onChange={set('email')} placeholder="you@example.com" disabled={authDisabled} />
              </div>
              <div>
                <label htmlFor="au-pw" className="block font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint mb-1.5">Password / 비밀번호</label>
                <input id="au-pw" type="password" autoComplete={mode === 'signup' ? 'new-password' : 'current-password'} className={inputCls} value={form.password} onChange={set('password')} placeholder="6자 이상" disabled={authDisabled} />
              </div>
            </div>

            {err && <div className="mt-4 border border-flame/40 bg-flame/10 px-3 py-2.5 font-mono text-[11px] text-flame">{err}</div>}

            <Button type="submit" size="lg" className="w-full mt-6" disabled={busy || authDisabled || !authReady}>
              {busy ? '처리 중…' : (mode === 'signup' ? '가입하고 시작하기' : '로그인')}
            </Button>
            <button type="button" onClick={() => { setErr(''); setMode(mode === 'signup' ? 'login' : 'signup'); }}
              className="mt-4 w-full text-center font-mono text-[10px] uppercase tracking-[0.15em] text-paper-dim hover:text-flame">
              {mode === 'signup' ? '이미 계정이 있어요 → 로그인' : '계정이 없어요 → 회원가입'}
            </button>
          </form>
        </Modal>
      );
    }

        return <img src={tr} alt="프로필 사진" className={`${size} object-cover border border-ink-600`} />;

      const initial = (email || '?').trim().charAt(0).toUpperCase();
      return (
        <div className={`${size} border border-ink-600 bg-ink-800 flex items-center justify-center font-serif font-black text-flame ${text}`}>{initial}</div>

      const { navigate } = useRouter();
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [ok, setOk] = useState('');
      const fileRef = useRef(null);

      const onPick = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (fileRef.current) fileRef.current.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) { setErr('이미지 파일만 올릴 수 있어요.'); return; }
        if (file.size > 5 * 1024 * 1024) { setErr('5MB 이하 이미지만 올릴 수 있어요.'); return; }
        setErr(''); setOk(''); setBusy(true);
        try {
          const url = await uploadAvatarToImageKit(file, user.id);  // 실제 ImageKit 업로드
          await setAvatar(url);                                      // avatar_url 서버 DB 저장
          setOk('프로필 사진이 변경되었어요.');
        } catch (e2) { setErr(e2.message || '업로드에 실패했어요.'); }
        finally { setBusy(false); }
      };

      if (!authReady) {
        return (
          <section className="max-w-lg mx-auto px-4 py-28 text-center">
            <Spark className="w-10 h-10 mx-auto mb-5 opacity-50 animate-pulse" fill="#EB5A1E" />
            <div className="font-mono text-[11px] uppercase tracking-[0.3em] text-paper-dim">Loading / 계정 확인 중</div>
          </section>
        );
      }

      return (
        <section className="max-w-lg mx-auto px-4 py-14">
          <div className="mb-8">
            <div className="font-mono text-[10px] uppercase tracking-[0.3em] text-flame mb-2">Account / 마이페이지</div>
            <h2 className="font-serif text-3xl font-black text-paper">내 프로필</h2>
          </div>

          {!backend.authEnabled && (
            <div className="mb-6"><ConfigBanner>인증 백엔드 미설정 (서버 <span className="underline">DATABASE_URL</span> 없음). .env에 접속 문자열을 넣고 서버를 재시작하면 로그인·프로필이 활성화됩니다.</ConfigBanner></div>
          )}

          {!user ? (
            <Card className="relative p-8 text-center">
              <RegMarks />
              <Avatar url={null} email={null} size="w-20 h-20 mx-auto" />
              <p className="mt-5 font-serif text-paper font-bold">로그인이 필요해요</p>
              <p className="text-sm text-paper-dim mt-1">로그인하면 프로필 사진을 등록/변경할 수 있어요.</p>
              <Button className="mt-6" disabled={!backend.authEnabled} onClick={() => setLoginOpen(true)}>로그인 / 회원가입</Button>
            </Card>
          ) : (
            <Card className="relative p-8">
              <RegMarks />
              <div className="flex items-center gap-5">
                <Avatar url={profile && profile.avatar_url} email={user.email} size="w-24 h-24" />
                <div className="min-w-0">
                  <div className="font-mono text-[10px] uppercase tracking-[0.2em] text-paper-faint">Signed in</div>
                  <div className="font-serif font-bold text-paper text-lg truncate">{user.email}</div>
                  <button onClick={async () => { await logout(); setOk(''); }} className="mt-2 font-mono text-[10px] uppercase tracking-[0.15em] text-paper-dim hover:text-flame underline underline-offset-4">로그아웃</button>
                </div>
              </div>

              {!backend.imagekitEnabled && (
                <div className="mt-6"><ConfigBanner>ImageKit 키 미설정 (서버 <span className="underline">IMAGEKIT_PRIVATE_KEY</span> 없음) — 사진 업로드가 비활성화되어 있어요.</ConfigBanner></div>
              )}

              <div className="mt-6">
                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onPick} disabled={busy || !backend.imagekitEnabled} />
                <Button size="lg" className="w-full" disabled={busy || !backend.imagekitEnabled}
                  onClick={() => fileRef.current && fileRef.current.click()}>
                  {busy ? '업로드 중…' : (profile && profile.avatar_url ? '프로필 사진 변경' : '프로필 사진 등록')}
                </Button>
                <p className="mt-3 font-mono text-[9px] uppercase tracking-[0.15em] text-paper-faint text-center">JPG · PNG · WEBP / 5MB 이하 · ImageKit 업로드</p>
              </div>

              {err && <div className="mt-4 border border-flame/40 bg-flame/10 px-3 py-2.5 font-mono text-[11px] text-flame break-words">{err}</div>}
              {ok && <div className="mt-4 border border-flame/40 bg-flame/10 px-3 py-2.5 font-mono text-[11px] text-flame">{ok}</div>}
            </Card>
          )}

          <div className="text-center mt-8">
            <Button variant="ghost" onClick={() => navigate('/beans')}>← 원두 보러가기</Button>
          </div>
        </section>
      );
    }

    // ========================================
    // 📄 라우팅 뷰
    // ========================================
    function Routes({ beans, onOpen }) {
      const { path } = useRouter();
      // 결제 리다이렉트 시 hash에 쿼리가 붙으므로(/payments/success?paymentType=…) 매칭 전 제거
      const route = path.split('?')[0];
      if (route === '/' ) {
        return <><Hero /><BeansPage beans={beans} onOpen={onOpen} /></>;
      }
      if (route === '/beans') return <BeansPage beans={beans} onOpen={onOpen} />;
      if (route === '/subscribe') return <SubscribePage />;
      if (route === '/story') return <StoryPage />;
      if (route === '/checkout') return <CheckoutPage />;
      if (route === '/payments/success') return <PaymentSuccessPage />;
      if (route === '/payments/fail') return <PaymentFailPage />;
      if (route === '/account') return <AccountPage />;
      return (
        <div className="max-w-6xl mx-auto px-4 py-24 text-center">
          <Spark className="w-14 h-14 mx-auto mb-6 opacity-40" fill="#EB5A1E" />
          <h2 className="font-serif text-xl font-bold text-paper">페이지를 찾을 수 없어요</h2>
          <Link to="/" className="inline-block mt-4 font-mono text-xs uppercase tracking-[0.2em] text-flame underline underline-offset-4">홈으로 돌아가기</Link>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [detailBean, setDetailBean] = useState(null);
      const [detailOpen, setDetailOpen] = useState(false);
      const [beans, setBeans] = useState(null);          // null = 로딩 중
      const [dataSource, setDataSource] = useState('loading'); // db | fallback
      const openDetail = useCallback((b) => { setDetailBean(b); setDetailOpen(true); }, []);

      // 원두 목록: Supabase → 실패 시 내장 폴백
      useEffect(() => {
        let cancelled = false;
        (async () => {
          if (!db) { setBeans(FALLBACK_BEANS); setDataSource('fallback'); return; }
          try {
            const { data, error } = await db.from('beans')
              .select('*').eq('sold_out', false).order('sort_order');
            if (error || !data || data.length === 0) throw error || new Error('empty');
            if (!cancelled) { setBeans(data.map(mapBean)); setDataSource('db'); }
          } catch (e) {
            if (!cancelled) { setBeans(FALLBACK_BEANS); setDataSource('fallback'); }
          }
        })();
        return () => { cancelled = true; };
      }, []);

      return (
        <Router>
          <AuthProvider>
            <CartProvider>
              <div className="min-h-screen flex flex-col">
                <Header />
                <main className="flex-1">
                  <Routes beans={beans} onOpen={openDetail} />
                </main>
                <Footer dataSource={dataSource} />
                <CartDrawer />
                <BeanDetailModal bean={detailBean} isOpen={detailOpen} onClose={() => setDetailOpen(false)} />
                <LoginModal />
              </div>
            </CartProvider>
          </AuthProvider>
        </Router>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
