        story: '스페셜티의 정점, 파나마 게이샤. 향수를 뿌린 듯한 플로럴 아로마와 티 같은 섬세함으로 압도합니다.',

      },

        roast: 'medium', basePrice: 12000, notes: ['카카오', '레드애플', '브라운슈거'],
        altitude: '1,300~1,500m', process: '워시드', variety: 'Caturra', brew: '핸드드립 · 프렌치프레스',

        story: '부드러운 바디와 은은한 사과 산미. 초심자도 편하게 즐길 수 있는 균형 잡힌 중미 커피입니다.',
      },
      {
        id: 'sumatra', name: '만델링 링통', country: '인도네시아', flag: '🇮🇩',

        altitude: '1,200~1,500m', process: '길링바사(웻헐드)', variety: 'Ateng', brew: '에스프레소 · 프렌치프레스',
        grad: 'linear-gradient(135deg,#4b3826,#1f130c)',
        story: '웻헐드 가공 특유의 묵직하고 흙내음 나는 바디. 낮은 산미와 스파이시한 여운의 인도네시아 대표 커피.',
      },
    ];

    // ========================================
    // 장바구니 Context + Reducer
    // ========================================
    const CartContext = createContext(null);

    function cartReducer(state, action) {
      switch (action.type) {
        case 'ADD': {
          const key = action.item.key;
          const exist = state.find((l) => l.key === key);
          if (exist) {
            return state.map((l) => l.key === key ? { ...l, qty: l.qty + action.item.qty } : l);
          }
          return [...state, action.item];
        }
        case 'QTY': {
          return state
            .map((l) => l.key === action.key ? { ...l, qty: Math.max(1, l.qty + action.delta) } : l);
        }
        case 'SET_QTY': {
          const q = parseInt(action.value, 10);
          if (!q || q < 1) return state;
          return state.map((l) => l.key === action.key ? { ...l, qty: q } : l);
        }
        case 'REMOVE':
          return state.filter((l) => l.key !== action.key);
        case 'CLEAR':
          return [];
        default:
          return state;
      }
    }

    function CartProvider({ children }) {
      const [items, dispatch] = useReducer(cartReducer, [], () => {
        try { return JSON.parse(localStorage.getItem('bean_cart') || '[]'); }
        catch (e) { return []; }
      });
      const [drawerOpen, setDrawerOpen] = useState(false);

      useEffect(() => {
        try { localStorage.setItem('bean_cart', JSON.stringify(items)); } catch (e) {}
      }, [items]);

      const totalQty = useMemo(() => items.reduce((s, l) => s + l.qty, 0), [items]);
      const totalPrice = useMemo(() => items.reduce((s, l) => s + l.price * l.qty, 0), [items]);

      const addItem = useCallback((bean, weight, qty = 1) => {
        const key = bean.id + '-' + weight.g;
        dispatch({ type: 'ADD', item: {
          key, id: bean.id, name: bean.name, country: bean.country, flag: bean.flag,
          roast: bean.roast, grad: bean.grad, weightLabel: weight.label,
          price: priceFor(bean.basePrice, weight.mult), qty,
        }});
      }, []);

      const value = { items, dispatch, totalQty, totalPrice, addItem, drawerOpen, setDrawerOpen };
      return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
    }
    const useCart = () => useContext(CartContext);

    // ========================================
    // 🔀 해시 라우터 (경량)
    // ========================================
    const RouterContext = createContext({ path: '/', navigate: () => {} });

    function Router({ children }) {
      const [path, setPath] = useState(() => window.location.hash.slice(1) || '/');
      useEffect(() => {
        const onHash = () => setPath(window.location.hash.slice(1) || '/');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const navigate = useCallback((to) => {
        window.location.hash = to;
        window.scrollTo({ top: 0 });
      }, []);
      return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
    }
    const useRouter = () => useContext(RouterContext);

    function Link({ to, className, children, onClick }) {
      const { navigate } = useRouter();
      return (
        <a href={'#' + to} className={className}
           onClick={(e) => { e.preventDefault(); onClick && onClick(); navigate(to); }}>
          {children}
        </a>
      );
    }

    // ========================================
    // 🎨 디자인 시스템 컴포넌트
    // ========================================
    function Button({ variant = 'primary', size = 'md', className = '', disabled, children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-full transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-bean-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-bean-800 text-bean-50 hover:bg-bean-900 shadow-sm hover:shadow-md active:scale-[.98]',
        secondary: 'bg-bean-100 text-bean-800 hover:bg-bean-200 border border-bean-200',
        danger: 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200',
        ghost: 'bg-transparent text-bean-700 hover:bg-bean-100',
        outline: 'bg-transparent text-bean-800 border border-bean-300 hover:border-bean-500 hover:bg-bean-50',
      };
      const sizes = { sm: 'text-sm px-3 py-1.5', md: 'text-sm px-5 py-2.5', lg: 'text-base px-7 py-3.5' };
      return (
        <button disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Badge({ children, className = '' }) {
      return <span className={`inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full border ${className}`}>{children}</span>;
    }

    function RoastBadge({ roast }) {
      const m = ROAST_META[roast];
      return (
        <Badge className={m.color}>
          <span className="w-2 h-2 rounded-full" style={{ background: m.dot }}></span>
          {m.label} 로스팅
        </Badge>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return <div className={`bg-white rounded-2xl border border-bean-100 shadow-sm ${className}`} {...rest}>{children}</div>;
    }

    function Modal({ isOpen, onClose, children, size = 'lg' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const widths = { md: 'max-w-md', lg: 'max-w-2xl', xl: 'max-w-4xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
          <div className="absolute inset-0 bg-bean-950/50 backdrop-blur-sm animate-fade" onClick={onClose}></div>
          <div className={`relative w-full ${widths[size]} max-h-[90vh] overflow-y-auto bg-bean-50 rounded-3xl shadow-2xl animate-fade`}>
            {children}
          </div>
        </div>
      );
    }

    // 원두 비주얼 (CSS 그라디언트 + SVG 원두알)

              <ellipse cx="74" cy="58" rx="24" ry="32" fill="#57381f" transform="rotate(14 74 58)"/>

          <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">

              <div className="leading-none">

            </Link>

            <nav className="hidden md:flex items-center gap-1" aria-label="주요 메뉴">
              {nav.map((n) => (
                <Link key={n.to} to={n.to}
                  className={`px-4 py-2 rounded-full text-sm font-medium transition ${isActive(n.to) ? 'bg-bean-800 text-bean-50' : 'text-bean-700 hover:bg-bean-100'}`}>

            <div className="flex items-center gap-2">
              <button onClick={() => setDrawerOpen(true)}
                className="relative p-2.5 rounded-full hover:bg-bean-100 transition" aria-label={`장바구니 (${totalQty}개)`}>
                <svg className="w-6 h-6 text-bean-800" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">

                <svg className="w-6 h-6 text-bean-800" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">

    function CartDrawer() {

      useEffect(() => {
        if (!drawerOpen) return;
        const onKey = (e) => e.key === 'Escape' && setDrawerOpen(false);
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };

    function BeansPage({ onOpen }) {
      const [roastFilter, setRoastFilter] = useState('all');
      const [sort, setSort] = useState('recommend');

      const list = useMemo(() => {
        let r = roastFilter === 'all' ? [...BEANS] : BEANS.filter((b) => b.roast === roastFilter);
        if (sort === 'price-asc') r.sort((a, b) => a.basePrice - b.basePrice);
        else if (sort === 'price-desc') r.sort((a, b) => b.basePrice - a.basePrice);
        else if (sort === 'roast') r.sort((a, b) => ROAST_ORDER.indexOf(a.roast) - ROAST_ORDER.indexOf(b.roast));
        return r;
      }, [roastFilter, sort]);

      const filters = [
        { v: 'all', label: '전체' },
        { v: 'light', label: '라이트' },
        { v: 'medium', label: '미디엄' },
        { v: 'dark', label: '다크' },
      ];

      return (
        <section className="max-w-6xl mx-auto px-4 py-10">
          <div className="flex items-end justify-between flex-wrap gap-4 mb-6">
            <div>
              <h2 className="text-2xl md:text-3xl font-extrabold text-bean-900">싱글오리진 원두</h2>
              <p className="text-bean-500 text-sm mt-1">산지별 개성이 살아있는 스페셜티 라인업</p>
            </div>
            <div className="flex items-center gap-2">
              <label htmlFor="sort" className="text-sm text-bean-500">정렬</label>
              <select id="sort" value={sort} onChange={(e) => setSort(e.target.value)}
                className="text-sm border border-bean-200 rounded-full px-4 py-2 bg-white text-bean-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-bean-400">
                <option value="recommend">추천순</option>
                <option value="price-asc">가격 낮은순</option>
                <option value="price-desc">가격 높은순</option>
                <option value="roast">로스팅 밝은순</option>
              </select>
            </div>
          </div>

          <div className="flex flex-wrap gap-2 mb-8" role="group" aria-label="로스팅 필터">
            {filters.map((f) => (
              <button key={f.v} onClick={() => setRoastFilter(f.v)}
                className={`px-4 py-2 rounded-full text-sm font-medium border transition ${roastFilter === f.v ? 'bg-bean-800 text-bean-50 border-bean-800' : 'bg-white text-bean-700 border-bean-200 hover:border-bean-400'}`}>

          {list.length === 0 ? (
            <div className="text-center py-20 text-bean-500">해당 조건의 원두가 없어요.</div>

            <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
              {list.map((b) => <BeanCard key={b.id} bean={b} onOpen={onOpen} />)}

      );

                <div className="mt-4 text-3xl font-extrabold text-bean-900">{won(p.price)}<span className="text-sm font-medium text-bean-500">/회</span></div>
                <p className="text-sm text-bean-600 mt-3 flex-1">{p.desc}</p>
                <ul className="mt-4 space-y-1.5 text-sm text-bean-700">
                  {['무료 배송', '주문 후 로스팅', '언제든 해지·건너뛰기'].map((t) => (
                    <li key={t} className="flex items-center gap-2"><span className="text-bean-500">✓</span>{t}</li>
                  ))}
                </ul>
                <Button className="mt-5 w-full" variant={p.pop ? 'primary' : 'outline'}
                  onClick={() => alert(`${p.name} 구독 — 데모 UI입니다 ☕`)}>구독 시작하기</Button>
              </Card>
            ))}
          </div>
          <div className="text-center mt-10">
            <Button variant="ghost" onClick={() => navigate('/beans')}>← 단품 원두 보러가기</Button>
          </div>
        </section>
      );
    }

    // ========================================
    // 📄 스토리 페이지
    // ========================================
    function StoryPage() {
      const steps = [
        { icon: '🌱', t: '산지 직거래', d: '농장과 직접 관계를 맺고 공정한 가격으로 생두를 수급합니다.' },
        { icon: '🔥', t: '주문 후 로스팅', d: '주문이 들어오면 그날 로스팅해 가장 신선한 상태로 보냅니다.' },
        { icon: '🧪', t: '커핑 & 컵노트', d: '모든 배치를 커핑으로 검증하고 정직한 테이스팅 노트를 기록합니다.' },
        { icon: '📦', t: '당일 발송', d: '오후 2시 이전 주문은 당일 발송해 향의 손실을 최소화합니다.' },
      ];
      return (
        <section className="max-w-4xl mx-auto px-4 py-14">
          <div className="text-center mb-12">
            <h2 className="text-3xl font-extrabold text-bean-900">우리가 커피를 다루는 방식</h2>
            <p className="text-bean-600 mt-3 leading-relaxed max-w-2xl mx-auto">
              SINGLE ORIGIN은 블렌딩으로 개성을 지우지 않습니다.
              한 산지, 한 농장의 목소리를 온전히 담아내는 것 — 그것이 우리가 싱글오리진만 고집하는 이유입니다.
            </p>
          </div>
          <div className="grid gap-5 sm:grid-cols-2">
            {steps.map((s, i) => (
              <Card key={s.t} className="p-6 animate-fade">
                <div className="text-4xl mb-3">{s.icon}</div>
                <div className="text-xs font-semibold text-bean-400 mb-1">STEP {i + 1}</div>
                <h3 className="font-bold text-bean-900 text-lg">{s.t}</h3>
                <p className="text-sm text-bean-600 mt-2 leading-relaxed">{s.d}</p>
              </Card>
            ))}
          </div>
          <blockquote className="mt-12 text-center text-xl font-medium text-bean-800 italic">
            “좋은 커피는 설명이 필요 없습니다.<br/>산지가 이미 모든 것을 말하고 있으니까요.”
          </blockquote>
        </section>
      );
    }

    // ========================================
    // 📄 라우팅 뷰
    // ========================================
    function Routes({ onOpen }) {
      const { path } = useRouter();
      if (path === '/' ) {
        return <><Hero /><BeansPage onOpen={onOpen} /></>;
      }
      if (path === '/beans') return <BeansPage onOpen={onOpen} />;
      if (path === '/subscribe') return <SubscribePage />;
      if (path === '/story') return <StoryPage />;
      return (
        <div className="max-w-6xl mx-auto px-4 py-24 text-center">
          <div className="text-6xl mb-4">🫙</div>
          <h2 className="text-xl font-bold text-bean-900">페이지를 찾을 수 없어요</h2>
          <Link to="/" className="inline-block mt-4 text-bean-600 underline">홈으로 돌아가기</Link>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [detailBean, setDetailBean] = useState(null);
      const [detailOpen, setDetailOpen] = useState(false);
      const openDetail = useCallback((b) => { setDetailBean(b); setDetailOpen(true); }, []);
      return (
        <Router>
          <CartProvider>
            <div className="min-h-screen flex flex-col">
              <Header />
              <main className="flex-1">
                <Routes onOpen={openDetail} />
              </main>
              <Footer />
              <CartDrawer />
              <BeanDetailModal bean={detailBean} isOpen={detailOpen} onClose={() => setDetailOpen(false)} />
            </div>
          </CartProvider>
        </Router>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
