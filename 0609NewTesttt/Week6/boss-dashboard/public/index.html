<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데일리브루 사장님 대시보드</title>
<style>
  :root { --bg:#12100e; --card:#1d1915; --line:#332c25; --fg:#f3efe9; --mut:#9a8f82; --berry:#c76b84; --gold:#d9a85a; --ok:#7fc98f; --warn:#e08b8b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(18,16,14,.93); backdrop-filter:blur(8px); }
  h1 { font-size:17px; letter-spacing:1px; }
  h1 .sub { color:var(--gold); font-size:12px; margin-left:8px; letter-spacing:2px; }
  .wrap { max-width:1060px; margin:0 auto; padding:22px; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .card h2 { font-size:13px; color:var(--mut); font-weight:600; margin-bottom:12px; letter-spacing:.5px; }
  .span4 { grid-column:span 4; } .span6 { grid-column:span 6; } .span8 { grid-column:span 8; } .span12 { grid-column:span 12; }
  @media (max-width:800px){ .span4,.span6,.span8 { grid-column:span 12; } }
  .big { font-size:30px; font-weight:800; }
  .delta { font-size:13px; margin-left:8px; }
  .delta.up { color:var(--ok); } .delta.down { color:var(--warn); }
  .muted { color:var(--mut); font-size:13px; }
  button { font:inherit; border:none; border-radius:9px; padding:10px 16px; background:var(--fg); color:#221c16; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:500; }
  input, select { width:100%; font:inherit; background:#151210; border:1px solid var(--line); color:var(--fg); border-radius:9px; padding:11px; margin-top:6px; }
  label { font-size:13px; color:var(--mut); }
  /* 매출 입력 패널 */
  #entry { margin-bottom:16px; }
  .entry-grid { display:grid; grid-template-columns:150px 1fr 130px 90px 130px auto; gap:10px; align-items:end; }
  @media (max-width:800px){ .entry-grid { grid-template-columns:1fr 1fr; } }
  .entry-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .entry-row:last-child { border-bottom:none; }
  .entry-row .del { background:transparent; border:none; color:var(--warn); cursor:pointer; font-size:12.5px; padding:4px 8px; }
  .ok-msg { color:var(--ok); font-size:13px; min-height:18px; }
  .err { color:#ff8a8a; font-size:13px; min-height:18px; }
  /* 브리핑 */
  .brief li { margin:8px 0 8px 4px; line-height:1.55; font-size:14.5px; list-style:none; padding-left:22px; position:relative; }
  .brief li::before { content:"☕"; position:absolute; left:0; }
  /* 주간 매출 바 차트 */
  .bars { display:flex; align-items:flex-end; gap:8px; height:120px; margin-top:8px; }
  .bar { flex:1; background:linear-gradient(180deg,var(--berry),#8a4a5e); border-radius:6px 6px 0 0; position:relative; min-height:6px; }
  .bar span { position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--mut); }
  .bar em { position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10.5px; color:var(--mut); font-style:normal; }
  .bar.today { background:linear-gradient(180deg,var(--gold),#a97e3c); }
  /* top3 */
  .rank { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
  .rank:last-child { border-bottom:none; }
  .rank .no { width:26px; height:26px; border-radius:8px; background:#2a241e; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold); font-size:13px; }
  .rank .nm { flex:1; font-size:14.5px; }
  .review { padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5; }
  .review:last-child { border-bottom:none; }
  .stars { color:var(--gold); font-size:12px; }
  .weather-now { font-size:26px; font-weight:800; }
  .src { font-size:11.5px; color:var(--mut); margin-top:14px; }
  #login { max-width:380px; margin:60px auto; }
</style>
</head>
<body>
<header>
  <h1>DAILY BREW<span class="sub">사장님 대시보드</span></h1>
  <div id="topbar"></div>
</header>

<div class="wrap">
  <div id="login" class="card" style="display:none;">
    <h2>사장님 로그인</h2>
    <label>이메일</label><input id="email" type="email" />
    <label>비밀번호</label><input id="pw" type="password" />
    <div class="err" id="loginErr"></div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button onclick="login()">로그인</button>
      <button class="ghost" onclick="register()">회원가입</button>
    </div>
    <p class="muted" style="margin-top:12px;">대시보드는 로그인한 사장님만 볼 수 있습니다.</p>
  </div>

  <div id="entry" class="card" style="display:none;">
    <h2>✏️ 오늘 매출 입력 — 마감하면서 그날 판매를 기록하세요</h2>
    <div class="entry-grid">
      <div><label>날짜</label><input id="sDate" type="date" onchange="loadEntries()" /></div>
      <div><label>메뉴 이름</label><input id="sMenu" placeholder="예: 바닐라라떼" /></div>
      <div><label>카테고리</label>
        <select id="sCat"><option>커피</option><option>논커피</option><option>디저트</option><option>기타</option></select>
      </div>
      <div><label>수량</label><input id="sQty" type="number" min="1" value="1" /></div>
      <div><label>총 금액(원)</label><input id="sAmt" type="number" min="0" step="100" placeholder="예: 11000" /></div>
      <div><button onclick="saveSale()">저장</button></div>
    </div>
    <div class="err" id="entryErr"></div><div class="ok-msg" id="entryOk"></div>
    <div id="entryList"></div>
  </div>

  <div id="dash" class="grid" style="display:none;"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const won = (n) => '₩' + Number(n).toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '오류');
  return data;
};

async function boot() {
  const { user } = await api('/api/auth/me');
  if (!user) {
    $('#login').style.display = 'block';
    $('#dash').style.display = 'none';
    $('#entry').style.display = 'none';
    $('#topbar').innerHTML = '';
    return;
  }
  $('#topbar').innerHTML = `<span class="muted">${esc(user.name)} 사장님</span>
    <button style="margin-left:10px;" onclick="toggleEntry()">✏️ 매출 입력</button>
    <button class="ghost" style="margin-left:8px;" onclick="logout()">로그아웃</button>`;
  $('#login').style.display = 'none';
  await renderDash();
  $('#dash').style.display = 'grid';
}

// ── 매출 수기 입력 (v1 핵심 기능)
window.toggleEntry = () => {
  const el = $('#entry');
  const show = el.style.display === 'none';
  el.style.display = show ? 'block' : 'none';
  if (show) {
    if (!$('#sDate').value) $('#sDate').value = new Date().toLocaleDateString('sv-SE');
    loadEntries();
  }
};

async function loadEntries() {
  const date = $('#sDate').value;
  if (!date) return;
  const { sales } = await api('/api/sales?date=' + date);
  $('#entryList').innerHTML = sales.length
    ? `<div class="muted" style="margin:10px 0 4px;">${date} 입력 내역 (${sales.length}건 · 합계 ${won(sales.reduce((s, r) => s + r.amount, 0))})</div>`
      + sales.map((r) => `<div class="entry-row">
          <span>${esc(r.menu_name)} <span class="muted">· ${esc(r.category)} · ${r.quantity}개</span></span>
          <span><strong>${won(r.amount)}</strong><button class="del" onclick="delSale(${r.id})">삭제</button></span>
        </div>`).join('')
    : `<div class="muted" style="margin-top:10px;">${date} 입력 내역이 아직 없습니다.</div>`;
}

window.saveSale = async () => {
  $('#entryErr').textContent = ''; $('#entryOk').textContent = '';
  try {
    await api('/api/sales', { method: 'POST', body: JSON.stringify({
      date: $('#sDate').value, menu_name: $('#sMenu').value,
      category: $('#sCat').value, quantity: Number($('#sQty').value), amount: Number($('#sAmt').value),
    }) });
    $('#entryOk').textContent = '저장됐습니다. 대시보드에 바로 반영됩니다.';
    $('#sMenu').value = ''; $('#sQty').value = 1; $('#sAmt').value = '';
    await Promise.all([loadEntries(), renderDash()]);
  } catch (e) { $('#entryErr').textContent = e.message; }
};

window.delSale = async (id) => {
  try {
    await api('/api/sales/' + id, { method: 'DELETE' });
    await Promise.all([loadEntries(), renderDash()]);
  } catch (e) { $('#entryErr').textContent = e.message; }
};

async function renderDash() {
  const d = await api('/api/dashboard');
  const maxAmt = Math.max(...d.weekly.map((w) => w.amount), 1);
  const bars = d.weekly.map((w, i) => {
    const h = Math.round((w.amount / maxAmt) * 100);
    const day = ['일','월','화','수','목','금','토'][new Date(w.date).getDay()];
    const isLast = i === d.weekly.length - 1;
    return `<div class="bar ${isLast ? 'today' : ''}" style="height:${h}%;"><span>${Math.round(w.amount/10000)}만</span><em>${day}</em></div>`;
  }).join('');

  $('#dash').innerHTML = `
    <div class="card span12">
      <h2>☀️ 오늘의 카페 브리핑 — ${d.today}</h2>
      <ul class="brief">${d.briefing.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
      <div class="src">데이터 소스: ${d.sources.join(' + ')}</div>
    </div>

    <div class="card span4">
      <h2>오늘 매출</h2>
      <div class="big">${won(d.todayAmt)}</div>
      ${d.diffPct != null ? `<span class="delta ${d.diffPct >= 0 ? 'up' : 'down'}">${d.diffPct >= 0 ? '▲' : '▼'} 전일 대비 ${Math.abs(d.diffPct)}%</span>` : ''}
      <div class="muted" style="margin-top:10px;">${d.categories.map((c) => `${esc(c.category)} ${won(c.amount)}`).join(' · ')}</div>
    </div>

    <div class="card span4">
      <h2>성수동 날씨</h2>
      ${d.weather ? `
        <div class="weather-now">${d.weather.now}℃ <span style="font-size:15px; font-weight:500;">${esc(d.weather.desc)}</span></div>
        <div class="muted" style="margin-top:8px;">최저 ${d.weather.min}℃ · 최고 ${d.weather.max}℃<br/>강수확률 ${d.weather.rainProb}%</div>
      ` : '<div class="muted">날씨 API 일시 오류</div>'}
    </div>

    <div class="card span4">
      <h2>이번 주 인기 메뉴 TOP3</h2>
      ${d.top3.map((t, i) => `
        <div class="rank"><div class="no">${i + 1}</div>
          <div class="nm">${esc(t.menu_name)}<div class="muted">${t.qty}개</div></div>
          <strong>${won(t.amount)}</strong></div>`).join('')}
    </div>

    <div class="card span8">
      <h2>최근 7일 매출</h2>
      <div class="bars">${bars}</div>
      <div style="height:22px;"></div>
    </div>

    <div class="card span4">
      <h2>최근 손님 리뷰</h2>
      ${d.reviews.map((r) => `
        <div class="review"><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
        <span class="muted">${r.date}</span><br/>${esc(r.content)}</div>`).join('')}
    </div>`;
}

window.login = async () => {
  try { await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email:$('#email').value, password:$('#pw').value }) }); await boot(); }
  catch (e) { $('#loginErr').textContent = e.message; }
};
window.register = async () => {
  try { await api('/api/auth/register', { method:'POST', body: JSON.stringify({ email:$('#email').value, password:$('#pw').value, name:'사장님' }) }); await boot(); }
  catch (e) { $('#loginErr').textContent = e.message; }
};
window.logout = async () => { await api('/api/auth/logout', { method:'POST' }); await boot(); };

boot();
</script>
</body>
</html>
