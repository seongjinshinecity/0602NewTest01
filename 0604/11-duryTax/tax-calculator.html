<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 세금 계산기 (Casio Style)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Casio LCD font feel */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body { background: #1f2933; }
    .lcd-font { font-family: 'Share Tech Mono', 'Courier New', monospace; }
    /* LCD display: greenish-grey panel */
    .lcd-panel {
      background: linear-gradient(160deg, #c7d6c2 0%, #b3c4ad 100%);
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), inset 0 -1px 2px rgba(255,255,255,0.4);
      color: #2b3a2b;
    }
    /* Calculator body bezel */
    .casio-body {
      background: linear-gradient(165deg, #3b4654 0%, #2a323d 60%, #232a33 100%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* Raised physical buttons */
    .casio-btn {
      box-shadow: 0 3px 0 rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.3);
      transition: transform .05s ease, box-shadow .05s ease;
    }
    .casio-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
    /* Input styled as a small sub-LCD slot */
    .casio-input {
      background: #dfe7d9;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    }
    /* hide number input spinners */
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .seg-shadow { text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🔧 Utilities
    // ========================================
    const won = (n) => {
      if (n === '' || n === null || n === undefined || isNaN(n)) return '0';
      return Math.round(n).toLocaleString('ko-KR');
    };
    // strip commas / non-digit (keep leading minus) then parse
    const parseNum = (s) => {
      if (typeof s === 'number') return s;
      const cleaned = String(s).replace(/[^0-9.-]/g, '');
      const v = parseFloat(cleaned);
      return isNaN(v) ? 0 : v;
    };
    const pct = (n) => (n).toLocaleString('ko-KR', { maximumFractionDigits: 2 });

    // 2024~2025 종합소득세 과세표준 누진 구간 (한계세율 합산 방식)
    const INCOME_BRACKETS = [
      { upper: 14000000,   rate: 0.06 },
      { upper: 50000000,   rate: 0.15 },
      { upper: 88000000,   rate: 0.24 },
      { upper: 150000000,  rate: 0.35 },
      { upper: 300000000,  rate: 0.38 },
      { upper: 500000000,  rate: 0.40 },
      { upper: 1000000000, rate: 0.42 },
      { upper: Infinity,   rate: 0.45 },
    ];
    // 한계세율을 구간별로 합산 -> 누진공제 상수 의존 없이 자체 검증 가능
    function calcIncomeTax(base) {
      if (base <= 0) return 0;
      let tax = 0, lower = 0;
      for (const b of INCOME_BRACKETS) {
        if (base > lower) {
          const taxable = Math.min(base, b.upper) - lower;
          tax += taxable * b.rate;
          lower = b.upper;
        } else break;
      }
      return tax;
    }
    function topMarginalRate(base) {
      let rate = INCOME_BRACKETS[0].rate, lower = 0;
      for (const b of INCOME_BRACKETS) {
        if (base > lower) { rate = b.rate; lower = b.upper; } else break;
      }
      return rate;
    }

    // ========================================
    // 🎨 Design System Components (Casio style)
    // ========================================
    function Lcd({ children, className = '' }) {
      return (
        <div className={`lcd-panel rounded-md px-4 py-3 lcd-font ${className}`}>
          {children}
        </div>
      );
    }

    function NumberField({ label, value, onChange, suffix = '원', placeholder = '0', hint }) {
      return (
        <label className="block">
          <span className="block text-[11px] tracking-wide text-slate-300 mb-1 font-medium">{label}</span>
          <div className="flex items-stretch casio-input rounded-md overflow-hidden">
            <input
              type="text"
              inputMode="numeric"
              value={value === '' ? '' : Number(parseNum(value)).toLocaleString('ko-KR')}
              onChange={(e) => onChange(e.target.value)}
              placeholder={placeholder}
              className="w-full bg-transparent px-3 py-2 text-right lcd-font text-slate-800 text-base outline-none placeholder-slate-400"
              aria-label={label}
            />
            <span className="flex items-center px-2 text-slate-500 text-xs select-none border-l border-slate-300/60">{suffix}</span>
          </div>
          {hint && <span className="block text-[10px] text-slate-400 mt-1">{hint}</span>}
        </label>
      );
    }

    function PlainField({ label, value, onChange, suffix, placeholder = '0', hint, step }) {
      return (
        <label className="block">
          <span className="block text-[11px] tracking-wide text-slate-300 mb-1 font-medium">{label}</span>
          <div className="flex items-stretch casio-input rounded-md overflow-hidden">
            <input
              type="number"
              value={value}
              step={step || 'any'}
              onChange={(e) => onChange(e.target.value)}
              placeholder={placeholder}
              className="w-full bg-transparent px-3 py-2 text-right lcd-font text-slate-800 text-base outline-none placeholder-slate-400"
              aria-label={label}
            />
            {suffix && <span className="flex items-center px-2 text-slate-500 text-xs select-none border-l border-slate-300/60">{suffix}</span>}
          </div>
          {hint && <span className="block text-[10px] text-slate-400 mt-1">{hint}</span>}
        </label>
      );
    }

    function ResultRow({ label, value, suffix = '원', strong, accent, sub }) {
      return (
        <div className={`flex justify-between items-baseline py-1.5 ${strong ? 'border-t border-slate-500/40 mt-1 pt-2' : ''}`}>
          <span className={`text-xs ${strong ? 'text-slate-200 font-semibold' : 'text-slate-300'}`}>{label}</span>
          <span className={`lcd-font tabular-nums ${strong ? 'text-lg' : 'text-sm'} ${accent === 'green' ? 'text-emerald-300' : accent === 'red' ? 'text-rose-300' : 'text-slate-100'}`}>
            {value}{suffix && <span className="text-[10px] ml-1 text-slate-400">{suffix}</span>}
            {sub && <span className="block text-[10px] text-slate-400 text-right">{sub}</span>}
          </span>
        </div>
      );
    }

    function TabButton({ active, onClick, children }) {
      return (
        <button
          onClick={onClick}
          className={`casio-btn flex-1 rounded-lg py-2.5 px-2 text-xs sm:text-sm font-semibold lcd-font tracking-tight
            ${active
              ? 'bg-amber-400 text-slate-900'
              : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
          aria-pressed={active}
        >
          {children}
        </button>
      );
    }

    function SectionTitle({ children }) {
      return <h3 className="text-[11px] uppercase tracking-widest text-amber-300/80 font-bold mb-2 mt-4 first:mt-0">{children}</h3>;
    }

    // ========================================
    // 📄 Page 1: 프리랜서 종합소득세
    // ========================================
    function FreelancerTab() {
      const [revenue, setRevenue] = useState('40000000');
      const [expenseMode, setExpenseMode] = useState('rate'); // 'rate' | 'direct'
      const [expenseRate, setExpenseRate] = useState('40'); // 경비율 % (업종별 상이)
      const [expenseDirect, setExpenseDirect] = useState('');
      const [deduction, setDeduction] = useState('1500000'); // 소득공제 (기본 근사)

      const r = parseNum(revenue);
      const expense = expenseMode === 'rate'
        ? r * (parseNum(expenseRate) / 100)
        : parseNum(expenseDirect);
      const businessIncome = Math.max(0, r - expense);
      const taxBase = Math.max(0, businessIncome - parseNum(deduction));
      const incomeTax = calcIncomeTax(taxBase);           // 산출세액 (국세)
      const localTax = incomeTax * 0.10;                  // 지방소득세
      const totalTax = incomeTax + localTax;

      // 프리랜서 3.3% 원천징수: 매출 × 3%(소득세) + 매출 × 0.3%(지방세)
      const withheldNational = r * 0.03;
      const withheldLocal = r * 0.003;
      // 환급/추가납부 (국세 기준 비교)
      const nationalDiff = incomeTax - withheldNational;   // +면 추가납부, -면 환급
      const localDiff = localTax - withheldLocal;
      const totalDiff = nationalDiff + localDiff;

      return (
        <div className="space-y-2">
          <Lcd className="mb-3">
            <div className="text-[10px] text-slate-600 seg-shadow text-right">예상 결정세액 (국세+지방세)</div>
            <div className="text-2xl sm:text-3xl text-right text-slate-900 seg-shadow break-all">{won(totalTax)} <span className="text-sm">원</span></div>
          </Lcd>

          <SectionTitle>입력</SectionTitle>
          <NumberField label="연간 총수입 (매출)" value={revenue} onChange={setRevenue} />

          <div className="flex gap-2 text-xs">
            <button onClick={() => setExpenseMode('rate')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${expenseMode==='rate' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>경비율 추정</button>
            <button onClick={() => setExpenseMode('direct')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${expenseMode==='direct' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>경비 직접입력</button>
          </div>

          {expenseMode === 'rate'
            ? <PlainField label="경비율 (%)" value={expenseRate} onChange={setExpenseRate} suffix="%"
                hint="단순·기준경비율은 업종별로 다릅니다 (예: 인적용역 단순경비율 약 60~75%). 본인 업종 코드 기준으로 조정하세요." />
            : <NumberField label="경비 (실제 지출)" value={expenseDirect} onChange={setExpenseDirect} />
          }

          <NumberField label="소득공제 합계" value={deduction} onChange={setDeduction}
            hint="기본공제(본인 150만)·국민연금·기타 공제 합계를 입력하세요." />

          <SectionTitle>계산 과정</SectionTitle>
          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="총수입 (매출)" value={won(r)} />
            <ResultRow label="(−) 추정 경비" value={won(expense)} />
            <ResultRow label="= 사업소득 금액" value={won(businessIncome)} />
            <ResultRow label="(−) 소득공제" value={won(parseNum(deduction))} />
            <ResultRow label="= 과세표준" value={won(taxBase)} strong />
            <div className="text-[10px] text-slate-400 text-right mt-1">적용 최고 한계세율 {pct(topMarginalRate(taxBase)*100)}%</div>
          </div>

          <SectionTitle>세액</SectionTitle>
          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="산출세액 (소득세)" value={won(incomeTax)} />
            <ResultRow label="지방소득세 (10%)" value={won(localTax)} />
            <ResultRow label="총 결정세액" value={won(totalTax)} strong accent="green" />
          </div>

          <SectionTitle>3.3% 원천징수 정산</SectionTitle>
          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="기납부 (매출×3% 소득세)" value={won(withheldNational)} />
            <ResultRow label="기납부 (매출×0.3% 지방세)" value={won(withheldLocal)} />
            <ResultRow
              label={totalDiff >= 0 ? '추가 납부 예상' : '환급 예상'}
              value={won(Math.abs(totalDiff))}
              strong
              accent={totalDiff >= 0 ? 'red' : 'green'}
            />
            <div className="text-[10px] text-slate-400 mt-1">
              {totalDiff >= 0
                ? '결정세액이 기납부세액보다 많아 추가 납부가 예상됩니다.'
                : '기납부세액이 더 많아 환급이 예상됩니다.'}
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page 2: 부가가치세 (VAT)
    // ========================================
    function VatTab() {
      const [mode, setMode] = useState('supply'); // supply | total
      const [amount, setAmount] = useState('1000000');
      const rate = 0.10;

      const a = parseNum(amount);
      let supply, vat, total;
      if (mode === 'supply') {
        supply = a; vat = a * rate; total = a + vat;
      } else { // 합계금액에서 역산
        total = a; supply = a / (1 + rate); vat = total - supply;
      }

      // 납부세액 = 매출세액 − 매입세액
      const [salesVat, setSalesVat] = useState('1000000');   // 매출 공급가액
      const [purchaseVat, setPurchaseVat] = useState('300000'); // 매입 공급가액
      const sV = parseNum(salesVat) * rate;
      const pV = parseNum(purchaseVat) * rate;
      const payable = sV - pV;

      return (
        <div className="space-y-2">
          <Lcd className="mb-3">
            <div className="text-[10px] text-slate-600 seg-shadow text-right">부가세 (일반과세 10%)</div>
            <div className="text-2xl sm:text-3xl text-right text-slate-900 seg-shadow break-all">{won(vat)} <span className="text-sm">원</span></div>
          </Lcd>

          <SectionTitle>공급가액 ↔ 합계금액 변환</SectionTitle>
          <div className="flex gap-2 text-xs mb-1">
            <button onClick={() => setMode('supply')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${mode==='supply' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>공급가액 입력</button>
            <button onClick={() => setMode('total')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${mode==='total' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>합계금액 입력</button>
          </div>
          <NumberField
            label={mode === 'supply' ? '공급가액 (VAT 제외)' : '합계금액 (VAT 포함)'}
            value={amount} onChange={setAmount} />

          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="공급가액" value={won(supply)} />
            <ResultRow label="부가세 (10%)" value={won(vat)} accent="green" />
            <ResultRow label="합계금액" value={won(total)} strong />
          </div>
          <div className="text-[10px] text-slate-400 text-right">
            역산: 부가세 = 합계 ÷ 11, 공급가액 = 합계 ÷ 1.1
          </div>

          <SectionTitle>납부세액 (매출세액 − 매입세액)</SectionTitle>
          <NumberField label="매출 공급가액" value={salesVat} onChange={setSalesVat} />
          <NumberField label="매입 공급가액" value={purchaseVat} onChange={setPurchaseVat} />
          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="매출세액" value={won(sV)} />
            <ResultRow label="매입세액" value={won(pV)} />
            <ResultRow
              label={payable >= 0 ? '납부세액' : '환급세액'}
              value={won(Math.abs(payable))}
              strong
              accent={payable >= 0 ? 'red' : 'green'} />
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Page 3: 연봉 실수령액
    // ========================================
    // 2025 4대보험 요율 (근로자 부담분)
    const RATES = {
      pension: 0.045,         // 국민연금 4.5%
      pensionCapMonthly: 6170000, // 기준소득월액 상한 (월)
      health: 0.03545,        // 건강보험 3.545%
      care: 0.1295,           // 장기요양 = 건강보험료 × 12.95%
      employment: 0.009,      // 고용보험 0.9%
    };

    // 근로소득 간이세액 근사: 과세표준(월급여 - 비과세 - 4대보험 - 근로소득공제 근사)에
    // 종합소득세율을 연환산 적용하는 단순 근사 (실제 간이세액표와 차이 있음)
    function approxMonthlyIncomeTax(monthlyGross, dependents) {
      // 부양가족 1인당 월 약 12.5만원 비례 공제 근사
      const baseDeductionAnnual = 1500000 + (Math.max(0, dependents - 1)) * 1500000; // 본인+부양가족 인적공제 근사
      const annualGross = monthlyGross * 12;
      // 근로소득공제 근사 (구간 단순화)
      let earnedDed;
      if (annualGross <= 5000000) earnedDed = annualGross * 0.7;
      else if (annualGross <= 15000000) earnedDed = 3500000 + (annualGross - 5000000) * 0.4;
      else if (annualGross <= 45000000) earnedDed = 7500000 + (annualGross - 15000000) * 0.15;
      else if (annualGross <= 100000000) earnedDed = 12000000 + (annualGross - 45000000) * 0.05;
      else earnedDed = 14750000 + (annualGross - 100000000) * 0.02;
      const taxBase = Math.max(0, annualGross - earnedDed - baseDeductionAnnual);
      const annualTax = calcIncomeTax(taxBase);
      // 근로소득세액공제 근사 (단순 55% / 상한 적용 생략) — 보수적으로 일부 반영
      const credit = Math.min(annualTax * 0.55, 740000);
      const finalAnnual = Math.max(0, annualTax - credit);
      return finalAnnual / 12; // 월 근로소득세 근사 (간이세액)
    }

    function SalaryTab() {
      const [inputMode, setInputMode] = useState('annual'); // annual | monthly
      const [salary, setSalary] = useState('48000000');
      const [nonTax, setNonTax] = useState('200000'); // 월 비과세 (식대 등)
      const [dependents, setDependents] = useState('1');

      const sal = parseNum(salary);
      const monthlyGross = inputMode === 'annual' ? sal / 12 : sal;
      const annualGross = inputMode === 'annual' ? sal : sal * 12;
      const nonTaxMonthly = parseNum(nonTax);
      const taxableMonthly = Math.max(0, monthlyGross - nonTaxMonthly);
      const deps = Math.max(1, Math.round(parseNum(dependents)));

      // 4대보험 (월, 근로자 부담)
      const pensionBase = Math.min(taxableMonthly, RATES.pensionCapMonthly);
      const pension = pensionBase * RATES.pension;
      const health = taxableMonthly * RATES.health;
      const care = health * RATES.care;            // 장기요양 = 건강보험료 × 요율
      const employment = taxableMonthly * RATES.employment;

      // 근로소득세 + 지방소득세
      const incomeTaxM = approxMonthlyIncomeTax(taxableMonthly, deps);
      const localTaxM = incomeTaxM * 0.10;

      const totalDeductM = pension + health + care + employment + incomeTaxM + localTaxM;
      const netMonthly = monthlyGross - totalDeductM;
      const netAnnual = netMonthly * 12;

      return (
        <div className="space-y-2">
          <Lcd className="mb-3">
            <div className="text-[10px] text-slate-600 seg-shadow text-right">월 실수령액</div>
            <div className="text-2xl sm:text-3xl text-right text-slate-900 seg-shadow break-all">{won(netMonthly)} <span className="text-sm">원</span></div>
            <div className="text-[11px] text-slate-700 text-right mt-1">연 {won(netAnnual)} 원</div>
          </Lcd>

          <SectionTitle>입력</SectionTitle>
          <div className="flex gap-2 text-xs mb-1">
            <button onClick={() => setInputMode('annual')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${inputMode==='annual' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>연봉 입력</button>
            <button onClick={() => setInputMode('monthly')}
              className={`casio-btn flex-1 rounded-md py-1.5 ${inputMode==='monthly' ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-300'}`}>월급 입력</button>
          </div>
          <NumberField label={inputMode === 'annual' ? '연봉 (세전)' : '월급 (세전)'} value={salary} onChange={setSalary} />
          <NumberField label="월 비과세액 (식대 등)" value={nonTax} onChange={setNonTax}
            hint="비과세 한도 내 식대(월 20만원) 등. 4대보험·소득세 산정 시 제외됩니다." />
          <PlainField label="부양가족 수 (본인 포함)" value={dependents} onChange={setDependents} suffix="명" step="1" />

          <SectionTitle>공제 내역 (월)</SectionTitle>
          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label={`국민연금 (4.5%)`} value={won(pension)} />
            <ResultRow label={`건강보험 (3.545%)`} value={won(health)} />
            <ResultRow label={`장기요양 (건보료×12.95%)`} value={won(care)} />
            <ResultRow label={`고용보험 (0.9%)`} value={won(employment)} />
            <ResultRow label={`근로소득세 (간이 근사)`} value={won(incomeTaxM)} />
            <ResultRow label={`지방소득세 (10%)`} value={won(localTaxM)} />
            <ResultRow label="공제 합계" value={won(totalDeductM)} strong accent="red" />
          </div>

          <div className="bg-slate-800/60 rounded-lg px-3 py-2">
            <ResultRow label="월 세전" value={won(monthlyGross)} />
            <ResultRow label="월 실수령액" value={won(netMonthly)} strong accent="green" />
            <ResultRow label="연 실수령액" value={won(netAnnual)} />
          </div>
          {taxableMonthly > RATES.pensionCapMonthly && (
            <div className="text-[10px] text-amber-300/80 text-right">국민연금 기준소득월액 상한(617만원) 적용됨</div>
          )}
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [tab, setTab] = useState('freelancer');
      const tabs = [
        { id: 'freelancer', label: '종합소득세' },
        { id: 'vat', label: '부가세 VAT' },
        { id: 'salary', label: '실수령액' },
      ];
      return (
        <div className="min-h-screen flex items-start sm:items-center justify-center p-3 sm:p-6">
          <div className="w-full max-w-md casio-body rounded-3xl p-4 sm:p-5">
            {/* Brand header */}
            <div className="flex items-center justify-between mb-3 px-1">
              <div className="lcd-font text-amber-300 text-sm tracking-widest font-bold">KOREA·TAX</div>
              <div className="text-[10px] text-slate-400 lcd-font">2024~2025 기준</div>
            </div>

            {/* Tabs */}
            <div className="flex gap-2 mb-4">
              {tabs.map(t => (
                <TabButton key={t.id} active={tab === t.id} onClick={() => setTab(t.id)}>{t.label}</TabButton>
              ))}
            </div>

            {/* Calculator face */}
            <div className="bg-slate-900/50 rounded-2xl p-3 sm:p-4 border border-slate-700/50">
              {tab === 'freelancer' && <FreelancerTab />}
              {tab === 'vat' && <VatTab />}
              {tab === 'salary' && <SalaryTab />}
            </div>

            {/* Disclaimer */}
            <p className="text-[10px] leading-relaxed text-slate-400 mt-4 px-1 text-center">
              ⚠️ 본 계산기는 <b className="text-slate-300">참고용</b>입니다. 세율·공제·간이세액표는 근사치이며,
              정확한 세액은 <b className="text-slate-300">세무사 또는 홈택스</b>에서 확인하세요.
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
