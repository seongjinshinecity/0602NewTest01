<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더치페이 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Phantom 팔레트
    // 강조색(라벤더/민트/코랄 등)은 CSS 변수로 빼서 페이지 로드마다 랜덤 hue로 바뀜.
    // hsl(var(--..) / <alpha-value>) 형태라 /50 같은 opacity 수식어도 정상 동작.
    // 변수에는 "H S% L%" 공백 구분 채널을 저장 (예: --accent: 255 78% 78%).
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            phantom: {
              lav: 'hsl(var(--accent) / <alpha-value>)',        // 시그니처 강조색
              
              lavDark: 'hsl(var(--accent-dark) / <alpha-value>)', // 호버용 짙은 강조색
              lavSoft: 'hsl(var(--accent-soft) / <alpha-value>)', // 옅은 틴트 (하이라이트 면)
              lavSoft2: 'hsl(var(--accent-soft2) / <alpha-value>)', // 살짝 더 진한 틴트 (보조 버튼)
              grad: 'hsl(var(--accent-grad) / <alpha-value>)',   // 결과 카드 그라데이션 끝색
              cream: '#F5F3EF',      // 따뜻한 크림 배경
              ink: '#1C1C1C',        // 짙은 차콜 본문
              muted: '#6B6B72',      // 보조 텍스트
              faint: '#9B9BA3',      // 더 옅은 보조 텍스트
              line: '#ECEAF3',       // 부드러운 경계선
              good: '#2FA37C',       // 받을 돈 (그린)
              bad: '#E0556B',        // 낼 돈 (레드)
            },
          },
          boxShadow: {
            soft: '0 2px 12px rgba(80, 63, 160, 0.06)',
            softer: '0 1px 6px rgba(80, 63, 160, 0.05)',
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Phantom 스타일 기본 폰트 / 톤 */
    :root {
      --bg: #F5F3EF;
      --text: #1C1C1C;
      /* 강조색 기본값(라벤더). JS가 로드 시 랜덤 hue로 덮어씀 — "H S% L%" 채널 형식 */
      --accent: 255 78% 78%;
      --accent-dark: 255 65% 73%;
      --accent-soft: 255 80% 97%;
      --accent-soft2: 255 70% 94%;
      --accent-grad: 250 80% 86%;
    }
    html, body { background: var(--bg); }
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out; }
    /* number input 스피너 제거 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useMemo, useEffect } = React;

    // ========================================
    // 🎨 랜덤 강조색 (Accent) — 로드/버튼마다 hue만 랜덤, 채도·명도는 고정
    // ========================================
    // 채도·명도를 고정하고 hue(0~360)만 돌리므로 항상 밝고 예쁜 파스텔 톤이 나옵니다.
    // 강조색은 항상 밝은 파스텔이라 그 위 짙은 차콜 텍스트(text-phantom-ink) 대비가 자동으로 확보됩니다.
    // 직전 hue와 최소 40° 이상 차이나게 다시 뽑아 같은 색 연속 등장을 방지합니다.
    let lastHue = null;
    function pickHue() {
      let h;
      for (let tries = 0; tries < 20; tries++) {
        h = Math.floor(Math.random() * 360);
        if (lastHue === null) break;
        // 색상환(circular) 기준 최소 거리 — 0과 359는 사실상 가까우므로 wrap 고려
        const diff = Math.min(Math.abs(h - lastHue), 360 - Math.abs(h - lastHue));
        if (diff >= 40) break;
      }
      lastHue = h;
      return h;
    }
    // hue 하나로 강조색 4단계 + 그라데이션 끝색을 파생. 값은 "H S% L%" 채널 문자열.
    function accentVars(h) {
      return {
        '--accent': `${h} 78% 78%`,        // 메인 강조색 (밝은 파스텔)
        '--accent-dark': `${h} 65% 71%`,   // 호버용 살짝 짙은 톤
        '--accent-soft': `${h} 80% 97%`,   // 아주 옅은 틴트 면
        '--accent-soft2': `${h} 70% 93%`,  // 살짝 더 진한 틴트 (보조 버튼)
        '--accent-grad': `${(h + 18) % 360} 80% 85%`, // 같은 계열에서 hue 약간 이동한 그라데이션 끝색
      };
    }

    // ========================================
    // Utils (통화 포맷 / 파싱)
    // ========================================
    // 정수를 천 단위 콤마가 포함된 원화 문자열로 변환
    const formatKRW = (n) => {
      const v = Math.round(Number(n) || 0);
      return '₩' + v.toLocaleString('ko-KR');
    };
    // 콤마/공백 제거 후 정수 파싱 (NaN 방지)
    const parseNumber = (str) => {
      const cleaned = String(str).replace(/[^0-9]/g, '');
      return cleaned === '' ? 0 : parseInt(cleaned, 10);
    };
    // 입력 표시용: 숫자에 콤마 추가
    const withCommas = (str) => {
      const n = parseNumber(str);
      return n === 0 && String(str).replace(/[^0-9]/g, '') === '' ? '' : n.toLocaleString('ko-KR');
    };

    // ========================================
    // 💱 정산 로직 (배열 + 반복문 + 조건분기로 합계 정확히 맞춤)
    // ========================================
    // [균등 분배] total을 n명에게 나눌 때 floor + 나머지 분배로 합계가 정확히 total이 되도록 계산
    // 반환: { base, remainder, shares: [...] }  shares 합 === total 보장
    function splitEvenly(total, n) {
      if (n <= 0) return { base: 0, remainder: 0, shares: [] };
      const base = Math.floor(total / n);
      const remainder = total - base * n; // 0 ~ n-1
      const shares = Array.from({ length: n }, (_, i) => (i < remainder ? base + 1 : base));
      return { base, remainder, shares };
    }

    // [가중 비례 분배 - Hamilton/최대잔여법] amount를 weights 비율로 안분하되 합계가 정확히 amount가 되게.
    // 단순 round는 합이 어긋나므로: floor한 뒤 남은 나머지(원)를 소수부가 큰 순서대로 1원씩 분배.
    // 할인액을 "각자 먹은 금액 비율"로 배분할 때 사용.
    function distributeProportional(amount, weights) {
      const n = weights.length;
      const totalW = weights.reduce((a, b) => a + b, 0);
      if (amount <= 0 || totalW <= 0) return weights.map(() => 0);
      const exact = weights.map((w) => (amount * w) / totalW);
      const result = exact.map(Math.floor);
      let rem = amount - result.reduce((a, b) => a + b, 0); // 분배해야 할 나머지(원)
      // 소수부가 큰 순서대로 정렬 후 나머지를 1원씩 분배 (조건분기 + 반복문)
      const order = exact
        .map((e, i) => ({ i, frac: e - Math.floor(e) }))
        .sort((a, b) => b.frac - a.frac);
      for (let k = 0; k < rem; k++) {
        result[order[k % n].i] += 1;
      }
      return result; // sum(result) === amount 보장
    }

    // [송금 최소화] balances(개인별 잔액, 합=0)를 받아 송금 목록 생성
    // 잔액 > 0 : 받아야 할 사람(채권자), < 0 : 보내야 할 사람(채무자)
    // 그리디: 가장 큰 채권자와 가장 큰 채무자를 반복 매칭
    function settleDebts(people) {
      const creditors = people.filter(p => p.balance > 0).map(p => ({ name: p.name, amt: p.balance }));
      const debtors = people.filter(p => p.balance < 0).map(p => ({ name: p.name, amt: -p.balance }));
      creditors.sort((a, b) => b.amt - a.amt);
      debtors.sort((a, b) => b.amt - a.amt);
      const transfers = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amt, creditors[j].amt);
        if (pay > 0) {
          transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
        }
        debtors[i].amt -= pay;
        creditors[j].amt -= pay;
        if (debtors[i].amt === 0) i++;
        if (creditors[j].amt === 0) j++;
      }
      return transfers;
    }

    // ========================================
    // 🎨 Design System Components (Phantom 스타일)
    // ========================================
    // 카드: 순백 면 + 부드러운 그림자 + 큼직한 둥근 모서리
    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-3xl shadow-soft p-5 sm:p-6 ${className}`}>
          {children}
        </div>
      );
    }

    // 섹션 헤더 (이모지 아이콘 + 제목)
    function SectionTitle({ icon, children, right }) {
      return (
        <div className="flex items-center justify-between mb-3.5">
          <h3 className="flex items-center gap-1.5 font-bold text-phantom-ink text-[15px]">
            {icon && <span>{icon}</span>}
            {children}
          </h3>
          {right}
        </div>
      );
    }

    function Button({ children, variant = 'secondary', size = 'md', disabled = false, onClick, className = '', type = 'button', ...rest }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-phantom-lav/50 disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        // primary: 라벤더 퍼플 + 짙은 차콜 텍스트 (통통한 핀테크 룩)
        primary: 'bg-phantom-lav text-phantom-ink hover:bg-phantom-lavDark',
        secondary: 'bg-phantom-lavSoft text-phantom-ink hover:bg-phantom-lavSoft2',
        danger: 'bg-transparent text-phantom-faint hover:bg-[rgba(224,85,107,0.1)] hover:text-phantom-bad',
        ghost: 'bg-transparent text-phantom-muted hover:bg-phantom-lavSoft',
      };
      const sizes = {
        sm: 'text-[13px] px-3 py-1.5',
        md: 'text-[14px] px-4 py-2.5',
        lg: 'text-[15px] px-5 py-3',
        icon: 'w-9 h-9 text-lg rounded-full',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, prefix, suffix, inputMode = 'numeric', className = '', error }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block text-[13px] font-semibold text-phantom-muted mb-1.5">{label}</span>}
          <div className={`flex items-center bg-phantom-lavSoft border-2 rounded-2xl px-3.5 transition-colors focus-within:bg-white ${error ? 'border-phantom-bad' : 'border-transparent focus-within:border-phantom-lav'}`}>
            {prefix && <span className="text-phantom-faint mr-1 select-none text-[14px]">{prefix}</span>}
            <input
              inputMode={inputMode}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              className="flex-1 bg-transparent py-3 outline-none text-phantom-ink text-[14px] font-medium placeholder:text-phantom-faint/60 placeholder:font-normal min-w-0"
            />
            {suffix && <span className="text-phantom-faint ml-1 select-none whitespace-nowrap text-[14px]">{suffix}</span>}
          </div>
          {error && <span className="block text-xs text-phantom-bad mt-1">{error}</span>}
        </label>
      );
    }

    function Badge({ children, color = 'default', className = '' }) {
      const colors = {
        default: 'bg-phantom-lavSoft text-phantom-muted',
        green: 'bg-[rgba(47,163,124,0.14)] text-phantom-good',
        red: 'bg-[rgba(224,85,107,0.14)] text-phantom-bad',
        blue: 'bg-phantom-lav/[0.18] text-phantom-lavDark',
      };
      return (
        <span className={`inline-flex items-center text-[12px] font-semibold px-2.5 py-1 rounded-full ${colors[color]} ${className}`}>
          {children}
        </span>
      );
    }

    // 탭: Phantom 풍 필 세그먼트 컨트롤 (라벤더 활성 배경)
    function SegmentedTabs({ tabs, active, onChange }) {
      return (
        <div className="flex gap-1 bg-white rounded-full p-1 shadow-softer">
          {tabs.map((t) => (
            <button
              key={t.value}
              onClick={() => onChange(t.value)}
              className={`relative flex-1 px-2 sm:px-3 py-2.5 text-[13px] sm:text-[14px] font-semibold rounded-full transition-colors ${
                active === t.value
                  ? 'bg-phantom-lav text-phantom-ink'
                  : 'text-phantom-faint hover:text-phantom-muted'
              }`}
            >
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    // 검산 행: 두 값이 일치하는지 시각적으로 확인 (정수 합계 무결성 검증)
    function ChecksumRow({ label, value, expected }) {
      const ok = value === expected;
      return (
        <div className="flex items-center justify-between text-[13px]">
          <span className="text-phantom-muted">{label}</span>
          <span className={`font-semibold tabular-nums ${ok ? 'text-phantom-good' : 'text-phantom-bad'}`}>
            {formatKRW(value)} {ok ? '✓' : '⚠'}
          </span>
        </div>
      );
    }

    // 인원 스텝퍼 (− 숫자 +)
    function PeopleStepper({ value, onDec, onInc, min = 1 }) {
      return (
        <div className="flex items-center justify-between bg-phantom-lavSoft rounded-2xl px-2.5 py-2">
          <Button variant="ghost" size="icon" onClick={onDec} disabled={value <= min} aria-label="인원 감소">−</Button>
          <div className="text-center">
            <span className="text-2xl font-extrabold text-phantom-ink tabular-nums">{value}</span>
            <span className="text-phantom-faint ml-1 text-[14px]">명</span>
          </div>
          <Button variant="ghost" size="icon" onClick={onInc} aria-label="인원 증가">+</Button>
        </div>
      );
    }

    // ========================================
    // 📄 1) 기본 1/N 모드
    // ========================================
    function BasicMode() {
      const [amountStr, setAmountStr] = useState('');
      const [people, setPeople] = useState(2);

      const total = parseNumber(amountStr);
      const { base, remainder, shares } = useMemo(() => splitEvenly(total, people), [total, people]);

      const handleAmount = (e) => setAmountStr(withCommas(e.target.value));
      const everyoneEqual = remainder === 0;
      const sumCheck = shares.reduce((a, b) => a + b, 0); // === total 검증용

      return (
        <div className="space-y-4 animate-fade-in">
          <Card>
            <Input
              label="총 금액"
              value={amountStr}
              onChange={handleAmount}
              placeholder="0"
              prefix="₩"
              suffix="원"
            />
            <div className="mt-4">
              <span className="block text-[13px] font-semibold text-phantom-muted mb-1.5">인원 수</span>
              <PeopleStepper
                value={people}
                onDec={() => setPeople(p => Math.max(1, p - 1))}
                onInc={() => setPeople(p => Math.min(100, p + 1))}
              />
              <div className="flex gap-1.5 mt-2.5">
                {[2, 3, 4, 5, 6].map(n => (
                  <Button key={n} variant={people === n ? 'primary' : 'secondary'} size="sm"
                    className="flex-1" onClick={() => setPeople(n)}>{n}명</Button>
                ))}
              </div>
            </div>
          </Card>

          {/* 결과 */}
          <Card className="bg-gradient-to-br from-phantom-lav to-phantom-grad">
            <p className="text-phantom-ink/70 text-[13px] font-semibold">1인당 금액</p>
            <p className="text-3xl sm:text-4xl font-extrabold mt-1 tabular-nums text-phantom-ink">
              {formatKRW(base)}
              {!everyoneEqual && <span className="text-xl font-bold text-phantom-ink/60"> ~ {formatKRW(base + 1)}</span>}
            </p>
            {total > 0 && (
              everyoneEqual ? (
                <p className="text-phantom-ink/70 text-[13px] mt-3 font-medium">모두 똑같이 나눠 떨어져요 🎉</p>
              ) : (
                <div className="mt-3 bg-white/85 backdrop-blur rounded-2xl p-3.5 text-[13px] leading-relaxed">
                  <p className="font-bold text-phantom-ink">딱 나누어떨어지지 않아요</p>
                  <p className="text-phantom-muted mt-1">
                    <span className="font-bold text-phantom-ink">{remainder}명</span>은 <span className="font-bold text-phantom-ink">{formatKRW(base + 1)}</span>,{' '}
                    나머지 <span className="font-bold text-phantom-ink">{people - remainder}명</span>은 <span className="font-bold text-phantom-ink">{formatKRW(base)}</span>씩 부담하면 정확히 맞아요.
                  </p>
                </div>
              )
            )}
          </Card>

          {total > 0 && (
            <Card>
              <div className="space-y-2">
                <ChecksumRow label="총 금액" value={total} expected={total} />
                <ChecksumRow label="1인당 합계 (검산)" value={sumCheck} expected={total} />
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 2) 참가자별 정산 모드 (각자 결제 → 송금 안내)
    // ========================================
    let pidSeq = 3;
    function SettleMode() {
      const [totalStr, setTotalStr] = useState('');
      const [members, setMembers] = useState([
        { id: 1, name: '', paidStr: '' },
        { id: 2, name: '', paidStr: '' },
      ]);

      const total = parseNumber(totalStr);
      const addMember = () => setMembers(m => [...m, { id: pidSeq++, name: '', paidStr: '' }]);
      const removeMember = (id) => setMembers(m => m.length > 1 ? m.filter(x => x.id !== id) : m);
      const updateName = (id, v) => setMembers(m => m.map(x => x.id === id ? { ...x, name: v } : x));
      const updatePaid = (id, v) => setMembers(m => m.map(x => x.id === id ? { ...x, paidStr: withCommas(v) } : x));

      const n = members.length;
      const totalPaid = members.reduce((s, x) => s + parseNumber(x.paidStr), 0);
      const mismatch = total > 0 && total !== totalPaid;

      // 1인당 부담액 (floor + 나머지 분배로 shares 합 === totalPaid 보장 → 잔액 합 === 0)
      const people = useMemo(() => {
        const { shares } = splitEvenly(totalPaid, n);
        return members.map((m, i) => {
          const name = m.name.trim() || `참가자 ${i + 1}`;
          const paid = parseNumber(m.paidStr);
          const share = shares[i] || 0;
          return { name, paid, share, balance: paid - share };
        });
      }, [members, n, totalPaid]);

      const transfers = useMemo(() => settleDebts(people), [people]);
      const hasPaid = totalPaid > 0;

      return (
        <div className="space-y-4 animate-fade-in">
          <Card>
            <Input
              label="총 금액 (선택 — 비우면 결제 합계로 계산)"
              value={totalStr}
              onChange={(e) => setTotalStr(withCommas(e.target.value))}
              placeholder="0"
              prefix="₩"
              suffix="원"
            />
            <p className="text-[12px] text-phantom-faint mt-2.5">
              각자 결제한 금액을 입력하면, 누가 누구에게 보내야 하는지 자동으로 계산해요.
            </p>
          </Card>

          <Card>
            <SectionTitle icon="👥" right={<Button variant="secondary" size="sm" onClick={addMember}>+ 추가</Button>}>
              참가자 <Badge>{n}명</Badge>
            </SectionTitle>
            <div className="space-y-2.5">
              {members.map((m, i) => (
                <div key={m.id} className="flex gap-2 items-center">
                  <Input
                    className="w-2/5"
                    inputMode="text"
                    value={m.name}
                    onChange={(e) => updateName(m.id, e.target.value)}
                    placeholder={`참가자 ${i + 1}`}
                  />
                  <Input
                    className="flex-1"
                    value={m.paidStr}
                    onChange={(e) => updatePaid(m.id, e.target.value)}
                    placeholder="결제 0"
                    prefix="₩"
                  />
                  <Button variant="danger" size="icon" className="shrink-0" onClick={() => removeMember(m.id)} aria-label="삭제" disabled={n <= 1}>×</Button>
                </div>
              ))}
            </div>
          </Card>

          <Card>
            <div className="grid grid-cols-2 gap-3 text-center">
              <div className="bg-phantom-lavSoft rounded-2xl py-4">
                <p className="text-[12px] text-phantom-muted font-medium">총 결제 합계</p>
                <p className="font-bold text-phantom-ink mt-1 tabular-nums">{formatKRW(totalPaid)}</p>
              </div>
              <div className="bg-phantom-lavSoft rounded-2xl py-4">
                <p className="text-[12px] text-phantom-muted font-medium">1인당 부담액</p>
                <p className="font-bold text-phantom-ink mt-1 tabular-nums">
                  {n > 0 ? formatKRW(Math.floor(totalPaid / n)) : '₩0'}
                </p>
              </div>
            </div>
            {mismatch && (
              <p className="text-[12px] text-phantom-bad bg-[rgba(224,85,107,0.1)] rounded-2xl px-3.5 py-2.5 mt-3">
                ⚠ 입력한 총 금액({formatKRW(total)})과 결제 합계({formatKRW(totalPaid)})가 달라요. 정산은 실제 결제 합계 기준으로 계산합니다.
              </p>
            )}
          </Card>

          {hasPaid && (
            <Card>
              <SectionTitle icon="📊">개인별 정산 현황</SectionTitle>
              <div className="space-y-1">
                {people.map((p, i) => (
                  <div key={i} className="flex items-center justify-between py-2 border-b border-phantom-line last:border-0">
                    <div>
                      <span className="font-semibold text-phantom-ink text-[14px]">{p.name}</span>
                      <span className="text-[12px] text-phantom-faint ml-2">결제 {formatKRW(p.paid)} · 부담 {formatKRW(p.share)}</span>
                    </div>
                    {p.balance > 0 ? (
                      <Badge color="green">+{formatKRW(p.balance)} 받을 돈</Badge>
                    ) : p.balance < 0 ? (
                      <Badge color="red">{formatKRW(p.balance)} 낼 돈</Badge>
                    ) : (
                      <Badge>정산 완료</Badge>
                    )}
                  </div>
                ))}
              </div>
            </Card>
          )}

          <Card>
            <SectionTitle icon="💸">송금 안내 <span className="text-[12px] font-normal text-phantom-faint">(최소 송금 횟수)</span></SectionTitle>
            {!hasPaid ? (
              <p className="text-phantom-faint text-[13px] text-center py-4">결제 금액을 입력하면 송금 내역이 표시됩니다.</p>
            ) : transfers.length === 0 ? (
              <p className="text-phantom-good text-[13px] text-center py-4 font-semibold">모두 정산되었어요! 보낼 돈이 없습니다 🎉</p>
            ) : (
              <div className="space-y-2">
                {transfers.map((t, i) => (
                  <div key={i} className="flex items-center justify-between bg-phantom-lavSoft rounded-2xl px-4 py-3">
                    <div className="flex items-center gap-2 text-[14px]">
                      <span className="font-semibold text-phantom-bad">{t.from}</span>
                      <span className="text-phantom-faint">→</span>
                      <span className="font-semibold text-phantom-good">{t.to}</span>
                    </div>
                    <span className="font-bold text-phantom-ink tabular-nums">{formatKRW(t.amount)}</span>
                  </div>
                ))}
                <p className="text-[12px] text-phantom-faint text-center pt-1">총 {transfers.length}번의 송금으로 정산 완료</p>
              </div>
            )}
          </Card>
        </div>
      );
    }

    // ========================================
    // 📄 3) 메뉴별 정산 모드 (각자 먹은 메뉴 + 공유 메뉴 + 할인 안분)
    // ========================================
    // 데이터 모델
    //  - participants: [{ id, name }]
    //  - menus: [{ id, name, amountStr, ownerId, sharedWith: [participantId,...] }]
    //    → 한 메뉴를 먹은 사람 집합 = { ownerId } ∪ sharedWith
    //    → 단독 메뉴면 sharedWith = []
    let mPidSeq = 4;  // participant id seq
    let menuSeq = 1;  // menu id seq

    function MenuMode() {
      const [participants, setParticipants] = useState([
        { id: 1, name: '' },
        { id: 2, name: '' },
        { id: 3, name: '' },
      ]);
      const [menus, setMenus] = useState([]);
      const [discountStr, setDiscountStr] = useState('');
      const [discountType, setDiscountType] = useState('amount'); // 'amount' | 'percent'

      // --- 참가자 관리 (인원 수만큼 추가/삭제) ---
      const addParticipant = () => setParticipants(ps => [...ps, { id: mPidSeq++, name: '' }]);
      const removeParticipant = (id) => {
        setParticipants(ps => ps.length > 1 ? ps.filter(p => p.id !== id) : ps);
        // 삭제된 참가자가 owner인 메뉴 제거, sharedWith에서도 제거
        setMenus(ms => ms
          .filter(m => m.ownerId !== id)
          .map(m => ({ ...m, sharedWith: m.sharedWith.filter(sid => sid !== id) })));
      };
      const updateParticipant = (id, name) =>
        setParticipants(ps => ps.map(p => p.id === id ? { ...p, name } : p));

      const nameOf = (id, idx) => {
        const p = participants.find(x => x.id === id);
        const i = participants.findIndex(x => x.id === id);
        return (p && p.name.trim()) || `참가자 ${i + 1}`;
      };

      // --- 메뉴 관리 (배열) ---
      const addMenu = (ownerId) =>
        setMenus(ms => [...ms, { id: menuSeq++, name: '', amountStr: '', ownerId, sharedWith: [] }]);
      const removeMenu = (id) => setMenus(ms => ms.filter(m => m.id !== id));
      const updateMenu = (id, patch) => setMenus(ms => ms.map(m => m.id === id ? { ...m, ...patch } : m));
      const toggleShared = (menuId, pid) =>
        setMenus(ms => ms.map(m => {
          if (m.id !== menuId) return m;
          const has = m.sharedWith.includes(pid);
          return { ...m, sharedWith: has ? m.sharedWith.filter(x => x !== pid) : [...m.sharedWith, pid] };
        }));

      // ============================
      // 정산 계산 (배열 + 반복문 + 조건분기)
      // ============================
      const result = useMemo(() => {
        // 1) 참가자별 "먹은 금액" 누적 초기화
        const eaten = {};            // pid -> 먹은 금액 합
        participants.forEach(p => { eaten[p.id] = 0; });

        let totalEaten = 0;
        const menuBreakdown = [];    // 메뉴별 분배 내역 (검증/표시용)

        // 2) 각 메뉴를 "함께 먹은 인원"으로 나눠 각자에게 분배 (반복문)
        for (const m of menus) {
          const amount = parseNumber(m.amountStr);
          // 먹은 사람 집합: owner + sharedWith (owner가 삭제되었을 수도 있으니 존재 확인)
          const eaterIds = [m.ownerId, ...m.sharedWith].filter(
            (id, idx, arr) => arr.indexOf(id) === idx && eaten[id] !== undefined
          );
          if (amount <= 0 || eaterIds.length === 0) {
            menuBreakdown.push({ id: m.id, amount, eaterIds, shares: [] });
            continue;
          }
          // 공유 메뉴: 나눠떨어지지 않으면 floor + 나머지 1원씩 분배 (조건분기)
          const { shares } = splitEvenly(amount, eaterIds.length);
          eaterIds.forEach((pid, i) => { eaten[pid] += shares[i]; });
          totalEaten += amount;
          menuBreakdown.push({ id: m.id, amount, eaterIds, shares });
        }

        // 3) 할인 계산 (조건분기: 금액 할인 vs 퍼센트 할인)
        const discountInput = parseNumber(discountStr);
        let discountAmount = 0;
        if (discountType === 'percent') {
          // 퍼센트는 0~100 범위로 클램프 후 원 단위로 변환 (먼저 정수화)
          const pct = Math.min(100, Math.max(0, discountInput));
          discountAmount = Math.floor((totalEaten * pct) / 100);
        } else {
          discountAmount = discountInput;
        }
        // 할인이 총액보다 클 수 없음 (음수 부담 방지)
        discountAmount = Math.min(discountAmount, totalEaten);

        // 4) 할인액을 "각자 먹은 금액 비율"로 안분 (가중 비례 분배 → 합 === discountAmount)
        const orderedIds = participants.map(p => p.id);
        const weights = orderedIds.map(id => eaten[id]);
        const discountShares = distributeProportional(discountAmount, weights);

        // 5) 최종 부담액 = 먹은 금액 − 할인 분배액 (반복문)
        const rows = participants.map((p, idx) => {
          const eat = eaten[p.id];
          const disc = discountShares[idx];
          return {
            id: p.id,
            name: (p.name.trim() || `참가자 ${idx + 1}`),
            eaten: eat,
            discount: disc,
            final: eat - disc,
          };
        });

        const finalSum = rows.reduce((s, r) => s + r.final, 0);
        const expectedFinal = totalEaten - discountAmount;

        return {
          rows, totalEaten, discountAmount, finalSum, expectedFinal,
          menuBreakdown, discountSum: discountShares.reduce((a, b) => a + b, 0),
        };
      }, [participants, menus, discountStr, discountType]);

      const hasData = result.totalEaten > 0;
      const np = participants.length;

      return (
        <div className="space-y-4 animate-fade-in">
          {/* 안내 */}
          <Card className="bg-phantom-lavSoft shadow-none">
            <p className="text-[13px] text-phantom-muted leading-relaxed">
              각자 먹은 메뉴를 추가하세요. 한 메뉴를 여러 명이 나눠 먹었다면 <span className="font-bold text-phantom-ink">함께 먹은 사람</span>을 선택하면 그 인원으로 나눠 부담합니다.
            </p>
          </Card>

          {/* 참가자 + 메뉴 */}
          <Card>
            <SectionTitle icon="🧑‍🤝‍🧑" right={<Button variant="secondary" size="sm" onClick={addParticipant}>+ 인원 추가</Button>}>
              참가자 <Badge>{np}명</Badge>
            </SectionTitle>

            <div className="space-y-3">
              {participants.map((p, idx) => {
                const myMenus = menus.filter(m => m.ownerId === p.id);
                return (
                  <div key={p.id} className="bg-phantom-cream rounded-2xl p-3.5">
                    {/* 참가자 헤더 */}
                    <div className="flex gap-2 items-center">
                      <span className="text-phantom-faint text-[13px]">👤</span>
                      <input
                        value={p.name}
                        onChange={(e) => updateParticipant(p.id, e.target.value)}
                        placeholder={`참가자 ${idx + 1}`}
                        className="flex-1 bg-transparent outline-none text-phantom-ink font-bold text-[14px] placeholder:text-phantom-faint/60 placeholder:font-normal border-b-2 border-transparent focus:border-phantom-lav py-1"
                      />
                      <Button variant="danger" size="icon" onClick={() => removeParticipant(p.id)} disabled={np <= 1} aria-label="참가자 삭제">×</Button>
                    </div>

                    {/* 메뉴 목록 */}
                    <div className="mt-2 space-y-2 pl-1">
                      {myMenus.length === 0 && (
                        <p className="text-[12px] text-phantom-faint/70 pl-5">아직 추가된 메뉴가 없어요</p>
                      )}
                      {myMenus.map((m) => (
                        <div key={m.id} className="bg-white rounded-2xl p-3 shadow-softer">
                          <div className="flex gap-2 items-center">
                            <span className="text-phantom-faint text-[13px]">🍽️</span>
                            <input
                              value={m.name}
                              onChange={(e) => updateMenu(m.id, { name: e.target.value })}
                              placeholder="메뉴 이름"
                              className="flex-1 min-w-0 bg-transparent outline-none text-phantom-ink text-[14px] font-medium placeholder:text-phantom-faint/60 placeholder:font-normal"
                            />
                            <div className="flex items-center bg-phantom-lavSoft rounded-xl px-2.5 w-[110px]">
                              <span className="text-phantom-faint text-[13px] mr-0.5">₩</span>
                              <input
                                inputMode="numeric"
                                value={m.amountStr}
                                onChange={(e) => updateMenu(m.id, { amountStr: withCommas(e.target.value) })}
                                placeholder="0"
                                className="flex-1 min-w-0 bg-transparent outline-none text-phantom-ink text-[14px] font-medium text-right placeholder:text-phantom-faint/60 placeholder:font-normal py-2"
                              />
                            </div>
                            <Button variant="danger" size="icon" className="w-8 h-8 text-base" onClick={() => removeMenu(m.id)} aria-label="메뉴 삭제">×</Button>
                          </div>

                          {/* 함께 먹은 사람 선택 (공유 메뉴) */}
                          {np > 1 && (
                            <div className="mt-2.5 pl-5">
                              <p className="text-[11px] text-phantom-faint mb-1.5">함께 먹은 사람 (선택 시 나눠서 부담)</p>
                              <div className="flex flex-wrap gap-1.5">
                                {participants.filter(o => o.id !== p.id).map((o) => {
                                  const on = m.sharedWith.includes(o.id);
                                  return (
                                    <button
                                      key={o.id}
                                      onClick={() => toggleShared(m.id, o.id)}
                                      className={`text-[12px] font-semibold px-2.5 py-1.5 rounded-full transition-colors ${
                                        on
                                          ? 'bg-phantom-lav text-phantom-ink'
                                          : 'bg-phantom-lavSoft text-phantom-muted hover:bg-phantom-lavSoft2'
                                      }`}
                                    >
                                      {on ? '✓ ' : ''}{nameOf(o.id)}
                                    </button>
                                  );
                                })}
                              </div>
                              {m.sharedWith.length > 0 && parseNumber(m.amountStr) > 0 && (
                                <p className="text-[11px] text-phantom-muted mt-1.5">
                                  {m.sharedWith.length + 1}명이 나눠 → 1인당 약 {formatKRW(Math.floor(parseNumber(m.amountStr) / (m.sharedWith.length + 1)))}
                                </p>
                              )}
                            </div>
                          )}
                        </div>
                      ))}

                      <Button variant="ghost" size="sm" className="w-full justify-start text-phantom-faint" onClick={() => addMenu(p.id)}>
                        + 메뉴 추가
                      </Button>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>

          {/* 할인 */}
          <Card>
            <SectionTitle icon="🎟️">할인 적용</SectionTitle>
            <div className="flex gap-2 items-stretch">
              <div className="flex bg-phantom-lavSoft rounded-full p-1">
                <button
                  onClick={() => setDiscountType('amount')}
                  className={`px-3.5 rounded-full text-[13px] font-semibold transition-colors ${discountType === 'amount' ? 'bg-phantom-lav text-phantom-ink' : 'text-phantom-muted hover:text-phantom-ink'}`}
                >₩ 금액</button>
                <button
                  onClick={() => setDiscountType('percent')}
                  className={`px-3.5 rounded-full text-[13px] font-semibold transition-colors ${discountType === 'percent' ? 'bg-phantom-lav text-phantom-ink' : 'text-phantom-muted hover:text-phantom-ink'}`}
                >% 퍼센트</button>
              </div>
              <Input
                className="flex-1"
                value={discountStr}
                onChange={(e) => setDiscountStr(withCommas(e.target.value))}
                placeholder="0"
                suffix={discountType === 'percent' ? '%' : '원'}
              />
            </div>
            {result.discountAmount > 0 && (
              <p className="text-[12px] text-phantom-muted mt-2.5">
                총 {formatKRW(result.discountAmount)} 할인이 각자 먹은 금액 비율대로 안분됩니다.
              </p>
            )}
          </Card>

          {/* 요약 */}
          <Card className="bg-gradient-to-br from-phantom-lavSoft to-phantom-lavSoft2 shadow-none">
            <div className="grid grid-cols-3 gap-2 text-center">
              <div>
                <p className="text-[11px] text-phantom-muted font-medium">먹은 금액</p>
                <p className="font-bold text-phantom-ink mt-0.5 tabular-nums text-[14px]">{formatKRW(result.totalEaten)}</p>
              </div>
              <div>
                <p className="text-[11px] text-phantom-muted font-medium">할인</p>
                <p className="font-bold text-phantom-bad mt-0.5 tabular-nums text-[14px]">−{formatKRW(result.discountAmount)}</p>
              </div>
              <div>
                <p className="text-[11px] text-phantom-muted font-medium">실 부담 합계</p>
                <p className="font-bold text-phantom-ink mt-0.5 tabular-nums text-[14px]">{formatKRW(result.expectedFinal)}</p>
              </div>
            </div>
          </Card>

          {/* 개인별 결과 */}
          {hasData ? (
            <Card>
              <SectionTitle icon="🧾">개인별 부담액</SectionTitle>
              <div className="space-y-1">
                {result.rows.map((r) => (
                  <div key={r.id} className="flex items-center justify-between py-2.5 border-b border-phantom-line last:border-0">
                    <div>
                      <span className="font-semibold text-phantom-ink text-[14px]">{r.name}</span>
                      <span className="text-[12px] text-phantom-faint ml-2">
                        먹은 {formatKRW(r.eaten)}
                        {r.discount > 0 && <span className="text-phantom-bad"> · 할인 −{formatKRW(r.discount)}</span>}
                      </span>
                    </div>
                    <span className="font-bold text-phantom-ink tabular-nums">{formatKRW(r.final)}</span>
                  </div>
                ))}
              </div>

              {/* 검산: 정수 합계 무결성 */}
              <div className="mt-3 pt-3 border-t border-phantom-line space-y-2">
                <ChecksumRow label="부담액 합계 (검산)" value={result.finalSum} expected={result.expectedFinal} />
                <ChecksumRow label="할인 배분 합계 (검산)" value={result.discountSum} expected={result.discountAmount} />
              </div>
            </Card>
          ) : (
            <Card>
              <p className="text-phantom-faint text-[13px] text-center py-4">메뉴와 금액을 입력하면 개인별 부담액이 계산됩니다.</p>
            </Card>
          )}
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [mode, setMode] = useState('basic');
      // 강조색 hue: 첫 렌더(=페이지 로드)마다 랜덤으로 한 번 결정
      const [hue, setHue] = useState(() => pickHue());

      // hue가 바뀔 때마다 :root에 CSS 변수 주입 → 테마 전체가 한 번에 교체됨
      useEffect(() => {
        const vars = accentVars(hue);
        const root = document.documentElement;
        Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
      }, [hue]);

      return (
        <div className="min-h-screen pb-12">
          <div className="max-w-md mx-auto px-4 pt-8 sm:pt-10">
            <header className="mb-5 flex items-start justify-between gap-3">
              <div>
                <h1 className="text-[26px] font-extrabold text-phantom-ink flex items-center gap-2">
                  <span className="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-phantom-lav text-xl">💰</span>
                  더치페이 계산기
                </h1>
              </div>
              <Button
                variant="secondary"
                size="sm"
                className="shrink-0 mt-1"
                onClick={() => setHue(pickHue())}
                aria-label="강조 색상 랜덤 변경"
              >
                🎨 색상 바꾸기
              </Button>
            </header>

            <div className="mb-5">
              <SegmentedTabs
                active={mode}
                onChange={setMode}
                tabs={[
                  { value: 'basic', label: '기본 1/N' },
                  { value: 'settle', label: '참가자별 정산' },
                  { value: 'menu', label: '메뉴별 정산' },
                ]}
              />
            </div>

            {mode === 'basic' && <BasicMode />}
            {mode === 'settle' && <SettleMode />}
            {mode === 'menu' && <MenuMode />}

            <footer className="text-center text-[12px] text-phantom-faint mt-8">
              모든 금액은 원(₩) 단위 정수로 계산되며, 합계가 정확히 일치하도록 나머지를 분배합니다.
            </footer>
          </div>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
