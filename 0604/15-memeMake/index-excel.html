<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밈 생성기 — Excel Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body { font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif; }
    /* 밈 텍스트 스타일: Impact 느낌 + 흰 글씨 + 검은 외곽선 */
    .meme-text {
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-shadow:
        -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
        -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
        0 3px 4px rgba(0,0,0,0.6);
      word-break: keep-all;
    }
    /* 엑셀 그리드 배경 */
    .excel-grid-bg {
      background-image:
        linear-gradient(to right, #d4d4d4 1px, transparent 1px),
        linear-gradient(to bottom, #d4d4d4 1px, transparent 1px);
      background-size: 22px 22px;
    }
    ::-webkit-scrollbar { width: 14px; height: 14px; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border: 3px solid #f1f1f1; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    .cell-input:focus { outline: 2px solid #217346; outline-offset: -2px; z-index: 5; }
  </style>
</head>
<body class="bg-[#e6e6e6]">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 🧠 도메인 데이터 (기존 로직 동일)
    // ========================================
    const TEMPLATES = {
      ANAKIN_PADME: {
        id: "ANAKIN_PADME", name: "아나킨 & 파드메 (기대→현실 반전)", emoji: "🌌", slots: 4,
        slotLabels: ["1컷 — 기대 (아나킨)", "2컷 — 공감 (파드메)", "3컷 — 불안 (파드메)", "4컷 — 현실/침묵 (파드메)"],
        desc: "기대했다가 무너지는 반전. 처음엔 좋았는데 현실은 시궁창.",
      },
      UNO_DRAW25: {
        id: "UNO_DRAW25", name: "UNO Draw 25 (차라리 손해를)", emoji: "🃏", slots: 1,
        slotLabels: ["요구되는 행동 (카드 위 텍스트)"],
        desc: "극단적 선택을 거부하고 차라리 불이익(25장 뽑기)을 감수.",
      },
      DRAKE: {
        id: "DRAKE", name: "Drake (싫어함 vs 선호함)", emoji: "🙅", slots: 2,
        slotLabels: ["위 패널 — 거부하는 것 🙅", "아래 패널 — 선택하는 것 👉"],
        desc: "이것보다 저것이 낫다. 선호/비교/before vs after.",
      },
      WOMAN_CAT: {
        id: "WOMAN_CAT", name: "여자가 고양이에게 소리침 (갈등)", emoji: "😡", slots: 2,
        slotLabels: ["왼쪽 — 소리치는 말 😡", "오른쪽 — 고양이 반응 😼"],
        desc: "의견 충돌 / 세대 차이 / 회사·개발자 갈등 / 고객 vs 개발자.",
      },
    };
    const TEMPLATE_ORDER = ["ANAKIN_PADME", "UNO_DRAW25", "DRAKE", "WOMAN_CAT"];

    const CATEGORIES = [
      { value: "work", label: "💼 직장" },
      { value: "dev", label: "💻 개발" },
      { value: "invest", label: "📈 투자" },
      { value: "love", label: "💕 연애" },
      { value: "etc", label: "✨ 기타" },
    ];

    const KEYWORD_RULES = [
      { template: "WOMAN_CAT", reason: "갈등/충돌/언쟁 분위기가 느껴져요", keywords: ["갈등", "충돌", "싸움", "언쟁", "세대", "꼰대", "고객", "갑질", "다툼", "화남", "빡침", "짜증", "상사", "팀장", "회의", "탓", "책임", "남탓", "vs", "대립", "분노"] },
      { template: "DRAKE", reason: "비교/선호('이것보다 저것') 구도가 있어요", keywords: ["보다", "차라리", "낫다", "선호", "비교", "vs", "대신", "전환", "before", "after", "이직", "갈아탐", "바꿈", "선택", "취향", "추천"] },
      { template: "UNO_DRAW25", reason: "극단적 선택을 피하고 손해를 감수하는 상황이에요", keywords: ["차라리", "포기", "감수", "거부", "안함", "절대", "리스크", "위험", "회피", "도망", "버틴다", "안할래", "관둔다", "퇴사"] },
      { template: "ANAKIN_PADME", reason: "기대했다가 무너지는 반전 서사가 어울려요", keywords: ["기대", "실망", "반전", "현실", "처음", "줄알았", "그런데", "막상", "알고보니", "희망", "꿈", "결국", "시궁창", "망함", "속았", "줄 알았", "기대했"] },
    ];

    function recommendTemplate(text, category) {
      const t = (text || "").toLowerCase();
      const scores = {};
      TEMPLATE_ORDER.forEach((id) => (scores[id] = 0));
      const matchedReasons = {};
      KEYWORD_RULES.forEach((rule) => {
        rule.keywords.forEach((kw) => {
          if (t.includes(kw.toLowerCase())) {
            scores[rule.template] += 1;
            if (!matchedReasons[rule.template]) matchedReasons[rule.template] = rule.reason;
          }
        });
      });
      const catBias = { work: "WOMAN_CAT", dev: "WOMAN_CAT", invest: "ANAKIN_PADME", love: "DRAKE", etc: null };
      if (catBias[category]) scores[catBias[category]] += 0.4;
      let best = null, bestScore = 0;
      TEMPLATE_ORDER.forEach((id) => { if (scores[id] > bestScore) { bestScore = scores[id]; best = id; } });
      if (!best || bestScore <= 0) return null;
      return { template: best, reason: matchedReasons[best] || "입력 내용과 가장 잘 맞아요", score: bestScore };
    }

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function topicOf(text, category) {
      const cleaned = (text || "").trim().replace(/\s+/g, " ");
      if (cleaned) return cleaned.length > 22 ? cleaned.slice(0, 22) + "…" : cleaned;
      const fallback = { work: "이번 프로젝트", dev: "이 코드", invest: "내 포트폴리오", love: "우리 사이", etc: "이 상황" };
      return fallback[category] || "이 상황";
    }

    const CAT_FLAVOR = {
      work: { good: ["칼퇴", "성과급", "워라밸", "재택근무"], bad: ["야근", "주말출근", "성과면담", "추가업무"], villain: ["팀장님", "상무님", "고객사"], me: ["나"] },
      dev: { good: ["배포 성공", "버그 0개", "코드리뷰 통과", "테스트 그린"], bad: ["프로덕션 장애", "머지 충돌", "레거시 코드", "금요일 배포"], villain: ["QA", "기획자", "PM"], me: ["개발자"] },
      invest: { good: ["떡상", "익절", "배당금", "원금 회복"], bad: ["물타기", "손절", "마이너스", "강제 장기투자"], villain: ["증권사", "유튜버 추천"], me: ["나"] },
      love: { good: ["답장", "데이트", "기념일 챙김"], bad: ["읽씹", "잠수", "환승이별"], villain: ["전남친", "썸남"], me: ["나"] },
      etc: { good: ["성공", "행복", "여유"], bad: ["실패", "현타", "번아웃"], villain: ["세상", "현실"], me: ["나"] },
    };
    function flavor(category) { return CAT_FLAVOR[category] || CAT_FLAVOR.etc; }

    const GENERATORS = {
      ANAKIN_PADME(topic, category) {
        const f = flavor(category);
        const variants = [
          [`${topic}, 이번엔 진짜 잘 풀릴 거야`, `정말? 다행이다 🥹`, `정말 잘 풀리는 거 맞지…?`, ``],
          [`${topic} 끝나면 ${pick(f.good)} 가능하다며`, `우와 진짜 좋다!`, `진짜 가능한 거지…?`, ``],
          [`이번 ${topic}만 끝나면 인생 핀다`, `드디어 ${pick(f.good)}이네!`, `…핀다는 거 맞지?`, ``],
        ];
        return pick(variants);
      },
      UNO_DRAW25(topic, category) {
        const f = flavor(category);
        const variants = [
          `${topic} 다시 하기`, `${pick(f.bad)} 한 번 더`, `${topic} 인정하고 사과하기`,
          `${pick(f.villain)} 의견에 동의하기`, `${topic} 처음부터 다시`,
        ];
        return [pick(variants)];
      },
      DRAKE(topic, category) {
        const f = flavor(category);
        const variants = [
          [`${pick(f.bad)} 견디며 ${topic} 하기`, `깔끔하게 ${pick(f.good)} 택하기`],
          [`${topic} 정공법으로 풀기`, `${topic} 그냥 넘겨버리기`],
          [`${pick(f.villain)} 말 듣기`, `내 ${topic} 밀고 가기`],
          [`어제의 ${topic}`, `오늘의 ${pick(f.good)}`],
        ];
        return pick(variants);
      },
      WOMAN_CAT(topic, category) {
        const f = flavor(category);
        const variants = [
          [`${topic} 이거 누가 이렇게 한 거야!!`, `${pick(f.me)}: 그게 원래 그래요 😼`],
          [`${pick(f.villain)}: ${topic} 당장 고쳐!!`, `나: 그건 사양입니다 😼`],
          [`이 ${topic} 때문에 다 망했잖아!!`, `😼 흠… 그래서요?`],
          [`${topic} 책임자 나와!!`, `😼 (천천히 눈 깜빡)`],
        ];
        return pick(variants);
      },
    };
    function generateTexts(templateId, text, category) {
      return GENERATORS[templateId](topicOf(text, category), category);
    }

    // ========================================
    // 🖼️ 밈 렌더링 (기존 동일)
    // ========================================
    function MemeTextOverlay({ text, className = "", style = {} }) {
      return <div className={`meme-text ${className}`} style={style}>{text}</div>;
    }
    function AnakinPadme({ texts }) {
      const panels = [
        { emoji: "😎", bg: "from-sky-700 to-sky-900", label: "아나킨" },
        { emoji: "🙂", bg: "from-amber-600 to-amber-800", label: "파드메" },
        { emoji: "😟", bg: "from-rose-700 to-rose-900", label: "파드메" },
        { emoji: "😶", bg: "from-zinc-700 to-zinc-900", label: "파드메" },
      ];
      return (
        <div className="grid grid-cols-2 gap-1 bg-black p-1 aspect-square">
          {panels.map((p, i) => (
            <div key={i} className={`relative bg-gradient-to-br ${p.bg} flex flex-col items-center justify-end overflow-hidden`}>
              <div className="absolute top-2 left-2 text-[10px] text-white/60 font-bold">{p.label}</div>
              <div className="text-5xl sm:text-6xl mt-4 select-none">{p.emoji}</div>
              <MemeTextOverlay text={texts[i]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" />
            </div>
          ))}
        </div>
      );
    }
    function UnoDraw25({ texts }) {
      return (
        <div className="bg-gradient-to-br from-yellow-50 to-amber-100 aspect-square flex flex-col items-center justify-center p-6 gap-5">
          <MemeTextOverlay text={texts[0]} className="text-center text-lg sm:text-2xl px-2" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          <div className="text-3xl">⬇️</div>
          <div className="relative w-40 h-56 sm:w-48 sm:h-64 rounded-2xl bg-red-600 shadow-2xl border-4 border-white flex items-center justify-center rotate-[-6deg]">
            <div className="absolute inset-2 rounded-xl border-2 border-white/40"></div>
            <div className="text-center">
              <div className="text-white font-black text-2xl sm:text-3xl leading-tight" style={{ textShadow: "2px 2px 0 #00000055" }}>DRAW</div>
              <div className="text-white font-black text-5xl sm:text-6xl leading-none" style={{ textShadow: "2px 2px 0 #00000055" }}>25</div>
              <div className="mt-2 text-white text-3xl">🃏</div>
            </div>
            <div className="absolute top-1.5 left-2 text-white font-black text-lg">+25</div>
            <div className="absolute bottom-1.5 right-2 text-white font-black text-lg rotate-180">+25</div>
          </div>
          <div className="text-sm font-bold text-zinc-700">나: 그냥 25장 뽑고 만다 😤</div>
        </div>
      );
    }
    function Drake({ texts }) {
      return (
        <div className="grid grid-cols-2 grid-rows-2 aspect-square bg-black gap-1 p-1">
          <div className="bg-gradient-to-br from-orange-300 to-orange-400 flex items-center justify-center relative">
            <div className="text-6xl sm:text-7xl select-none">🙅‍♂️</div>
            <div className="absolute bottom-1 right-1 text-xs">🚫</div>
          </div>
          <div className="bg-zinc-100 flex items-center justify-center p-3">
            <MemeTextOverlay text={texts[0]} className="text-center text-sm sm:text-lg" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
          <div className="bg-gradient-to-br from-amber-400 to-amber-500 flex items-center justify-center relative">
            <div className="text-6xl sm:text-7xl select-none">👉😎</div>
          </div>
          <div className="bg-zinc-100 flex items-center justify-center p-3">
            <MemeTextOverlay text={texts[1]} className="text-center text-sm sm:text-lg" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
        </div>
      );
    }
    function WomanCat({ texts }) {
      return (
        <div className="grid grid-cols-2 aspect-square bg-black gap-1 p-1">
          <div className="relative bg-gradient-to-br from-rose-200 to-rose-400 flex flex-col items-center justify-end overflow-hidden">
            <div className="text-6xl sm:text-7xl mt-6 select-none">😡👈</div>
            <MemeTextOverlay text={texts[0]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" />
          </div>
          <div className="relative bg-gradient-to-br from-slate-200 to-slate-400 flex flex-col items-center justify-end overflow-hidden">
            <div className="absolute top-2 right-2 text-2xl">🍽️</div>
            <div className="text-6xl sm:text-7xl mt-6 select-none">😼</div>
            <MemeTextOverlay text={texts[1]} className="text-center px-2 pb-3 pt-2 text-sm sm:text-base" style={{ color: "#1f2937", textShadow: "1px 1px 0 #fff, -1px -1px 0 #fff" }} />
          </div>
        </div>
      );
    }
    function MemeCanvas({ templateId, texts, innerRef }) {
      const Comp = { ANAKIN_PADME: AnakinPadme, UNO_DRAW25: UnoDraw25, DRAKE: Drake, WOMAN_CAT: WomanCat }[templateId];
      return (
        <div ref={innerRef} className="w-full max-w-md mx-auto select-none border border-zinc-400 shadow-md">
          <Comp texts={texts} />
        </div>
      );
    }

    // ========================================
    // 📊 엑셀 UI 프리미티브
    // ========================================
    // 리본 탭
    function RibbonTab({ active, children }) {
      return (
        <div className={`px-3 py-1 text-xs cursor-default ${active ? "bg-white border border-b-white border-[#d4d4d4] -mb-px text-[#217346] font-semibold" : "text-gray-700 hover:bg-[#eaeaea]"}`}>
          {children}
        </div>
      );
    }
    // 리본 버튼 (큰 아이콘)
    function RibbonButton({ icon, label, onClick, disabled, accent }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`flex flex-col items-center justify-start gap-0.5 px-2 py-1 rounded min-w-[52px] text-[11px] leading-tight
            ${disabled ? "opacity-40 cursor-not-allowed" : "hover:bg-[#d3ecd9] cursor-pointer"}
            ${accent ? "text-[#217346] font-semibold" : "text-gray-700"}`}>
          <span className="text-xl">{icon}</span>
          <span className="text-center whitespace-pre-line">{label}</span>
        </button>
      );
    }
    function RibbonGroup({ title, children }) {
      return (
        <div className="flex flex-col items-center border-r border-[#d4d4d4] px-2 h-full">
          <div className="flex items-stretch gap-0.5 flex-1 items-center">{children}</div>
          <div className="text-[10px] text-gray-500 mt-0.5">{title}</div>
        </div>
      );
    }
    // 셀
    function Cell({ children, className = "", header, rowHeader, w }) {
      const base = "border-r border-b border-[#d4d4d4] px-1.5 py-1 text-xs flex items-center";
      if (header) return <div className={`${base} bg-[#f3f3f3] justify-center font-semibold text-gray-600 text-[11px] ${className}`} style={{ width: w }}>{children}</div>;
      if (rowHeader) return <div className={`${base} bg-[#f3f3f3] justify-center font-semibold text-gray-600 text-[11px] w-9 flex-shrink-0`}>{children}</div>;
      return <div className={`${base} bg-white ${className}`} style={{ width: w }}>{children}</div>;
    }

    // ========================================
    // 📄 메인 App
    // ========================================
    function App() {
      const [text, setText] = useState("");
      const [category, setCategory] = useState("work");
      const [templateChoice, setTemplateChoice] = useState("AUTO");
      const [activeTemplate, setActiveTemplate] = useState(null);
      const [texts, setTexts] = useState([]);
      const [recommendation, setRecommendation] = useState(null);
      const [downloading, setDownloading] = useState(false);
      const [activeCell, setActiveCell] = useState("B2");
      const lastTemplateRef = useRef(null);
      const memeRef = useRef(null);

      useEffect(() => { setRecommendation(recommendTemplate(text, category)); }, [text, category]);

      const pickRandomTemplate = useCallback(() => {
        let pool = TEMPLATE_ORDER.filter((id) => id !== lastTemplateRef.current);
        if (pool.length === 0) pool = TEMPLATE_ORDER;
        return pool[Math.floor(Math.random() * pool.length)];
      }, []);

      const resolveTemplate = useCallback(() => {
        if (templateChoice !== "AUTO") return templateChoice;
        const rec = recommendTemplate(text, category);
        if (rec) return rec.template;
        return pickRandomTemplate();
      }, [templateChoice, text, category, pickRandomTemplate]);

      const handleGenerate = useCallback(() => {
        const tpl = resolveTemplate();
        setActiveTemplate(tpl);
        setTexts(generateTexts(tpl, text, category));
        lastTemplateRef.current = tpl;
      }, [resolveTemplate, text, category]);

      const handleRegenerate = useCallback(() => {
        if (!activeTemplate) return handleGenerate();
        setTexts(generateTexts(activeTemplate, text, category));
      }, [activeTemplate, text, category, handleGenerate]);

      const updateSlot = (i, val) => setTexts((prev) => prev.map((t, idx) => (idx === i ? val : t)));

      const handleDownload = useCallback(async () => {
        if (!memeRef.current || !window.html2canvas) return;
        setDownloading(true);
        try {
          const canvas = await window.html2canvas(memeRef.current, { backgroundColor: "#000000", scale: 2, useCORS: true, logging: false });
          const link = document.createElement("a");
          link.download = `meme-${activeTemplate}-${Date.now()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (e) {
          alert("이미지 생성 중 오류: " + e.message);
        } finally { setDownloading(false); }
      }, [activeTemplate]);

      const activeTplMeta = activeTemplate ? TEMPLATES[activeTemplate] : null;
      const formulaValue = activeTplMeta
        ? `=MEME("${activeTplMeta.name}"; "${category}"; "${(text || "(빈 주제)").slice(0, 30)}")`
        : `=MEME(템플릿; 카테고리; 주제)`;

      return (
        <div className="min-h-screen flex flex-col text-gray-800">
          {/* 1. 타이틀 바 */}
          <div className="bg-[#217346] text-white flex items-center justify-between px-3 h-8 text-xs select-none">
            <div className="flex items-center gap-2">
              <span className="bg-white text-[#217346] font-black px-1.5 py-0.5 rounded-sm text-[11px]">X</span>
              <span>밈생성기.xlsx — Excel</span>
            </div>
            <div className="flex gap-3 text-white/80">
              <span>—</span><span>▢</span><span>✕</span>
            </div>
          </div>

          {/* 2. 리본 탭 줄 */}
          <div className="bg-[#f3f3f3] flex items-end gap-0 px-2 pt-1 border-b border-[#d4d4d4] text-[12px]">
            <RibbonTab>파일</RibbonTab>
            <RibbonTab active>홈</RibbonTab>
            <RibbonTab>삽입</RibbonTab>
            <RibbonTab>페이지 레이아웃</RibbonTab>
            <RibbonTab>수식</RibbonTab>
            <RibbonTab>데이터</RibbonTab>
            <RibbonTab>보기</RibbonTab>
          </div>

          {/* 3. 리본 본문 */}
          <div className="bg-white border-b border-[#d4d4d4] flex items-stretch px-2 py-1.5 gap-1 overflow-x-auto" style={{ minHeight: 76 }}>
            <RibbonGroup title="실행">
              <RibbonButton icon="✨" label={"밈\n생성"} accent onClick={handleGenerate} />
              <RibbonButton icon="🔄" label={"다시\n생성"} onClick={handleRegenerate} disabled={!activeTemplate} />
            </RibbonGroup>
            <RibbonGroup title="저장">
              <RibbonButton icon="🖼️" label={"PNG\n내보내기"} onClick={handleDownload} disabled={!activeTemplate || downloading} />
            </RibbonGroup>
            <RibbonGroup title="카테고리">
              <select value={category} onChange={(e) => setCategory(e.target.value)}
                className="border border-[#d4d4d4] rounded text-xs px-2 py-1 bg-white hover:border-[#217346] focus:outline-none focus:border-[#217346]">
                {CATEGORIES.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
              </select>
            </RibbonGroup>
            <RibbonGroup title="템플릿">
              <select value={templateChoice} onChange={(e) => setTemplateChoice(e.target.value)}
                className="border border-[#d4d4d4] rounded text-xs px-2 py-1 bg-white hover:border-[#217346] focus:outline-none focus:border-[#217346] max-w-[200px]">
                <option value="AUTO">🎲 자동 (추천/랜덤)</option>
                {TEMPLATE_ORDER.map((id) => <option key={id} value={id}>{TEMPLATES[id].emoji} {TEMPLATES[id].name}</option>)}
              </select>
            </RibbonGroup>
            {templateChoice === "AUTO" && (
              <div className="flex items-center px-3 text-[11px] text-gray-600 max-w-[260px]">
                {recommendation
                  ? <span>📌 추천: <b className="text-[#217346]">{TEMPLATES[recommendation.template].emoji} {TEMPLATES[recommendation.template].name}</b><br/><span className="text-gray-500">💡 {recommendation.reason}</span></span>
                  : <span className="text-gray-400">⌨️ 셀에 주제를 입력하면 템플릿을 추천합니다.</span>}
              </div>
            )}
          </div>

          {/* 4. 수식 입력줄 */}
          <div className="bg-white border-b border-[#d4d4d4] flex items-stretch text-xs">
            <div className="w-16 border-r border-[#d4d4d4] flex items-center justify-center bg-[#f3f3f3] font-mono text-gray-600">{activeCell}</div>
            <div className="w-8 border-r border-[#d4d4d4] flex items-center justify-center text-gray-400 italic">fx</div>
            <div className="flex-1 px-2 py-1 font-mono text-gray-700 truncate flex items-center">{formulaValue}</div>
          </div>

          {/* 5. 스프레드시트 본문 */}
          <div className="flex-1 bg-[#e6e6e6] overflow-auto">
            {/* 열 헤더 */}
            <div className="flex sticky top-0 z-10">
              <div className="w-9 bg-[#f3f3f3] border-r border-b border-[#d4d4d4] flex-shrink-0"></div>
              {["A", "B", "C", "D"].map((c, i) => (
                <Cell key={c} header w={i === 1 ? 380 : 150}>{c}</Cell>
              ))}
            </div>

            {/* 행 1: 주제 입력 */}
            <div className="flex">
              <Cell rowHeader>1</Cell>
              <Cell w={150} className="text-gray-500 font-semibold">주제·상황·감정</Cell>
              <div className="border-r border-b border-[#d4d4d4] bg-white" style={{ width: 380 }}>
                <input
                  className="cell-input w-full h-full px-1.5 py-1 text-xs bg-transparent"
                  value={text}
                  onFocus={() => setActiveCell("B1")}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="예) 금요일 오후에 프로덕션 배포하자는 팀장님" />
              </div>
              <Cell w={150} className="text-gray-400">← 여기에 입력</Cell>
            </div>

            {/* 행 2~: 슬롯(밈 문구) */}
            {activeTemplate ? (
              texts.map((t, i) => (
                <div className="flex" key={i}>
                  <Cell rowHeader>{i + 2}</Cell>
                  <Cell w={150} className="text-gray-500">{activeTplMeta.slotLabels[i]}</Cell>
                  <div className="border-r border-b border-[#d4d4d4] bg-white" style={{ width: 380 }}>
                    <input
                      className="cell-input w-full h-full px-1.5 py-1 text-xs bg-transparent"
                      value={t}
                      onFocus={() => setActiveCell("B" + (i + 2))}
                      onChange={(e) => updateSlot(i, e.target.value)}
                      placeholder="문구 입력…" />
                  </div>
                  <Cell w={150} className="text-gray-400 text-[10px]">슬롯 {i + 1}</Cell>
                </div>
              ))
            ) : (
              <div className="flex">
                <Cell rowHeader>2</Cell>
                <Cell w={150} className="text-gray-400">(생성 대기)</Cell>
                <Cell w={380} className="text-gray-400">리본의 <b className="mx-1 text-[#217346]">✨ 밈 생성</b> 을 누르세요</Cell>
                <Cell w={150}></Cell>
              </div>
            )}

            {/* 빈 행 몇 개 (엑셀 느낌) */}
            {Array.from({ length: 6 }).map((_, r) => (
              <div className="flex" key={"empty" + r}>
                <Cell rowHeader>{(activeTemplate ? texts.length : 1) + 2 + r}</Cell>
                {[150, 380, 150].map((w, ci) => <Cell key={ci} w={w}></Cell>)}
              </div>
            ))}

            {/* 미리보기 패널 (시트 위에 떠 있는 차트처럼) */}
            <div className="p-4">
              <div className="inline-block bg-white border border-[#d4d4d4] shadow-lg rounded-sm">
                <div className="bg-[#f3f3f3] border-b border-[#d4d4d4] px-3 py-1.5 text-xs font-semibold text-gray-600 flex items-center gap-2">
                  📊 차트 1 — 밈 미리보기 {activeTplMeta && <span className="text-gray-400 font-normal">· {activeTplMeta.emoji} {activeTplMeta.name}</span>}
                </div>
                <div className="p-4">
                  {activeTemplate ? (
                    <MemeCanvas templateId={activeTemplate} texts={texts} innerRef={memeRef} />
                  ) : (
                    <div className="w-[300px] h-[300px] excel-grid-bg flex flex-col items-center justify-center text-gray-400 gap-2 border border-dashed border-gray-300">
                      <span className="text-4xl">🪄</span>
                      <p className="text-xs">밈을 생성하면 여기에 표시됩니다</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* 6. 시트 탭 */}
          <div className="bg-[#f3f3f3] border-t border-[#d4d4d4] flex items-center text-xs h-7 px-1 select-none">
            <div className="flex items-center gap-1 px-2 text-gray-500">◀ ▶</div>
            <div className="bg-white border border-b-0 border-[#d4d4d4] px-3 py-1 text-[#217346] font-semibold rounded-t-sm">밈Sheet1</div>
            <div className="px-3 py-1 text-gray-500 hover:bg-[#eaeaea] cursor-default">Sheet2</div>
            <div className="px-2 text-gray-400 cursor-default hover:text-[#217346]">＋</div>
          </div>

          {/* 7. 상태 표시줄 */}
          <div className="bg-[#217346] text-white flex items-center justify-between px-3 h-6 text-[11px] select-none">
            <div className="flex items-center gap-4">
              <span>준비</span>
              {activeTemplate && <span>슬롯 {texts.length}개</span>}
            </div>
            <div className="flex items-center gap-4">
              <span>오프라인 · 브라우저 처리</span>
              <span>합계: 🤣 100%</span>
              <span>100%</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
