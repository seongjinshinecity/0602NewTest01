<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGE · 크롬 나이계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ========================================
       Hajime Sorayama 풍 크롬/메탈릭 스타일
       — 거울처럼 반사되는 은빛 표면, 차가운 미래주의
       ======================================== */

    body { background: #050608; }

    /* 크롬 텍스트: 은빛 그라데이션을 글자에 입힘 */
    .chrome-text {
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #d9dee6 18%,
        #9aa3b0 38%,
        #5b6472 50%,
        #c3cad4 62%,
        #ffffff 78%,
        #8e96a3 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }

    /* 금속 표면: 비스듬한 하이라이트가 흐르는 패널 */
    .chrome-surface {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 40%),
        linear-gradient(160deg, #2a2f37 0%, #14171c 45%, #0a0c0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(0,0,0,0.6),
        0 30px 60px -20px rgba(0,0,0,0.9);
    }

    /* 크롬 버튼: 위쪽이 밝고 아래로 어두워지는 볼록한 금속 */
    .chrome-btn {
      background: linear-gradient(180deg, #f4f6f9 0%, #c4ccd6 30%, #8b94a1 55%, #5a626e 75%, #aab2bd 100%);
      color: #0a0c0f;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -2px 4px rgba(0,0,0,0.5),
        0 12px 24px -8px rgba(0,0,0,0.8);
      transition: transform 0.12s ease, filter 0.2s ease;
    }
    .chrome-btn:hover { filter: brightness(1.08); }
    .chrome-btn:active { transform: translateY(2px) scale(0.99); filter: brightness(0.95); }

    /* 날짜 입력: 어두운 금속 홈에 박힌 듯한 인셋 */
    .chrome-input {
      background: linear-gradient(180deg, #0a0c0f 0%, #161a20 100%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 -1px 0 rgba(255,255,255,0.06);
      color: #e6ebf2;
      color-scheme: dark; /* 네이티브 달력 아이콘을 밝게 */
    }
    .chrome-input:focus {
      outline: none;
      border-color: rgba(220, 228, 240, 0.6);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 0 0 3px rgba(180,190,205,0.25);
    }

    /* 배경에 은은히 도는 금속 반사광 */
    .glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(60% 50% at 50% -10%, rgba(150,170,200,0.18), transparent 70%),
        radial-gradient(40% 40% at 85% 110%, rgba(120,140,170,0.12), transparent 70%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <div class="glow"></div>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    // ========================================
    // 🔧 나이 계산 로직
    // ========================================

    // 만 나이: 생일이 지났으면 (올해-출생연도), 아니면 그보다 1살 적음
    function calcInternationalAge(birth, today) {
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      // 아직 이번 달 생일 전이거나, 생일 달이지만 날짜가 안 됐으면 -1
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
        age -= 1;
      }
      return age;
    }

    // 세는 나이(한국식 "현재 나이"): 올해 - 출생연도 + 1
    function calcKoreanAge(birth, today) {
      return today.getFullYear() - birth.getFullYear() + 1;
    }

    // 태어난 뒤 살아온 총 일수
    function calcDaysAlive(birth, today) {
      const ms = today.getTime() - birth.getTime();
      return Math.floor(ms / (1000 * 60 * 60 * 24));
    }

    // 다음 생일까지 남은 일수 (오늘이 생일이면 0)
    function calcDaysToBirthday(birth, today) {
      const y = today.getFullYear();
      let next = new Date(y, birth.getMonth(), birth.getDate());
      const start = new Date(y, today.getMonth(), today.getDate());
      if (next < start) next = new Date(y + 1, birth.getMonth(), birth.getDate());
      return Math.round((next - start) / (1000 * 60 * 60 * 24));
    }

    // 'YYYY-MM-DD' 문자열을 로컬 자정 기준 Date 로 (타임존 밀림 방지)
    function parseBirth(str) {
      if (!str) return null;
      const [y, m, d] = str.split('-').map(Number);
      if (!y || !m || !d) return null;
      const date = new Date(y, m - 1, d);
      // 2월 30일 같은 잘못된 날짜를 걸러냄
      if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) {
        return null;
      }
      return date;
    }

    // ========================================
    // 🎨 컴포넌트
    // ========================================

    // 결과 한 칸: 큰 크롬 숫자 + 라벨
    function ResultCell({ label, value, unit, sub }) {
      return (
        <div className="chrome-surface rounded-2xl px-5 py-6 text-center">
          <div className="text-[11px] font-bold uppercase tracking-[0.25em] text-slate-400">
            {label}
          </div>
          <div className="mt-2 flex items-end justify-center gap-1">
            <span className="chrome-text text-5xl font-black leading-none">{value}</span>
            {unit && <span className="chrome-text text-xl font-bold pb-1">{unit}</span>}
          </div>
          {sub && <div className="mt-2 text-xs text-slate-500">{sub}</div>}
        </div>
      );
    }

    // ========================================
    // 📄 나이계산기 페이지
    // ========================================

    function AgeCalculator() {
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      const [input, setInput] = useState('');   // 입력 중인 생년월일
      const [result, setResult] = useState(null); // 계산 결과
      const [error, setError] = useState('');

      const handleCalc = useCallback(() => {
        const birth = parseBirth(input);
        if (!birth) {
          setError('올바른 생년월일을 입력해 주세요.');
          setResult(null);
          return;
        }
        const now = new Date();
        if (birth > now) {
          setError('미래의 날짜는 계산할 수 없어요.');
          setResult(null);
          return;
        }
        setError('');
        setResult({
          korean: calcKoreanAge(birth, now),
          intl: calcInternationalAge(birth, now),
          days: calcDaysAlive(birth, now),
          toBirthday: calcDaysToBirthday(birth, now),
        });
      }, [input]);

      // Enter 키로도 계산
      const handleKey = useCallback((e) => {
        if (e.key === 'Enter') handleCalc();
      }, [handleCalc]);

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            {/* 헤더 */}
            <header className="text-center mb-8">
              <h1 className="chrome-text text-5xl sm:text-6xl font-black tracking-tight">
                AGE
              </h1>
              <p className="mt-3 text-sm text-slate-400 tracking-[0.3em] uppercase">
                Chrome Age Calculator
              </p>
              <p className="mt-1 text-xs text-slate-600">
                생년월일을 입력하면 현재 나이와 만 나이를 계산해요
              </p>
            </header>

            {/* 입력 패널 */}
            <div className="chrome-surface rounded-3xl p-6 sm:p-8">
              <label className="block text-[11px] font-bold uppercase tracking-[0.25em] text-slate-400 mb-3">
                생년월일
              </label>
              <input
                type="date"
                value={input}
                max={todayStr}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKey}
                className="chrome-input w-full rounded-xl px-4 py-3.5 text-lg font-mono tracking-wide"
              />

              <button
                type="button"
                onClick={handleCalc}
                className="chrome-btn w-full mt-5 rounded-xl py-4 text-base font-black uppercase tracking-[0.2em]"
              >
                나이 계산
              </button>

              {error && (
                <p className="mt-4 text-center text-sm text-rose-400/90">{error}</p>
              )}
            </div>

            {/* 결과 */}
            {result && (
              <div className="mt-6 space-y-4">
                <div className="grid grid-cols-2 gap-4">
                  <ResultCell label="현재 나이" value={result.korean} unit="세" sub="세는 나이" />
                  <ResultCell label="만 나이" value={result.intl} unit="세" sub="국제 기준" />
                </div>
                <div className="chrome-surface rounded-2xl px-5 py-4 flex items-center justify-between text-sm">
                  <span className="text-slate-400">살아온 날</span>
                  <span className="chrome-text font-bold text-lg">
                    {result.days.toLocaleString()}일
                  </span>
                </div>
                <div className="chrome-surface rounded-2xl px-5 py-4 flex items-center justify-between text-sm">
                  <span className="text-slate-400">다음 생일까지</span>
                  <span className="chrome-text font-bold text-lg">
                    {result.toBirthday === 0 ? '🎉 오늘!' : `${result.toBirthday}일`}
                  </span>
                </div>
              </div>
            )}

            <footer className="text-center mt-8 text-[11px] text-slate-600">
              현재 나이 = 올해 − 출생연도 + 1 · 만 나이 = 생일 기준 국제 나이
            </footer>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 렌더링
    // ========================================

    function App() {
      return <AgeCalculator />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
