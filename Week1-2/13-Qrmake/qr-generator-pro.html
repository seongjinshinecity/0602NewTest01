<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR 코드 생성기 PRO</title>

  <!-- ========================================
       PWA 메타 태그
       - theme-color: 주소창/스플래시 색상
       - apple-mobile-web-app-* : iOS 홈화면 앱 동작
       ======================================== -->
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR PRO" />
  <meta name="description" content="색상/로고/이력/PWA를 지원하는 고급 QR 코드 생성기" />

  <!-- 인라인 SVG data URI 파비콘 (앱 아이콘으로도 재사용) -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white'%3E%E2%96%A6%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CSS (다크모드는 class 전략 사용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- React 18 / ReactDOM / Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ========================================
       QR 코드 라이브러리 (qr-code-styling)
       - 전역 객체: QRCodeStyling
       - 색상 커스터마이즈 / 배경색 / 중앙 로고 / PNG·SVG 다운로드 지원
       - 기존 qrcodejs 대비 기능이 풍부하여 교체
       ======================================== -->
  <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>

  <style>
    /* QR 박스가 나타날 때 부드러운 페이드인 (Tailwind keyframe 표현 어려움) */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out; }
    /* 네이티브 color input 의 크롬 패딩 제거 (커스텀 컬러 스와치용) */
    input[type="color"] { -webkit-appearance: none; appearance: none; padding: 0; border: none; background: none; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
  <div id="root"></div>

  <!-- ========================================
       PWA 부트스트랩 (단일 파일 제약 안에서 구성)

       [실행 환경 안내]
       - file:// 로 직접 열면 서비스워커는 절대 동작하지 않습니다.
       - PWA 설치/오프라인을 시험하려면 반드시 로컬 서버에서 여세요.
         예: 이 폴더에서  npx serve .   →  http://localhost:3000

       [중요/정직한 한계]
       - 서비스워커 스크립트 URL 은 http/https 스킴이어야만 등록됩니다.
         Blob URL(blob:) 로 만든 SW 는 localhost·HTTPS 를 포함해 모든
         환경에서 register() 가 거부됩니다. 따라서 아래 등록은 사실상 항상
         catch 로 떨어지며(요구사항대로 graceful 하게 경고만 남김), 단일
         파일만으로는 진짜 오프라인 캐싱/설치형 PWA 가 성립하지 않습니다.
       - 반면 Blob 매니페스트 + theme-color 메타는 정상 동작하여
         앱 이름/색상/아이콘 등 "앱 아이덴티티"는 실제로 적용됩니다.
       ======================================== -->
  <script>
    (function setupPWA() {
      // ---- 1) 매니페스트를 Blob URL 로 생성해 동적 연결 ----
      try {
        // 인라인 SVG 아이콘 (data URI). manifest 의 icons 로 사용.
        const iconSvg =
          "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%234f46e5'/%3E%3Ctext x='256' y='350' font-size='300' text-anchor='middle' fill='white'%3E%E2%96%A6%3C/text%3E%3C/svg%3E";

        const manifest = {
          name: 'QR 코드 생성기 PRO',
          short_name: 'QR PRO',
          description: '색상/로고/이력/PWA를 지원하는 고급 QR 코드 생성기',
          start_url: '.',
          display: 'standalone',
          background_color: '#0b1020',
          theme_color: '#4f46e5',
          icons: [
            { src: iconSvg, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' },
          ],
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);
      } catch (e) {
        console.warn('[PWA] 매니페스트 생성 실패:', e);
      }

      // ---- 2) 인라인 서비스워커를 Blob URL 로 등록 시도 ----
      if ('serviceWorker' in navigator) {
        try {
          // 매우 단순한 캐싱 SW 소스 (참고용). 실제로는 blob: 스킴이라 등록 거부될 가능성이 높음.
          const swSource = `
            const CACHE = 'qr-pro-v1';
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
              e.respondWith(
                caches.open(CACHE).then((cache) =>
                  cache.match(e.request).then((hit) =>
                    hit || fetch(e.request).then((res) => {
                      try { cache.put(e.request, res.clone()); } catch (_) {}
                      return res;
                    }).catch(() => hit)
                  )
                )
              );
            });
          `;
          const swBlob = new Blob([swSource], { type: 'text/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl)
            .then(() => console.info('[PWA] 서비스워커 등록 성공'))
            .catch((err) => console.warn('[PWA] 서비스워커 등록 실패(예상됨: blob 스킴/HTTPS 필요):', err.message));
        } catch (e) {
          console.warn('[PWA] 서비스워커 설정 중 예외:', e);
        }
      } else {
        console.warn('[PWA] 이 브라우저는 서비스워커를 지원하지 않습니다.');
      }
    })();
  </script>

  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useRef, useEffect, useCallback } = React;

    // 이력 저장용 LocalStorage 키 & 최대 개수
    const HISTORY_KEY = 'qr-pro-history';
    const HISTORY_MAX = 10;

    // ========================================
    // 🎨 Design System Components (순수 프레젠테이션)
    // ========================================

    // 버튼: variant / size / disabled 등 props 로 제어
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button', ...rest }) {
      const variants = {
        primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500',
        secondary: 'bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-gray-100 focus:ring-gray-400',
        danger: 'bg-red-500 hover:bg-red-600 text-white focus:ring-red-400',
        ghost: 'bg-transparent hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-gray-400',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-lg font-semibold
            transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2
            dark:focus:ring-offset-gray-800 disabled:opacity-50 disabled:cursor-not-allowed
            ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    // 입력창: label / error 지원
    function Input({ label, value, onChange, onKeyDown, placeholder, error, id }) {
      return (
        <div className="w-full">
          {label && (
            <label htmlFor={id} className="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">
              {label}
            </label>
          )}
          <input
            id={id}
            type="text"
            value={value}
            onChange={onChange}
            onKeyDown={onKeyDown}
            placeholder={placeholder}
            aria-invalid={!!error}
            className={`w-full px-4 py-3 rounded-xl border text-gray-900 dark:text-gray-100
              bg-white dark:bg-gray-800 placeholder-gray-400 dark:placeholder-gray-500
              focus:outline-none focus:ring-2 transition
              ${error
                ? 'border-red-400 focus:ring-red-400'
                : 'border-gray-300 dark:border-gray-600 focus:ring-indigo-500'}`}
          />
          {error && (
            <p role="alert" className="mt-2 text-sm text-red-500 dark:text-red-400">
              {error}
            </p>
          )}
        </div>
      );
    }

    // 카드: 그림자 + 라운드 래퍼
    function Card({ className = '', children }) {
      return (
        <div className={`bg-white dark:bg-gray-800 rounded-2xl shadow-lg shadow-gray-200/60
          dark:shadow-black/30 border border-gray-100 dark:border-gray-700 ${className}`}>
          {children}
        </div>
      );
    }

    // 컬러 피커: 라벨 + 스와치 + HEX 텍스트 동기화
    function ColorField({ label, value, onChange }) {
      return (
        <div className="flex-1 min-w-[120px]">
          <label className="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">{label}</label>
          <div className="flex items-center gap-2">
            {/* 네이티브 컬러 피커 (스와치) */}
            <input
              type="color"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              aria-label={label}
              className="w-10 h-10 rounded-lg border border-gray-300 dark:border-gray-600 overflow-hidden"
            />
            {/* HEX 직접 입력 */}
            <input
              type="text"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600
                bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>
      );
    }

    // 세그먼트형 선택 (크기 선택용)
    function SegmentedControl({ options, value, onChange, label }) {
      return (
        <div>
          {label && (
            <span className="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">{label}</span>
          )}
          <div className="inline-flex rounded-lg bg-gray-100 dark:bg-gray-700 p-1 w-full" role="group">
            {options.map((opt) => (
              <button
                key={opt.value}
                type="button"
                onClick={() => onChange(opt.value)}
                aria-pressed={value === opt.value}
                className={`flex-1 px-4 py-2 text-sm font-medium rounded-md transition-colors
                  ${value === opt.value
                    ? 'bg-white dark:bg-gray-900 text-indigo-600 dark:text-indigo-400 shadow'
                    : 'text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white'}`}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // 토글 스위치 (자동 생성 on/off)
    function Toggle({ checked, onChange, label }) {
      return (
        <label className="flex items-center justify-between gap-3 cursor-pointer select-none">
          <span className="text-sm font-medium text-gray-700 dark:text-gray-200">{label}</span>
          <span
            role="switch"
            aria-checked={checked}
            onClick={() => onChange(!checked)}
            className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors
              ${checked ? 'bg-indigo-600' : 'bg-gray-300 dark:bg-gray-600'}`}
          >
            <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform
              ${checked ? 'translate-x-6' : 'translate-x-1'}`} />
          </span>
        </label>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    // 헤더 + 다크모드 토글
    function Header({ dark, onToggleDark }) {
      return (
        <header className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl">
              ▦
            </div>
            <div>
              <h1 className="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">QR 코드 생성기 <span className="text-indigo-500">PRO</span></h1>
              <p className="text-xs sm:text-sm text-gray-500 dark:text-gray-400">색상·로고·이력·PWA를 지원하는 고급 버전</p>
            </div>
          </div>
          <Button variant="secondary" size="sm" onClick={onToggleDark} aria-label="다크 모드 전환">
            {dark ? '☀️ 라이트' : '🌙 다크'}
          </Button>
        </header>
      );
    }

    // ========================================
    // 📄 Page Component (메인 기능 로직)
    // ========================================
    function QRGeneratorPage() {
      // ---- 입력/설정 상태 ----
      const [text, setText] = useState('');                 // 입력 텍스트/URL
      const [error, setError] = useState('');               // 경고 메시지
      const [size, setSize] = useState(256);                // QR 크기(px)
      const [fgColor, setFgColor] = useState('#000000');    // 전경색(dots)
      const [bgColor, setBgColor] = useState('#ffffff');    // 배경색
      const [logo, setLogo] = useState(null);               // 중앙 로고 dataURL (없으면 null)
      const [autoGen, setAutoGen] = useState(true);         // 실시간 자동 생성 on/off

      const [generatedText, setGeneratedText] = useState(''); // 현재 QR 에 반영된 텍스트
      const [history, setHistory] = useState([]);              // 생성 이력 목록

      // ---- refs ----
      const qrBoxRef = useRef(null);     // QR 이 append 될 컨테이너 div
      const qrInstance = useRef(null);   // QRCodeStyling 인스턴스 (재사용)
      const fileInputRef = useRef(null); // 로고 파일 input 참조 (값 리셋용)
      const debounceRef = useRef(null);  // debounce 타이머 참조

      // ====================================
      // QRCodeStyling 옵션 빌더
      // - 로고가 있으면 가독성 위해 에러정정 레벨 H, 없으면 M
      // ====================================
      const buildOptions = useCallback((data) => ({
        width: size,
        height: size,
        type: 'canvas',                       // 미리보기는 canvas, 다운로드는 extension 으로 결정
        data,
        image: logo || undefined,             // 중앙 로고 (dataURL)
        margin: 8,
        dotsOptions: { color: fgColor, type: 'rounded' },
        backgroundOptions: { color: bgColor },
        cornersSquareOptions: { color: fgColor },
        cornersDotOptions: { color: fgColor },
        imageOptions: {
          crossOrigin: 'anonymous',
          margin: 6,
          imageSize: 0.4,
          hideBackgroundDots: true,           // 로고 뒤 점 숨겨 가독성 향상
        },
        qrOptions: {
          errorCorrectionLevel: logo ? 'H' : 'M', // 로고 사용 시 H
        },
      }), [size, fgColor, bgColor, logo]);

      // ====================================
      // 인스턴스 생성 + append (최초 1회만)
      // - advisor 지적: append 는 한 번만. 변경은 update() 로 처리.
      // ====================================
      useEffect(() => {
        qrInstance.current = new QRCodeStyling(buildOptions(''));
        if (qrBoxRef.current) {
          qrBoxRef.current.innerHTML = '';      // 안전하게 비우고
          qrInstance.current.append(qrBoxRef.current);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []); // 빈 deps → 마운트 시 1회

      // ====================================
      // 생성 핵심 함수 (수동 버튼 / 자동 생성 공통 경로)
      // - 빈 입력 가드를 한 곳에 둔다.
      // ====================================
      const generate = useCallback(() => {
        const trimmed = text.trim();

        // 빈 입력 → 경고 + QR 숨김 (update({data:''}) 호출하지 않음)
        if (!trimmed) {
          setError('텍스트 또는 URL을 입력해 주세요.');
          setGeneratedText('');
          return;
        }
        setError('');

        // 인스턴스 재사용: update() 로 모든 설정 반영
        if (qrInstance.current) {
          qrInstance.current.update(buildOptions(trimmed));
        }
        setGeneratedText(trimmed);
      }, [text, buildOptions]);

      // ====================================
      // 실시간 자동 생성 (debounce 300ms)
      // - text / size / 색상 / 로고 변경 시 자동 반영
      // - autoGen 이 off 면 동작 안 함
      // ====================================
      useEffect(() => {
        if (!autoGen) return;
        // 기존 타이머 취소
        if (debounceRef.current) clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => {
          generate();
        }, 300);
        // 클린업: 언마운트/재실행 시 타이머 정리
        return () => {
          if (debounceRef.current) clearTimeout(debounceRef.current);
        };
      }, [text, size, fgColor, bgColor, logo, autoGen, generate]);

      // ====================================
      // 자동 생성 OFF 인데 이미 QR 이 떠 있을 때
      // 색상/크기/로고 변경 시 미리보기를 즉시 갱신 (텍스트 입력은 제외)
      // ====================================
      useEffect(() => {
        if (autoGen) return;            // 자동 모드는 위 effect 가 처리
        if (!generatedText) return;     // 아직 생성 전이면 무시
        if (qrInstance.current) {
          qrInstance.current.update(buildOptions(generatedText));
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [size, fgColor, bgColor, logo]);

      // ====================================
      // 이력 로드 (마운트 시 LocalStorage 에서)
      // ====================================
      useEffect(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          if (Array.isArray(saved)) setHistory(saved);
        } catch (e) {
          console.warn('이력 로드 실패:', e);
        }
      }, []);

      // 이력 저장 헬퍼 (state + LocalStorage 동기화)
      const persistHistory = useCallback((list) => {
        setHistory(list);
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        } catch (e) {
          console.warn('이력 저장 실패:', e);
        }
      }, []);

      // ====================================
      // 이력에 현재 설정 추가 (최근 10개 유지)
      // - 같은 (텍스트+색상+크기) 조합은 중복 제거 후 맨 앞으로
      // - 로고 dataURL 은 용량이 커질 수 있어 저장하지 않고 보유 여부만 기록
      // ====================================
      const addToHistory = useCallback(() => {
        const trimmed = text.trim();
        if (!trimmed) return;
        const entry = {
          id: Date.now(),
          text: trimmed,
          size,
          fgColor,
          bgColor,
          hadLogo: !!logo,           // 로고 사용 여부만 기록(용량 절약)
          createdAt: new Date().toISOString(),
        };
        // 동일 설정 중복 제거
        const deduped = history.filter(
          (h) => !(h.text === entry.text && h.fgColor === entry.fgColor && h.bgColor === entry.bgColor && h.size === entry.size)
        );
        const next = [entry, ...deduped].slice(0, HISTORY_MAX);
        persistHistory(next);
      }, [text, size, fgColor, bgColor, logo, history, persistHistory]);

      // 이력 항목 클릭 → 해당 설정으로 복원
      const restoreFromHistory = useCallback((entry) => {
        setText(entry.text);
        setSize(entry.size);
        setFgColor(entry.fgColor);
        setBgColor(entry.bgColor);
        // 로고는 dataURL 을 저장하지 않으므로 복원하지 않음(있으면 안내)
        // 자동 생성이 켜져 있으면 debounce effect 가 곧 반영
      }, []);

      // 이력 개별 삭제
      const removeHistory = useCallback((id) => {
        persistHistory(history.filter((h) => h.id !== id));
      }, [history, persistHistory]);

      // 이력 전체 삭제
      const clearHistory = useCallback(() => {
        persistHistory([]);
      }, [persistHistory]);

      // ====================================
      // 수동 "생성" 버튼: QR 생성 + 이력 저장
      // ====================================
      const handleManualGenerate = () => {
        generate();
        if (text.trim()) addToHistory();
      };

      // 자동 생성 모드에서도 사용자가 명시적으로 생성을 끝낸 시점(blur)에 이력 저장
      const handleInputBlur = () => {
        if (autoGen && text.trim() && generatedText) addToHistory();
      };

      // Enter 키로 생성
      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleManualGenerate();
        }
      };

      // ====================================
      // 로고 업로드: 파일 → dataURL
      // ====================================
      const handleLogoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('이미지 파일만 업로드할 수 있습니다.');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => setLogo(reader.result); // dataURL
        reader.onerror = () => console.warn('로고 읽기 실패');
        reader.readAsDataURL(file);
      };

      // 로고 제거
      const removeLogo = () => {
        setLogo(null);
        if (fileInputRef.current) fileInputRef.current.value = ''; // input 값 리셋
      };

      // ====================================
      // 다운로드 (PNG / SVG) — qr-code-styling download() 사용
      // ====================================
      const downloadAs = (extension) => {
        if (!qrInstance.current || !generatedText) return;
        qrInstance.current.download({ name: 'qrcode', extension }); // 'png' | 'svg'
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {/* ===== 좌측: 설정 패널 ===== */}
          <Card className="p-6 sm:p-8">
            <div className="space-y-5">
              <Input
                id="qr-input"
                label="텍스트 / URL 입력"
                value={text}
                onChange={(e) => { setText(e.target.value); if (error) setError(''); }}
                onKeyDown={handleKeyDown}
                placeholder="예: https://example.com 또는 원하는 텍스트"
                error={error}
              />

              {/* 색상 설정 (전경/배경) */}
              <div className="flex gap-3">
                <ColorField label="전경색 (점 색상)" value={fgColor} onChange={setFgColor} />
                <ColorField label="배경색" value={bgColor} onChange={setBgColor} />
              </div>

              {/* 크기 선택 */}
              <SegmentedControl
                label="QR 코드 크기"
                value={size}
                onChange={setSize}
                options={[
                  { value: 128, label: '128px' },
                  { value: 256, label: '256px' },
                  { value: 512, label: '512px' },
                ]}
              />

              {/* 로고 업로드 */}
              <div>
                <span className="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">중앙 로고 이미지</span>
                <div className="flex items-center gap-3 flex-wrap">
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    onChange={handleLogoUpload}
                    className="block text-sm text-gray-600 dark:text-gray-300
                      file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0
                      file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600
                      dark:file:bg-gray-700 dark:file:text-indigo-300 file:cursor-pointer"
                  />
                  {logo && (
                    <Button variant="danger" size="sm" onClick={removeLogo}>로고 제거</Button>
                  )}
                </div>
                {logo && (
                  <p className="mt-2 text-xs text-gray-500 dark:text-gray-400">
                    로고 적용됨 — 가독성을 위해 오류 정정 레벨이 H로 상향됩니다.
                  </p>
                )}
              </div>

              {/* 자동 생성 토글 + 수동 생성 버튼 */}
              <div className="pt-2 border-t border-gray-100 dark:border-gray-700 space-y-4">
                <Toggle
                  label="실시간 자동 생성 (입력 시 자동 반영)"
                  checked={autoGen}
                  onChange={setAutoGen}
                />
                <Button
                  size="lg"
                  className="w-full"
                  onClick={handleManualGenerate}
                >
                  QR 코드 생성
                </Button>
              </div>
            </div>
          </Card>

          {/* ===== 우측: 결과 + 이력 ===== */}
          <div className="space-y-6">
            {/* 결과 카드 */}
            <Card className="p-6 sm:p-8">
              <div className="flex flex-col items-center" onBlur={handleInputBlur}>
                {/* 빈 상태 안내 */}
                {!generatedText && (
                  <div className="text-center text-gray-400 dark:text-gray-500 py-10">
                    <div className="text-5xl mb-3">▦</div>
                    <p className="text-sm">텍스트를 입력하면 QR 코드가 생성됩니다.</p>
                  </div>
                )}

                {/* QR 박스: 항상 마운트(인스턴스가 append 됨). 빈 상태면 숨김 */}
                <div
                  className={generatedText ? 'animate-fade-in-up' : ''}
                  style={{ display: generatedText ? 'block' : 'none' }}
                >
                  <div className="inline-block p-4 bg-white rounded-xl shadow-md border border-gray-200">
                    {/* qr-code-styling 인스턴스가 이 div 안에 canvas 를 append */}
                    <div ref={qrBoxRef} className="flex items-center justify-center" />
                  </div>

                  {/* 원본 텍스트 표시 */}
                  {generatedText && (
                    <p className="mt-4 max-w-xs sm:max-w-sm break-words text-center text-sm text-gray-600 dark:text-gray-300 mx-auto">
                      <span className="font-medium text-gray-400 dark:text-gray-500">원본: </span>
                      {generatedText}
                    </p>
                  )}

                  {/* 다운로드 버튼 (PNG / SVG) */}
                  {generatedText && (
                    <div className="mt-4 flex justify-center gap-3">
                      <Button variant="secondary" onClick={() => downloadAs('png')}>⬇️ PNG</Button>
                      <Button variant="secondary" onClick={() => downloadAs('svg')}>⬇️ SVG</Button>
                    </div>
                  )}
                </div>
              </div>
            </Card>

            {/* 이력 카드 */}
            <Card className="p-6 sm:p-8">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-base font-bold text-gray-900 dark:text-white">최근 생성 이력 <span className="text-gray-400 text-sm font-normal">({history.length}/{HISTORY_MAX})</span></h2>
                {history.length > 0 && (
                  <Button variant="ghost" size="sm" onClick={clearHistory}>전체 삭제</Button>
                )}
              </div>

              {history.length === 0 ? (
                <p className="text-sm text-gray-400 dark:text-gray-500 py-4 text-center">저장된 이력이 없습니다.</p>
              ) : (
                <ul className="space-y-2 max-h-80 overflow-y-auto pr-1">
                  {history.map((h) => (
                    <li
                      key={h.id}
                      className="flex items-center gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-700
                        hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors"
                    >
                      {/* 색상 미리보기 스와치 */}
                      <span className="flex-shrink-0 w-8 h-8 rounded-md border border-gray-200 dark:border-gray-600"
                        style={{ background: h.bgColor }}>
                        <span className="block w-full h-full rounded-md scale-50" style={{ background: h.fgColor, borderRadius: 4 }} />
                      </span>
                      {/* 텍스트 + 메타 (클릭 시 복원) */}
                      <button
                        type="button"
                        onClick={() => restoreFromHistory(h)}
                        className="flex-1 text-left min-w-0"
                        title="클릭하면 이 설정으로 복원합니다"
                      >
                        <p className="truncate text-sm font-medium text-gray-800 dark:text-gray-100">{h.text}</p>
                        <p className="text-xs text-gray-400 dark:text-gray-500">
                          {h.size}px · {h.fgColor}{h.hadLogo ? ' · 로고' : ''}
                        </p>
                      </button>
                      {/* 개별 삭제 */}
                      <button
                        type="button"
                        onClick={() => removeHistory(h.id)}
                        aria-label="이력 삭제"
                        className="flex-shrink-0 text-gray-400 hover:text-red-500 transition-colors text-lg leading-none px-1"
                      >
                        ×
                      </button>
                    </li>
                  ))}
                </ul>
              )}
              {history.some((h) => h.hadLogo) && (
                <p className="mt-3 text-xs text-gray-400 dark:text-gray-500">
                  ※ 로고 이미지는 용량 문제로 이력에 저장되지 않습니다. 복원 후 다시 업로드하세요.
                </p>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      // 다크모드 상태 (시스템 설정 초기값 반영)
      const [dark, setDark] = useState(
        () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      );

      // dark 값이 바뀔 때 <html> 에 class 토글
      useEffect(() => {
        const root = document.documentElement;
        if (dark) root.classList.add('dark');
        else root.classList.remove('dark');
      }, [dark]);

      return (
        <div className="min-h-screen px-4 py-8 sm:py-12">
          <div className="max-w-5xl mx-auto">
            <Header dark={dark} onToggleDark={() => setDark((d) => !d)} />
            <QRGeneratorPage />
            <footer className="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
              React + Tailwind CSS · qr-code-styling 기반 · 단일 HTML 파일 · PWA 메타 포함
            </footer>
          </div>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
