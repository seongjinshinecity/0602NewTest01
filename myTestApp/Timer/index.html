<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Timer · 비주얼 타이머</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Editorial serif type — Cormorant (display) + Noto Serif KR (Korean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@200;300;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: {
          display: ["'Cormorant Garamond'", "'Noto Serif KR'", "serif"],
          serifkr: ["'Noto Serif KR'", "serif"],
        },
      }},
    };
  </script>

  <style>
    /* Prevent the page from scrolling/zooming while dragging the dial on touch devices */
    .dial-surface { touch-action: none; -webkit-user-select: none; user-select: none; }

    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 1; }
      70%  { transform: scale(1.03); opacity: .7; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .ring-done { animation: pulse-ring 1.1s ease-in-out infinite; }

    /* ---- End-of-timer urgency cues ---- */
    /* Full-screen warm veil that blinks once per period (one on/off cycle). */
    @keyframes flash-veil {
      0%, 100% { opacity: 0; }
      50%      { opacity: .55; }
    }
    .flash-veil {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 50%, rgba(244,63,94,.0) 25%, rgba(244,63,94,.55) 100%),
                  rgba(244,63,94,.28);
      opacity: 0;
    }
    .flash-1s  { animation: flash-veil 1s   ease-in-out infinite; }   /* ≤10s left */
    .flash-05s { animation: flash-veil .5s  ease-in-out infinite; }   /* ≤3s left  */

    /* Wedge pulses toward 20% opacity in the final 3 seconds. */
    @keyframes wedge-fade {
      0%, 100% { opacity: 1; }
      50%      { opacity: .2; }
    }
    .wedge-urgent { animation: wedge-fade .5s ease-in-out infinite; }

    /* ---- "New Aesthetic" misty background: lime glow (top) + teal glow (bottom)
           over a soft periwinkle→sage wash, inspired by the reference art. ---- */
    body {
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      background:
        radial-gradient(120% 78% at 50% 8%,  rgba(190,242,100,.55) 0%, rgba(190,242,100,0) 46%),
        radial-gradient(110% 70% at 50% 104%, rgba(45,212,191,.42)  0%, rgba(45,212,191,0)  52%),
        radial-gradient(90% 60% at 12% 30%,   rgba(165,180,252,.30) 0%, rgba(165,180,252,0) 55%),
        linear-gradient(180deg, #e9eaf4 0%, #eef4ee 42%, #e6f1ec 100%);
      background-attachment: fixed;
    }
    /* Halftone dot texture, fading out toward the edges (echoes the 2nd reference). */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(rgba(71,85,105,.20) 1px, transparent 1.7px);
      background-size: 13px 13px;
      -webkit-mask-image: radial-gradient(125% 95% at 50% 42%, #000 0%, transparent 74%);
              mask-image: radial-gradient(125% 95% at 50% 42%, #000 0%, transparent 74%);
      opacity: .55;
    }
    #root { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========================================
    // 🔊 Audio — Web Audio API beep sequence (no external files)
    // AudioContext is created lazily and resumed on a user gesture so the
    // final alert is never blocked by the browser autoplay policy.
    // ========================================
    function useAlarm() {
      const ctxRef = useRef(null);

      const ensureCtx = useCallback(() => {
        if (!ctxRef.current) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctxRef.current = new AC();
        }
        // Resume if the browser suspended it (must happen inside a gesture).
        if (ctxRef.current && ctxRef.current.state === "suspended") {
          ctxRef.current.resume();
        }
        return ctxRef.current;
      }, []);

      // Play a soft, mellow chime — low-passed sine notes with a gentle,
      // long bell-like envelope so it fades out smoothly instead of beeping.
      const playAlarm = useCallback(() => {
        const ctx = ensureCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        // C5, E5, G5 — major triad, played as two slow overlapping arpeggios.
        const notes = [523.25, 659.25, 783.99];
        const tone = (freq, start, dur, peak) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const lp = ctx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 1300;   // shave harsh highs for a warmer tone
          lp.Q.value = 0.6;
          osc.type = "sine";
          osc.frequency.value = freq;
          // Gentle attack + long, smooth exponential release.
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(peak, start + 0.07);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(lp).connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + dur + 0.05);
        };
        // Quieter (peak ~0.12 vs old 0.25), slower spacing, much longer decay.
        notes.forEach((f, i) => tone(f, now + i * 0.30, 1.2, 0.12));
        notes.forEach((f, i) => tone(f, now + 1.05 + i * 0.30, 1.5, 0.09));
      }, [ensureCtx]);

      return { ensureCtx, playAlarm };
    }

    // ========================================
    // 🎨 Design System — Icons (inline SVG, currentColor)
    // ========================================
    const Icon = ({ path, className = "w-6 h-6", filled = false }) => (
      <svg viewBox="0 0 24 24" className={className}
           fill={filled ? "currentColor" : "none"}
           stroke={filled ? "none" : "currentColor"} strokeWidth="2"
           strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        {path}
      </svg>
    );
    const PlayIcon  = (p) => <Icon {...p} filled path={<path d="M8 5v14l11-7z" />} />;
    const PauseIcon = (p) => <Icon {...p} filled path={<g><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g>} />;
    const ResetIcon = (p) => <Icon {...p} path={<g><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></g>} />;

    // ========================================
    // 🎨 Design System — Button
    // ========================================
    function Button({ variant = "primary", size = "md", className = "", children, ...rest }) {
      const variants = {
        primary:   "bg-gradient-to-br from-teal-400 to-emerald-500 hover:from-teal-300 hover:to-emerald-500 text-white shadow-lg shadow-emerald-600/25",
        secondary: "bg-white/45 hover:bg-white/65 text-slate-700 border border-white/70 backdrop-blur-md shadow-sm",
        ghost:     "bg-transparent hover:bg-white/40 text-slate-600",
        danger:    "bg-slate-700/90 hover:bg-slate-800 text-white shadow-sm backdrop-blur-md",
      };
      const sizes = {
        sm: "px-3 py-1.5 text-sm gap-1.5",
        md: "px-5 py-2.5 text-base gap-2",
        lg: "px-7 py-3.5 text-lg gap-2.5",
      };
      return (
        <button
          className={`inline-flex items-center justify-center font-medium tracking-wide rounded-2xl
            transition-all duration-150 active:scale-95 disabled:opacity-40
            disabled:cursor-not-allowed focus:outline-none focus-visible:ring-4
            focus-visible:ring-emerald-500/25 ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}>
          {children}
        </button>
      );
    }

    // ========================================
    // 🎨 Design System — QuickChip (preset minute button)
    // ========================================
    function QuickChip({ active, label, onClick, disabled }) {
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          aria-pressed={active}
          className={`px-5 py-2 rounded-full text-sm font-medium tracking-wide transition-all
            duration-150 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed
            focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-500/25
            ${active
              ? "bg-gradient-to-br from-teal-400 to-emerald-500 text-white shadow-md shadow-emerald-600/25"
              : "bg-white/45 text-slate-600 border border-white/70 backdrop-blur-md hover:bg-white/65 hover:text-emerald-700"}`}>
          {label}
        </button>
      );
    }

    // ========================================
    // 🧩 Geometry helpers for the SVG wedge
    // Fixed 60-minute face: each minute = 6°. Wedge sweeps CLOCKWISE from 12 o'clock.
    // ========================================
    const TAU = Math.PI * 2;

    // Convert an angle measured clockwise from 12 o'clock (in degrees) to an
    // (x, y) point on a circle of radius r centered at (cx, cy).
    function polar(cx, cy, r, deg) {
      const rad = (deg - 90) * (Math.PI / 180); // -90 so 0° points up (12 o'clock)
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    // Build an SVG path string for a filled pie wedge from 0° up to `sweep` degrees,
    // sweeping clockwise from the 12 o'clock position.
    function wedgePath(cx, cy, r, sweep) {
      if (sweep <= 0) return "";
      if (sweep >= 360) return null; // signal caller to draw a full <circle> instead
      const start = polar(cx, cy, r, 0);
      const end = polar(cx, cy, r, sweep);
      const largeArc = sweep > 180 ? 1 : 0;
      // M center -> L start (top) -> A arc to end -> Z back to center
      return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
    }

    // ========================================
    // 🧩 TimerDial — the visual circle + drag-to-set interaction
    // ========================================
    function TimerDial({ totalSeconds, remainingSeconds, isRunning, isDone, phase, onScrub }) {
      const SIZE = 320;          // viewBox size
      const C = SIZE / 2;        // center
      const R = 132;             // wedge radius
      const svgRef = useRef(null);
      const draggingRef = useRef(false);

      // Wedge angle is derived from REMAINING seconds against the 60-min face.
      const sweepDeg = (remainingSeconds / 3600) * 360;
      const path = wedgePath(C, C, R, sweepDeg);
      const isFull = path === null;

      // --- Drag-to-set (pointer events: unified mouse + touch) ---
      const allowDrag = !isRunning; // only adjust when idle or paused

      const pointToMinute = useCallback((clientX, clientY) => {
        const svg = svgRef.current;
        if (!svg) return null;
        const rect = svg.getBoundingClientRect();
        // Map screen point into the SVG viewBox coordinate space.
        const x = ((clientX - rect.left) / rect.width) * SIZE - C;
        const y = ((clientY - rect.top) / rect.height) * SIZE - C;
        // atan2 has 0 at 3 o'clock; +90 shifts origin to 12 o'clock, clockwise.
        let deg = (Math.atan2(y, x) * 180) / Math.PI + 90;
        deg = ((deg % 360) + 360) % 360;
        let minute = Math.round(deg / 6); // 6° per minute
        if (minute > 60) minute = 60;
        if (minute < 0) minute = 0;
        return minute;
      }, []);

      const handleDown = useCallback((e) => {
        if (!allowDrag) return;
        draggingRef.current = true;
        e.currentTarget.setPointerCapture?.(e.pointerId);
        const m = pointToMinute(e.clientX, e.clientY);
        if (m !== null) onScrub(m * 60);
      }, [allowDrag, pointToMinute, onScrub]);

      const handleMove = useCallback((e) => {
        if (!draggingRef.current || !allowDrag) return;
        const m = pointToMinute(e.clientX, e.clientY);
        if (m !== null) onScrub(m * 60);
      }, [allowDrag, pointToMinute, onScrub]);

      const handleUp = useCallback((e) => {
        draggingRef.current = false;
        e.currentTarget.releasePointerCapture?.(e.pointerId);
      }, []);

      // Minute tick marks around the face.
      const ticks = useMemo(() => {
        const arr = [];
        for (let i = 0; i < 60; i++) {
          const major = i % 5 === 0;
          const outer = polar(C, C, R + 18, i * 6);
          const inner = polar(C, C, R + (major ? 6 : 11), i * 6);
          arr.push({ i, major, x1: inner.x, y1: inner.y, x2: outer.x, y2: outer.y });
        }
        return arr;
      }, []);

      // Number labels every 5 minutes (0,5,10,...,55).
      const labels = useMemo(() => {
        const arr = [];
        for (let i = 0; i < 60; i += 5) {
          const p = polar(C, C, R + 33, i * 6);
          arr.push({ i, x: p.x, y: p.y });
        }
        return arr;
      }, []);

      return (
        <div className="relative w-full max-w-[360px] aspect-square mx-auto">
          <svg
            ref={svgRef}
            viewBox={`-16 -16 ${SIZE + 32} ${SIZE + 32}`}
            className={`dial-surface w-full h-full ${allowDrag ? "cursor-grab active:cursor-grabbing" : "cursor-default"} ${isDone ? "ring-done origin-center" : ""}`}
            onPointerDown={handleDown}
            onPointerMove={handleMove}
            onPointerUp={handleUp}
            onPointerCancel={handleUp}
            role="slider"
            aria-label="타이머 시간 설정 다이얼"
            aria-valuemin={0}
            aria-valuemax={60}
            aria-valuenow={Math.round(remainingSeconds / 60)}
            aria-valuetext={`${Math.round(remainingSeconds / 60)}분`}>

            {/* Gradient + glow defs for the wedge */}
            <defs>
              <linearGradient id="wedgeGrad" x1="0" y1="0" x2="0.85" y2="1">
                <stop offset="0%"   stopColor="#bef264" />
                <stop offset="50%"  stopColor="#34d399" />
                <stop offset="100%" stopColor="#2dd4bf" />
              </linearGradient>
              <radialGradient id="plateGrad" cx="50%" cy="42%" r="62%">
                <stop offset="0%"   stopColor="#ffffff" stopOpacity="0.85" />
                <stop offset="100%" stopColor="#ffffff" stopOpacity="0.35" />
              </radialGradient>
              <filter id="wedgeGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="0" stdDeviation={isDone ? 9 : 5}
                              floodColor="#34d399" floodOpacity={isDone ? 0.65 : 0.4} />
              </filter>
            </defs>

            {/* Outer frosted plate */}
            <circle cx={C} cy={C} r={R + 14} fill="url(#plateGrad)"
                    stroke="rgba(148,163,184,0.35)" strokeWidth="1.5" />

            {/* Tick marks */}
            {ticks.map((t) => (
              <line key={t.i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
                    stroke={t.major ? "#7c8aa0" : "#c2cad6"}
                    strokeWidth={t.major ? 2.5 : 1.2} strokeLinecap="round" />
            ))}

            {/* Minute labels (serif) */}
            {labels.map((l) => (
              <text key={l.i} x={l.x} y={l.y} fill="#5b667a" fontSize="15"
                    fontFamily="'Cormorant Garamond', serif" fontWeight="600"
                    textAnchor="middle" dominantBaseline="central">
                {l.i}
              </text>
            ))}

            {/* Face background (empty area) */}
            <circle cx={C} cy={C} r={R} fill="rgba(248,250,252,0.55)" />

            {/* The remaining-time wedge */}
            <g filter="url(#wedgeGlow)" className={phase === "urgent" ? "wedge-urgent" : ""}>
              {isFull
                ? <circle cx={C} cy={C} r={R} fill="url(#wedgeGrad)" />
                : (path && <path d={path} fill="url(#wedgeGrad)" />)}
            </g>

            {/* Center hub */}
            <circle cx={C} cy={C} r={6} fill="#ffffff" stroke="rgba(148,163,184,0.6)" strokeWidth="2" />
          </svg>

          {/* Centered MM:SS readout overlay (HTML so it scales with the box) */}
          <div className="absolute inset-x-0 top-[30%] -translate-y-1/2 flex flex-col items-center pointer-events-none select-none">
            <span className="font-display tabular-nums font-medium tracking-tight text-slate-800
                             text-[clamp(3rem,16vw,4.75rem)] leading-none">
              {formatTime(remainingSeconds)}
            </span>
            <span className="mt-1 font-serifkr text-[11px] font-medium tracking-[0.25em] uppercase text-slate-500/90">
              {isDone ? "완료" : isRunning ? "진행 중" : remainingSeconds > 0 ? "드래그로 조절" : "시간 설정"}
            </span>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Helpers
    // ========================================
    function formatTime(totalSec) {
      const s = Math.max(0, Math.ceil(totalSec));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    const PRESETS = [
      { label: "5분", minutes: 5 },
      { label: "15분", minutes: 15 },
      { label: "25분", minutes: 25 },
    ];

    // ========================================
    // 📄 TimerApp — main page (state + business logic)
    // ========================================
    function TimerApp() {
      const { ensureCtx, playAlarm } = useAlarm();

      // configuredSeconds: the time the user set (the dial when idle).
      const [configuredSeconds, setConfiguredSeconds] = useState(25 * 60);
      // remaining: live remaining seconds shown by the wedge & readout.
      const [remaining, setRemaining] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [isDone, setIsDone] = useState(false);

      // Wall-clock end timestamp drives a smooth, drift-free countdown.
      const endAtRef = useRef(0);
      const rafRef = useRef(null);
      const doneFiredRef = useRef(false);

      // --- The smooth ticking loop (rAF, derives remaining from wall clock) ---
      useEffect(() => {
        if (!isRunning) return;

        const tick = () => {
          const left = (endAtRef.current - Date.now()) / 1000;
          if (left <= 0) {
            setRemaining(0);
            setIsRunning(false);
            setIsDone(true);
            if (!doneFiredRef.current) {
              doneFiredRef.current = true;
              playAlarm();
            }
            return; // stop scheduling
          }
          setRemaining(left);
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [isRunning, playAlarm]);

      // --- Controls ---
      const handleStart = useCallback(() => {
        if (remaining <= 0) return;
        ensureCtx();                 // unlock/resume audio inside the gesture
        doneFiredRef.current = false;
        setIsDone(false);
        endAtRef.current = Date.now() + remaining * 1000;
        setIsRunning(true);
      }, [remaining, ensureCtx]);

      const handlePause = useCallback(() => {
        setIsRunning(false);
        // remaining already reflects the latest tick; freeze it as-is.
      }, []);

      const handleReset = useCallback(() => {
        setIsRunning(false);
        setIsDone(false);
        doneFiredRef.current = false;
        setRemaining(configuredSeconds);
      }, [configuredSeconds]);

      // --- Set time (presets + drag scrub) ---
      const applyPreset = useCallback((minutes) => {
        const secs = minutes * 60;
        setIsRunning(false);
        setIsDone(false);
        doneFiredRef.current = false;
        setConfiguredSeconds(secs);
        setRemaining(secs);
      }, []);

      const handleScrub = useCallback((secs) => {
        // Dragging the dial sets both the configured and remaining time.
        setIsDone(false);
        doneFiredRef.current = false;
        setConfiguredSeconds(secs);
        setRemaining(secs);
      }, []);

      const activePreset = !isRunning && remaining === configuredSeconds
        ? PRESETS.find((p) => p.minutes * 60 === configuredSeconds)?.minutes
        : null;

      // Urgency phase while running: warn ≤10s, urgent ≤3s.
      const phase = isRunning && remaining > 0
        ? (remaining <= 3 ? "urgent" : remaining <= 10 ? "warn" : "normal")
        : "normal";

      return (
        <div className="min-h-screen flex flex-col items-center justify-center px-4 py-10">
          {/* Blinking warm veil for the final countdown */}
          <div className={`flash-veil ${phase === "urgent" ? "flash-05s" : phase === "warn" ? "flash-1s" : ""}`} aria-hidden="true" />

          <div className="relative z-10 w-full max-w-md flex flex-col items-center gap-7
                          rounded-[2rem] px-6 sm:px-9 py-9
                          bg-white/35 backdrop-blur-xl border border-white/55
                          shadow-[0_30px_70px_-30px_rgba(71,85,105,0.45)]
                          ring-1 ring-slate-300/30">

            {/* Header — editorial serif with an uppercase eyebrow */}
            <header className="text-center">
              <p className="text-[10px] font-medium tracking-[0.42em] uppercase text-emerald-700/70">
                Visual Focus Timer
              </p>
              <h1 className="mt-2 font-display text-4xl sm:text-5xl font-medium text-slate-800 tracking-tight">
                비주얼 타이머
              </h1>
              <p className="mt-2 font-serifkr text-sm text-slate-500/90">남은 시간이 한눈에 보이는 뽀모도로 타이머</p>
            </header>

            {/* Quick presets */}
            <div className="flex items-center gap-2 flex-wrap justify-center" role="group" aria-label="빠른 시간 설정">
              {PRESETS.map((p) => (
                <QuickChip
                  key={p.minutes}
                  label={p.label}
                  active={activePreset === p.minutes}
                  onClick={() => applyPreset(p.minutes)}
                />
              ))}
            </div>

            {/* The dial */}
            <TimerDial
              totalSeconds={configuredSeconds}
              remainingSeconds={remaining}
              isRunning={isRunning}
              isDone={isDone}
              phase={phase}
              onScrub={handleScrub}
            />

            {/* Controls */}
            <div className="flex items-center justify-center gap-3 w-full">
              {!isRunning ? (
                <Button size="lg" onClick={handleStart} disabled={remaining <= 0} className="flex-1 max-w-[160px]">
                  <PlayIcon className="w-5 h-5" />
                  {isDone ? "다시 시작" : remaining < configuredSeconds && remaining > 0 ? "계속" : "시작"}
                </Button>
              ) : (
                <Button size="lg" variant="danger" onClick={handlePause} className="flex-1 max-w-[160px]">
                  <PauseIcon className="w-5 h-5" />
                  일시정지
                </Button>
              )}
              <Button size="lg" variant="secondary" onClick={handleReset} aria-label="초기화">
                <ResetIcon className="w-5 h-5" />
                초기화
              </Button>
            </div>

            {/* Footer hint */}
            <p className="font-serifkr text-xs text-slate-400 text-center max-w-xs leading-relaxed">
              원판을 마우스로 끌거나 터치해 시간을 조절하세요 (1분 단위, 최대 60분).
              타이머가 끝나면 알림음이 울립니다.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App + Render
    // ========================================
